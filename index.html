function openGoogleCalInvite(day){
  const invited=day.members.map(id=>getMember(id)).filter(m=>m&&m.email);
  // Build Google Calendar URL
  // Date format: YYYYMMDDTHHMMSS
  const datePart=day.date.replace(/-/g,'');
  const startPart=`${datePart}T${(day.startTime||'09:00').replace(':','')}00`;
  const endPart=`${datePart}T${(day.endTime||'17:00').replace(':','')}00`;
  const params=new URLSearchParams({
    action:'TEMPLATE',
    text:day.title||'Co-working Day',
    dates:`${startPart}/${endPart}`,
    details:`Co-working day organised via ProjectFlow.${day.objectives?'\n\nObjectives:\n'+day.objectives:''}${day.notes?'\n\nLocation: '+day.notes:''}${invited.length?'\n\nInvited: '+invited.map(m=>m.name).join(', '):''}`,
    location:day.notes||'',
    add:invited.map(m=>m.email).join(','), // pre-fills guest list
  });
  window.open(`https://calendar.google.com/calendar/render?${params.toString()}`,'_blank');
}

function downloadICS(day){
  const invited=day.members.map(id=>getMember(id)).filter(Boolean);
  const withEmail=invited.filter(m=>m.email);
  // Format dates for ICS (YYYYMMDDTHHMMSS)
  const datePart=day.date.replace(/-/g,'');
  const startDT=`${datePart}T${(day.startTime||'09:00').replace(':','')}00`;
  const endDT=`${datePart}T${(day.endTime||'17:00').replace(':','')}00`;
  const now=new Date().toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';
  const uid_val=`cowork-${day.id}@projectflow`;
  // Build attendee lines
  const attendeeLines=withEmail.map(m=>`ATTENDEE;CUTYPE=INDIVIDUAL;ROLE=REQ-PARTICIPANT;RSVP=TRUE;CN=${m.name}:mailto:${m.email}`).join('\r\n');
  const ics=[
    'BEGIN:VCALENDAR',
    'VERSION:2.0',
    'PRODID:-//ProjectFlow//CoworkingDay//EN',
    'CALSCALE:GREGORIAN',
    'METHOD:REQUEST',
    'BEGIN:VEVENT',
    `UID:${uid_val}`,
    `DTSTAMP:${now}`,
    `DTSTART:${startDT}`,
    `DTEND:${endDT}`,
    `SUMMARY:${day.title||'Co-working Day'}`,
    `LOCATION:${day.notes||''}`,
    `DESCRIPTION:Co-working day organised via ProjectFlow.${invited.length?' Invited: '+invited.map(m=>m.name).join(', '):''}`,
    attendeeLines,
    'STATUS:CONFIRMED',
    'SEQUENCE:0',
    'BEGIN:VALARM',
    'TRIGGER:-PT1H',
    'ACTION:DISPLAY',
    'DESCRIPTION:Reminder',
    'END:VALARM',
    'END:VEVENT',
    'END:VCALENDAR'
  ].filter(Boolean).join('\r\n');

  const blob=new Blob([ics],{type:'text/calendar;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`${(day.title||'coworking-day').toLowerCase().replace(/\s+/g,'-')}.ics`;
  a.click();
  URL.revokeObjectURL(a.href);
}

function _openToolModal(projId,toolId){
  const p=getProject(projId);if(!p)return;
  const tool=toolId?(p.tools||[]).find(t=>t.id===toolId):null;
  const mc=el('mc');mc.style.display='flex';
  mc.innerHTML=`<div class="mo" onclick="if(event.target.classList.contains('mo'))closeModal()">
  <div class="mo-box" style="max-width:400px;">
    <div class="mo-hd"><span class="mo-title">${tool?'Edit tool':'Add tool'}</span><button class="mo-close" onclick="closeModal()">×</button></div>
    <div class="mo-body">
      <div class="field"><label class="flbl">Tool name *</label><input class="inp" id="pt-tool-name" value="${tool?.name||''}" placeholder="e.g. Figma, Notion, Adobe CC"></div>
      <div class="field"><label class="flbl">Cost type</label>
        <select class="sel" id="pt-tool-cost">
          <option value="free" ${(tool?.cost||'free')==='free'?'selected':''}>Free</option>

          <option value="onetime" ${tool?.cost==='onetime'?'selected':''}>One-time payment</option>
        </select>

    </div>

      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-acc" onclick="_saveProjectTool('${projId}','${toolId||''}')">Save</button>
    </div>
  </div></div>`;
  setTimeout(()=>el('pt-tool-name')?.focus(),60);
}

function _saveProjectTool(projId,toolId){
  const name=el('pt-tool-name')?.value.trim();
  if(!name){el('pt-tool-name').style.borderColor='var(--red)';return;}
  const p=getProject(projId);if(!p)return;
  if(!p.tools)p.tools=[];
  const cost=el('pt-tool-cost')?.value||'free';
  const url=el('pt-tool-url')?.value.trim()||'';
  if(toolId){
    const idx=p.tools.findIndex(t=>t.id===toolId);
    if(idx>=0)p.tools[idx]={...p.tools[idx],name,cost,url};
  } else {
    p.tools.push({id:uid(),name,cost,url});
  }
  save();closeModal();render();
}

function deleteProjectTool(projId,toolId){
  const p=getProject(projId);if(!p)return;
  p.tools=(p.tools||[]).filter(t=>t.id!==toolId);
  save();render();
}

function deleteTask(id){
  const t=getTask(id);if(!t)return;
  const childCount=(function countAll(tid){return kids(tid).reduce((a,c)=>a+1+countAll(c.id),0);})(id);
  const mc=el('mc');

  mc.innerHTML=`<div class="mo" onclick="if(event.target.classList.contains('mo'))closeModal()">

      <button class="btn btn-danger" onclick="_confirmDeleteTask('${id}')">${btnLabel}</button>

  </div></div>`;
}
function _confirmDeleteTask(id){
  saveWithUndo('Delete task');
  (function del(tid){S.tasks=S.tasks.filter(t=>t.id!==tid);kids(tid).forEach(c=>del(c.id));})(id);
  save();closeModal();render();
}

setInterval(checkReminders,30000);

function getNavIconSvg(view){
  const customId=S.settings?.navIcons?.[view];
  const opts=NAV_ICON_OPTIONS[view]||[];
  const icon=opts.find(o=>o.id===customId)||opts[0];
  return icon?icon.d:'';
}

function setNavIcon(view,iconId,btn){
  if(!S.settings.navIcons)S.settings.navIcons={};
  S.settings.navIcons[view]=iconId;
  save();
  // Update button visual
  btn.closest('.icon-picker-grid')?.querySelectorAll('.icon-opt').forEach(b=>b.classList.remove('sel'));
  btn.classList.add('sel');
  // Update rail and panel nav
  applyNavIcons();
}

function applyNavIcons(){
  if(!S.settings?.navIcons)return;
  Object.entries(S.settings.navIcons).forEach(([view,iconId])=>{
    const opts=NAV_ICON_OPTIONS[view]||[];
    const icon=opts.find(o=>o.id===iconId);if(!icon)return;
    const svgContent=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">${icon.d}</svg>`;
    // Rail button
    document.querySelectorAll(`.rbtn[data-v="${view}"]`).forEach(btn=>{btn.innerHTML=svgContent;});
  });
}

function openIconPickerModal(view){
  const opts=NAV_ICON_OPTIONS[view]||[];
  const curId=S.settings?.navIcons?.[view]||opts[0]?.id;
  const html=`<div class="mo" onclick="if(event.target.classList.contains('mo'))closeModal()"><div class="mo-box" style="max-width:480px;">

/* ════ DRAG AND DROP — pointer events (mouse + macOS trackpad + touch) ════
   Works on macOS Chrome: click-and-hold then drag. No setPointerCapture.
   Document-level listeners ensure tracking even when pointer leaves element.
════ */
let _dnd={active:false,el:null,ghost:null,data:null,sx:0,sy:0,type:null};

function _dndGlobalMove(e){
  if(!_dnd.el)return;
  const dx=Math.abs(e.clientX-_dnd.sx),dy=Math.abs(e.clientY-_dnd.sy);
  if(!_dnd.active){
    if(dx<8&&dy<8)return; // dead zone — don't trigger on small movements/accidental touches
    // Threshold exceeded → begin drag
    _dnd.active=true;
    // Lock scroll on the dragged row only (not globally)
    if(_dnd.type==='task'){
      const row=_dnd.el?.querySelector('.task-row');
      if(row)row.style.touchAction='none';
    }
    // Kill any text selection
    window.getSelection()?.removeAllRanges();
    document.body.style.userSelect='none';
    document.body.style.webkitUserSelect='none';
    document.body.style.cursor='grabbing';
    // Create visual ghost
    const g=_dnd.el.cloneNode(true);
    const r=_dnd.el.getBoundingClientRect();
    g.style.cssText=`position:fixed;z-index:9999;pointer-events:none;opacity:.78;`+
      `border-radius:10px;box-shadow:0 12px 40px rgba(0,0,0,.65);`+
      `transform:rotate(1.5deg) scale(0.97);width:${r.width}px;transition:none;`+
      `left:${e.clientX-r.width/2}px;top:${e.clientY-32}px;`;
    document.body.appendChild(g);
    _dnd.ghost=g;
    _dnd.el.style.opacity='0.3';
    _dnd.el.style.pointerEvents='none';
  }
  // Move ghost
  if(_dnd.ghost){
    const r=_dnd.el.getBoundingClientRect();
    _dnd.ghost.style.left=(e.clientX-r.width/2)+'px';
    _dnd.ghost.style.top=(e.clientY-32)+'px';
  }
  _dndHighlight(e);
}

function _dndGlobalEnd(e){
  // Remove global listeners
  document.removeEventListener('pointermove',_dndGlobalMove);
  document.removeEventListener('pointerup',_dndGlobalEnd);
  document.removeEventListener('pointercancel',_dndGlobalEnd);
  // Restore styles
  document.body.style.userSelect='';
  document.body.style.webkitUserSelect='';
  document.body.style.cursor='';
  // Remove ghost
  if(_dnd.ghost){_dnd.ghost.remove();_dnd.ghost=null;}
  // Restore source
  if(_dnd.el){_dnd.el.style.opacity='';_dnd.el.style.pointerEvents='';}
  // Clear highlights
  document.querySelectorAll('.dnd-hl,.dnd-above,.dnd-below').forEach(el=>{
    el.classList.remove('dnd-hl','dnd-above','dnd-below');
  });
  // Execute drop if we dragged
  if(_dnd.active)_dndDrop(e);
  _dnd={active:false,el:null,ghost:null,data:null,sx:0,sy:0,type:null};
}

function _dndHighlight(e){
  document.querySelectorAll('.dnd-hl,.dnd-above,.dnd-below').forEach(el=>{
    el.classList.remove('dnd-hl','dnd-above','dnd-below');
  });
  const pt=document.elementFromPoint(e.clientX,e.clientY);
  switch(_dnd.type){
    case'project':{
      const t=pt?.closest('.proj-card-wrap[data-proj-id]');
      if(t&&t!==_dnd.el)t.classList.add('dnd-hl');
      break;}
    case'task':{
      const t=pt?.closest('.task-item[data-id]');
      if(t&&t!==_dnd.el){
        const r=t.getBoundingClientRect();
        t.classList.add(e.clientY<r.top+r.height/2?'dnd-above':'dnd-below');
      }
      break;}
    case'member':{
      const t=pt?.closest('.mcard-dnd[data-member-id]');
      if(t&&t!==_dnd.el)t.classList.add('dnd-hl');
      break;}
    case'kcard':{
      const ct=pt?.closest('.kcard[data-task-id]');
      if(ct&&ct.dataset.taskId!==_dnd.data.taskId){
        const r=ct.getBoundingClientRect();
        ct.classList.add(e.clientY<r.top+r.height/2?'dnd-above':'dnd-below');
      } else {
        const col=pt?.closest('.kb-cards[data-status]');
        if(col)col.classList.add('dnd-hl');
      }
      break;}
  }
}

function _dndDrop(e){
  const pt=document.elementFromPoint(e.clientX,e.clientY);
  switch(_dnd.type){
    case'project':{
      const t=pt?.closest('.proj-card-wrap[data-proj-id]');
      if(!t||t===_dnd.el)return;
      const ai=S.projects.findIndex(p=>p.id===_dnd.data.id);
      const bi=S.projects.findIndex(p=>p.id===t.dataset.projId);
      if(ai<0||bi<0)return;
      const[m]=S.projects.splice(ai,1);S.projects.splice(bi,0,m);
      save();render();break;}
    case'task':{
      const t=pt?.closest('.task-item[data-id]');
      if(!t||t===_dnd.el)return;
      const dragT=getTask(_dnd.data.id),dropT=getTask(t.dataset.id);
      if(!dragT||!dropT||dragT.parentId!==dropT.parentId)return;
      const r=t.getBoundingClientRect();
      const before=e.clientY<r.top+r.height/2;
      const ai=S.tasks.indexOf(dragT),bi=S.tasks.indexOf(dropT);
      if(ai<0||bi<0)return;
      S.tasks.splice(ai,1);
      const nb=S.tasks.indexOf(dropT);
      S.tasks.splice(before?nb:nb+1,0,dragT);
      save();render();break;}
    case'member':{
      const t=pt?.closest('.mcard-dnd[data-member-id]');
      if(!t||t===_dnd.el)return;
      const ai=S.members.findIndex(m=>m.id===_dnd.data.id);
      const bi=S.members.findIndex(m=>m.id===t.dataset.memberId);
      if(ai<0||bi<0)return;
      const[m]=S.members.splice(ai,1);S.members.splice(bi,0,m);
      save();render();break;}
    case'kcard':{
      const task=getTask(_dnd.data.taskId);if(!task)return;
      const ct=pt?.closest('.kcard[data-task-id]');
      if(ct&&ct.dataset.taskId!==_dnd.data.taskId){
        const dropT=getTask(ct.dataset.taskId);if(!dropT)return;
        const newSt=dropT.kStatus||'todo';
        if(newSt==='blocked'){
          save();render();
          openModal('dependency',task.id);
          return;
        }
        applyKanbanStatusChange(task, newSt);
        const r=ct.getBoundingClientRect();
        const before=e.clientY<r.top+r.height/2;
        const ai=S.tasks.indexOf(task),bi=S.tasks.indexOf(dropT);
        if(ai>=0&&bi>=0){S.tasks.splice(ai,1);const nb=S.tasks.indexOf(dropT);S.tasks.splice(before?nb:nb+1,0,task);}
      } else {
        const col=pt?.closest('.kb-cards[data-status]');
        if(col){
          const newStatus=col.dataset.status;
          if(newStatus==='blocked'){
            // Open dependency modal so user picks what's blocking it
            save();render();
            openModal('dependency',task.id);
            return;
          }
          applyKanbanStatusChange(task, newStatus);
        }
      }
      save();render();break;}
  }
}

/* ── Attach pointerdown listeners to make elements draggable ── */
function initAllDnD(){
  // Projects
  document.querySelectorAll('.proj-card-wrap[data-proj-id]').forEach(el=>{
    el.onpointerdown=e=>{
      if(e.target.closest('button')||e.button!==0)return;
      _dnd={active:false,el,ghost:null,data:{id:el.dataset.projId},sx:e.clientX,sy:e.clientY,type:'project'};
      document.addEventListener('pointermove',_dndGlobalMove,{passive:true});
      document.addEventListener('pointerup',_dndGlobalEnd,{once:true});
      document.addEventListener('pointercancel',_dndGlobalEnd,{once:true});
    };
  });
  // Task rows — only attach to visible rows (not inside collapsed sub-wraps)
  document.querySelectorAll('.task-item[data-id]').forEach(el=>{
    // Skip rows inside a collapsed accordion — their pointer events block scroll
    const parentSubWrap=el.closest('.sub-wrap');
    if(parentSubWrap&&!parentSubWrap.classList.contains('open'))return;

    const row=el.querySelector('.task-row');
    if(!row)return;
    let _pendingDnd=null;
    row.onpointerdown=e=>{
      if(e.target.closest('button')||e.target.closest('.ti-check')||e.target.closest('.ti-exp')||e.button!==0)return;
      // Store start position but do NOT register move/up listeners yet
      _pendingDnd={id:el.dataset.id,sx:e.clientX,sy:e.clientY,el};
    };
    // Use pointermove on the row to decide: scroll (vertical) vs drag (horizontal/diagonal)
    row.addEventListener('pointermove',e=>{
      if(!_pendingDnd||_dnd.active)return;
      const dx=Math.abs(e.clientX-_pendingDnd.sx);
      const dy=Math.abs(e.clientY-_pendingDnd.sy);
      if(dy>dx&&dy>4){
        // Predominantly vertical — this is a scroll gesture, cancel any pending DnD
        _pendingDnd=null;
        return;
      }
      if(dx>8||dy>8){
        // Horizontal/diagonal movement large enough — start DnD
        _dnd={active:false,el:_pendingDnd.el,ghost:null,data:{id:_pendingDnd.id},sx:_pendingDnd.sx,sy:_pendingDnd.sy,type:'task'};
        _pendingDnd=null;
        document.addEventListener('pointermove',_dndGlobalMove,{passive:true});
        document.addEventListener('pointerup',e2=>{
          const dndRow=_dnd.el?.querySelector('.task-row');
          if(dndRow)dndRow.style.touchAction='';
          _dndGlobalEnd(e2);
        },{once:true});
        document.addEventListener('pointercancel',e2=>{
          const dndRow=_dnd.el?.querySelector('.task-row');
          if(dndRow)dndRow.style.touchAction='';
          _dndGlobalEnd(e2);
        },{once:true});
      }
    },{passive:true});
    row.addEventListener('pointerup',()=>{ _pendingDnd=null; },{passive:true});
    row.addEventListener('pointercancel',()=>{ _pendingDnd=null; },{passive:true});
  });
  // Team member cards
  document.querySelectorAll('.mcard-dnd[data-member-id]').forEach(el=>{
    el.onpointerdown=e=>{
      if(e.target.closest('button')||e.target.closest('input')||e.button!==0)return;
      _dnd={active:false,el,ghost:null,data:{id:el.dataset.memberId},sx:e.clientX,sy:e.clientY,type:'member'};
      document.addEventListener('pointermove',_dndGlobalMove,{passive:true});
      document.addEventListener('pointerup',_dndGlobalEnd,{once:true});
      document.addEventListener('pointercancel',_dndGlobalEnd,{once:true});
    };
  });
  // Kanban cards
  document.querySelectorAll('.kcard[data-task-id]').forEach(el=>{
    let didDrag=false;
    el.onpointerdown=e=>{
      if(e.target.closest('button')||e.button!==0)return;
      didDrag=false;
      _dnd={active:false,el,ghost:null,data:{taskId:el.dataset.taskId},sx:e.clientX,sy:e.clientY,type:'kcard'};
      document.addEventListener('pointermove',_dndGlobalMove,{passive:true});
      document.addEventListener('pointerup',e2=>{if(!_dnd.active)openModal('task',el.dataset.taskId);_dndGlobalEnd(e2);},{once:true});
      document.addEventListener('pointercancel',_dndGlobalEnd,{once:true});
    };
  });
}


/* ════ REORDER HELPERS ════ */
function reorderProject(id,dir){
  const i=S.projects.findIndex(p=>p.id===id);if(i<0)return;
  const j=i+dir;if(j<0||j>=S.projects.length)return;
  [S.projects[i],S.projects[j]]=[S.projects[j],S.projects[i]];
  save();render();
}
function reorderMember(id,dir){
  const i=S.members.findIndex(m=>m.id===id);if(i<0)return;
  const j=i+dir;if(j<0||j>=S.members.length)return;
  [S.members[i],S.members[j]]=[S.members[j],S.members[i]];
  save();render();
}
function reorderTask(id,dir){
  const t=getTask(id);if(!t)return;
  const sibs=S.tasks.filter(x=>x.projectId===t.projectId&&x.parentId===t.parentId);
  const i=sibs.findIndex(x=>x.id===id);if(i<0)return;
  const j=i+dir;if(j<0||j>=sibs.length)return;
  const gi=S.tasks.indexOf(sibs[i]),gj=S.tasks.indexOf(sibs[j]);
  if(gi<0||gj<0)return;
  [S.tasks[gi],S.tasks[gj]]=[S.tasks[gj],S.tasks[gi]];
  save();render();
}
/* ════ EXPORT / IMPORT ════ */
function exportData(){
  const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='projectflow-data-'+new Date().toISOString().slice(0,10)+'.json';a.click();
  URL.revokeObjectURL(a.href);
}
function triggerImport(){el('import-file-input').click();}
function importData(input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const imported=JSON.parse(e.target.result);
      if(!imported.projects&&!imported.tasks){alert('Invalid ProjectFlow data file.');return;}
      // import proceeds — user clicked import
      Object.assign(S,imported);
      // ── Migrate all fields — handles old and new exports ──
      // Filters & UI state
      if(!S.kbFilter)S.kbFilter={project:'',member:'',label:''};
      if(!S.dashFilters)S.dashFilters={project:'',member:'',label:''};
      if(S.hideDone===undefined)S.hideDone=false;
      if(!S.coworkDays)S.coworkDays=[];
      if(!S.sponsors)S.sponsors=[];
      if(!S.taskTemplates)S.taskTemplates=[];
      if(!S.quickLinks)S.quickLinks=[];
      if(!S.projectTemplates)S.projectTemplates=[];
      // Finance
      if(!S.finance)S.finance={revenue:0,recurring:[],oneoff:[],finTab:'overview',savings:{rate:20},teamRates:{},globalRate:0,budgets:{},finAuth:false};
      if(!S.finance.teamRates)S.finance.teamRates={};
      if(!S.finance.revenueStreams)S.finance.revenueStreams=[{id:'rs1',name:'Revenue',amount:S.finance.revenue||0,cat:'Other'}];
      if(S.finance.globalRate===undefined)S.finance.globalRate=0;
      if(!S.finance.budgets)S.finance.budgets={};
      if(S.finance.finAuth===undefined)S.finance.finAuth=false;
      if(!S.finance.savings)S.finance.savings={rate:20};

document.addEventListener('DOMContentLoaded',function(){
  const tip=document.createElement('div');tip.className='ti-desc-tip';tip.id='ti-desc-tip';document.body.appendChild(tip);
  document.addEventListener('mouseover',e=>{
    const span=e.target.closest('[data-desc]');
    if(!span){tip.style.display='none';return;}
    tip.textContent=span.dataset.desc;
    tip.style.display='block';
    const r=span.getBoundingClientRect();
    tip.style.left=Math.min(r.left,window.innerWidth-270)+'px';
    tip.style.top=(r.bottom+5)+'px';
  });
  document.addEventListener('mouseout',e=>{if(!e.relatedTarget?.closest('[data-desc]'))tip.style.display='none';});
});

  try{const b=new Blob([JSON.stringify(manifest)],{type:'application/manifest+json'});el('pwa-manifest').href=URL.createObjectURL(b);}catch(e){}
  if('serviceWorker' in navigator){const sw=`const V='pf-v2';self.addEventListener('install',e=>e.waitUntil(caches.open(V).then(c=>c.add('/'))));self.addEventListener('fetch',e=>e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request).catch(()=>caches.match('/')))));`;try{const b=new Blob([sw],{type:'text/javascript'});navigator.serviceWorker.register(URL.createObjectURL(b)).catch(()=>{});}catch(e){}}

  if(!sp)return;

function toggleProdDelivered(projectId,sponsorId,prodIdx){
  const p=getProject(projectId);
  const sp=p?.sponsors?.find(x=>x.id===sponsorId);
  // prodIdx is index in filtered allocatedProducts, not full sp.products
  // Map back to full array index below
  const allProds=sp.products||[];
  const allocated=allProds.filter(prod=>Object.values(prod.quantities||{}).some(q=>parseInt(q)>0));
  const prod=allocated[prodIdx];
  if(!prod)return;
  const fullIdx=allProds.indexOf(prod);
  if(fullIdx<0)return;
  allProds[fullIdx].delivered=!allProds[fullIdx].delivered;
  save();
  // Update the check box and row styling in-place without full re-render
  const check=document.querySelector('[onclick*="toggleProdDelivered(\''+projectId+'\',\''+sponsorId+'\','+prodIdx+')"]');
  if(check){
    const delivered=allProds[fullIdx].delivered;
    check.classList.toggle('done',delivered);
    check.style.borderColor=delivered?'var(--green)':'rgba(255,255,255,.18)';
    check.style.background=delivered?'var(--green)':'transparent';
    check.title=delivered?'Mark undelivered':'Mark delivered';
    const row=check.parentElement;
    if(row){
      const nameEl=row.querySelector('span[style*="font-weight"]');
      if(nameEl){nameEl.style.fontWeight=delivered?'400':'600';nameEl.style.color=delivered?'var(--muted)':'var(--text)';nameEl.style.textDecoration=delivered?'line-through':'none';}
      const valEl=row.querySelector('span[style*="DM Mono"]');
      if(valEl)valEl.style.color=delivered?'var(--muted)':'var(--yellow)';
    }
  }
}

function _refreshPrizeModal(projectId,sponsorId){

  else{mc.innerHTML=`<div class="mo" onclick="if(event.target.classList.contains('mo'))closeModal()">${prizeDeliveryModalHtml({projectId,sponsorId})}</div>`;}

function pdSetFtype(prizeIdx,type,projectId,sponsorId){
  const p=getProject(projectId);const sp=p?.sponsors?.find(x=>x.id===sponsorId);
  if(!sp||!sp.products[prizeIdx])return;
  sp.products[prizeIdx].fulfillType=type;
  save();
  _refreshPrizeModal(projectId,sponsorId);
}

function pdAddWinner(projectId,sponsorId,prizeIdx){
  const p=getProject(projectId);const sp=p?.sponsors?.find(x=>x.id===sponsorId);
  if(!sp||!sp.products[prizeIdx])return;
  if(!sp.products[prizeIdx].winners)sp.products[prizeIdx].winners=[];
  sp.products[prizeIdx].winners.push({name:'',code:''});
  save();
  _refreshPrizeModal(projectId,sponsorId);
}

function pdRemoveWinner(projectId,sponsorId,prizeIdx,winnerIdx){
  const p=getProject(projectId);const sp=p?.sponsors?.find(x=>x.id===sponsorId);

function buildPrizePrompt(type,data,p,s){
  const prizeContext=data.prizeContext;
  const recapUrl=data.recapUrl||p.recapUrl||'';
  const eventName=p.name;
  const sponsorName=s.name;
  const contactName=s.contactName||s.name;

  const prizeLines=prizeContext.map(pr=>{
    const winners=pr.winners.filter(w=>w.name);
    if(pr.type==='code'){
      return`${pr.prize}:\n${winners.map(w=>`  ${w.name}${w.code?` = ${w.code}`:''}`).join('\n')}${pr.instructions?`\n  Activation instructions: ${pr.instructions}`:''}`;
    }else{
      return`${pr.prize}:\n${winners.map(w=>`  ${w.name}`).join('\n')}`;
    }
  }).join('\n\n');

  const voiceGuide=`Write in Greg Lester's voice. Greg is the co-founder of Airwiggles, a community platform for game audio professionals. His tone is: warm, direct, casual, community-focused. He uses "Hey" not "Dear". Short sentences. No corporate language. Occasional emoji is fine but not on every line. Not every sentence ends with an exclamation mark. He signs off naturally as Greg or the Airwiggles team.\n\nHere are real examples of how Greg writes:\n\nCode delivery (group):\n"Hey everyone, I've got the codes you can register with, you'll have to log in here and then type in the code: https://www.boomlibrary.com/product-registration/\n\nVincenzo Bellanova = B1Bout_OTUQRXNWLVY5IY4B\nPietro Frigerio = B1Bout_IDJ5SMBOTATHA9F3"\n\nAccount email request (group):\n"Hey folks! Big congratulations as you've all won some prizes with our Airwiggles Audio Challenge raffle!\n\n$30 Kilohearts coupon:\nJacob Serody\nMichele Rampino\n\nWhat we need from all of you is the email address associated with your Kilohearts account. If everyone could send us their email either here or to me or Greg Lester privately then we can work on getting you your prizes 🙂"`;

  let prompt='';

  if(type==='dm'){
    prompt=`${voiceGuide}\n\nTask: Write individual Airwiggles direct messages — one per winner — to send after the ${eventName} event, sponsored by ${sponsorName}.\n\nPrizes and winners:\n${prizeLines}\n\nWrite a separate short DM for each winner. Include their specific prize${prizeContext.some(x=>x.type==='code')?' and their unique license code, plus the activation instructions':''}. Personal and concise — they just won something, make them feel good about it.\n\nFormat each message clearly separated:\n---\nTo: [Winner name]\n[Message]\n---`;
  }else if(type==='post'){
    prompt=`${voiceGuide}\n\nTask: Write a short public post snippet for Airwiggles announcing the prize winners from ${eventName}, sponsored by ${sponsorName}.\n\nPrizes and winners:\n${prizeLines}\n\nThe snippet should: congratulate the winners, list all prizes and winner names clearly, thank ${sponsorName} for sponsoring, and tell winners to look out for a DM from us with their prize details. This will be added inside a larger event recap post — keep it focused and easy to scan.`;
  }else if(type==='group'){
    const hasCode=prizeContext.some(x=>x.type==='code');
    prompt=`${voiceGuide}\n\nTask: Write a single group message addressed to all winners together for ${eventName} prizes sponsored by ${sponsorName}.\n\nPrizes and winners:\n${prizeLines}\n\n${hasCode?'List each winner alongside their prize and license code. Include the activation instructions clearly so they can redeem immediately. Keep it easy to scan.':'Ask all winners to send their account email address (the one associated with their '+sponsorName+' account — or to create one if they don\'t have one yet). List all the prizes and winners clearly so everyone knows what they\'ve won.'}\n\nThis will be sent as a single group message on Airwiggles.`;
  }else if(type==='sponsor'){
    const hasAccount=prizeContext.some(x=>x.type==='account');
    prompt=`Task: Write a professional but warm email from Greg Lester / the Airwiggles team to ${contactName} at ${sponsorName}.\n\nContext: ${sponsorName} sponsored ${eventName} and the event has now concluded. ${hasAccount?'We need to share the winner details so they can fulfil the prizes.':'We are letting them know the prizes have been delivered.'}\n\nContent to include:\n- Thank them warmly for their sponsorship and support of the community\n- A brief upbeat summary of how the event went\n${recapUrl?`- Link to the event recap post: ${recapUrl}\n`:''}- The prize winners:\n${prizeLines}\n${hasAccount?'- Make clear these are the account emails associated with each winner\'s account on the '+sponsorName+' platform\n':''}\nTone: professional but friendly — not stiff. This is a community platform and the relationship with sponsors is collaborative, not transactional. Keep it concise and genuine.\n\n${voiceGuide}`;
  }

  return prompt;
}

function generatePrizeMessage(projectId,sponsorId,type,data){
  const p=getProject(projectId);
  const s=getSponsor(sponsorId);
  if(!p||!s)return;

  const typeLabels={'dm':'Airwiggles DM (per winner)','post':'Post snippet','group':'Group message','sponsor':'Sponsor email'};

  // Build the prompt
  const prompt=buildPrizePrompt(type,data,p,s);

  // Show prompt preview in the output area
  const out=el('pd-msg-output');
  const content=el('pd-msg-content');
  const label=el('pd-msg-label');
  const logBtn=el('pd-log-btn');
  if(out)out.style.display='block';
  if(label)label.textContent=typeLabels[type]||type;
  if(content)content.textContent=prompt;

  // Copy to clipboard
  navigator.clipboard.writeText(prompt).then(()=>{
    // Update the button that was clicked to show copied state
    const btns=document.querySelectorAll('.pd-type-btn');
    btns.forEach(b=>{if(b.dataset.type===type){b.classList.add('copied');}});

    // Open Claude.ai in new tab
    window.open('https://claude.ai/new','_blank');

    // Show toast
    showToast('Prompt copied — paste it into Claude to generate your message');

    // Show log button
    if(logBtn)logBtn.style.display='inline-flex';

    // Reset button after 3s
    setTimeout(()=>btns.forEach(b=>b.classList.remove('copied')),3000);
  }).catch(()=>{
    // Clipboard failed — still open Claude and show the prompt
    window.open('https://claude.ai/new','_blank');
    showToast('Open Claude and paste the prompt shown below');
    if(logBtn)logBtn.style.display='inline-flex';
  });
}

function pdLogDelivery(projectId,sponsorId){
  const p=getProject(projectId);
  const s=getSponsor(sponsorId);
  const sp=p?.sponsors?.find(x=>x.id===sponsorId);
  if(!p||!s||!sp)return;

  const now=toISO(new Date());
  if(!p.prizeHistory)p.prizeHistory=[];
  if(!s.prizeHistory)s.prizeHistory=[];

  (sp.products||[]).forEach(prod=>{
    const winners=(prod.winners||[]).filter(w=>w.name);
    winners.forEach(w=>{
      const entry={id:uid(),date:now,eventName:p.name,sponsorId,sponsorName:s.name,prize:prod.name,winner:w.name,type:prod.fulfillType||'code'};
      p.prizeHistory.push(entry);
      s.prizeHistory.push({...entry,projectId});
    });
  });

  save();
  showToast('Delivery logged ✓');
  const logBtn=el('pd-log-btn');
  if(logBtn){logBtn.textContent='✓ Logged';logBtn.disabled=true;}
}

      <!-- Top contributors -->

      </div>

function runSpMatch(){
  const eventType=el('spm-type')?.value||'';
  const spType=el('spm-sptype')?.value||'';
  const audience=(el('spm-audience')?.value||'').toLowerCase();
  const res=el('spm-results');if(!res)return;

  // Score each sponsor
  const scored=S.sponsors.map(s=>{
    let score=0;
    const sText=(s.name+' '+(s.notes||'')+' '+(s.audienceNotes||'')+' '+(s.audienceTags||[]).join(' ')+' '+(s.integrationTypes||[]).join(' ')+' '+(s.products||[]).map(p=>p.name+' '+(p.desc||'')).join(' ')).toLowerCase();

    // Audience keyword match
    if(audience){
      const words=audience.split(/\s+/).filter(Boolean);
      words.forEach(w=>{if(sText.includes(w))score+=15;});
    }
    // Event history match
    if(eventType){
      (s.history||[]).forEach(h=>{if(h.event.toLowerCase().includes(eventType.toLowerCase()))score+=20;});
    }
    // Has contact info
    if(s.contactEmail)score+=5;
    // Has products catalogued
    score+=(s.products||[]).length*3;
    // History depth
    score+=(s.history||[]).length*4;
    // Integration types
    score+=(s.integrationTypes||[]).length*2;

    const reasons=[];
    if((s.history||[]).length>0)reasons.push(`${(s.history||[]).length} events on record`);
    if((s.products||[]).length>0)reasons.push(`${(s.products||[]).length} products`);
    if((s.integrationTypes||[]).length>0)reasons.push(s.integrationTypes.slice(0,2).join(', '));

    return{s,score,reasons};
  }).filter(x=>x.score>0).sort((a,b)=>b.score-a.score).slice(0,6);

  if(scored.length===0){
    res.innerHTML=`<div style="color:var(--muted);font-size:.78rem;">No strong matches found. Try adding more audience info to sponsor profiles.</div>`;
    return;
  }

  const maxScore=scored[0].score;
  res.innerHTML=`<div style="font-size:.72rem;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:9px;">Top Matches</div>`+

    </div>

  </div>`).join('');
}

function switchSpTab(t){

    const panel=el(`sp-tab-${tab}`);

    const active=tab===t;

      btn.style.color=active?'var(--black)':'var(--text2)';
      btn.style.borderColor=active?'var(--acc)':'var(--border)';
    }
  });
}

function addProductRow(){
  const existing=readProductRows();
  existing.push({name:'',desc:'',paymentType:'',cost:0});

function removeProductRow(i){
  const existing=readProductRows();
  existing.splice(i,1);
  const el2=el('sp-products-list');if(el2){el2.innerHTML=renderProductsEdit(existing);var w=el('sp-prod-rows');if(w)w.style.display='';}

function readProductRows(){
  const rows=[];let i=0;
  while(el(`sp-prod-name-${i}`)){
    rows.push({name:el(`sp-prod-name-${i}`).value.trim(),desc:el(`sp-prod-desc-${i}`)?.value.trim()||'',url:el(`sp-prod-url-${i}`)?.value.trim()||'',activationInstructions:el(`sp-prod-instr-${i}`)?.value.trim()||'',paymentType:el(`sp-prod-paytype-${i}`)?.value||'',cost:parseFloat(el(`sp-prod-cost-${i}`)?.value)||0,imageUrl:el(`sp-prod-img-${i}`)?.value||'',category:el(`sp-prod-cat-${i}`)?.value||''});
    i++;
  }
  return rows.filter(r=>r.name);
}

function importProductsFromHtml(input){
  const file=input.files[0];
  if(!file)return;
  const status=el('sp-html-import-status');
  if(status)status.textContent='Reading file…';

  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const html=e.target.result;
      // Parse using DOMParser — safe, no scripts execute
      const doc=new DOMParser().parseFromString(html,'text/html');
      const found=[];

      // Helper: extract best absolute image URL from an element
      function getBestImgUrl(item){
        const img=item.querySelector('img');
        if(!img)return'';
        // Prefer srcset (has absolute URLs even in locally-saved files)
        const srcset=img.getAttribute('srcset')||'';
        if(srcset){
          const parts=srcset.split(',').map(function(p){return p.trim();});
          // Find smallest reasonable size (~300px) to avoid loading huge images
          const small=parts.find(function(p){return p.includes('300w')||p.includes('289w')||p.includes('-300x');});
          const chosen=small||parts[0];
          if(chosen){const url=chosen.trim().split(/\s+/)[0];if(url.startsWith('http'))return url;}
        }
        const src=img.getAttribute('src')||'';
        return src.startsWith('http')?src:'';
      }

      // Helper: extract description
      function getDesc(item){
        // Try explicit description elements first
        const descEl=item.querySelector('[class*="short-desc"],[class*="excerpt"],[class*="product-desc"],[class*="item-desc"],[class*="description"]');
        if(descEl){const t=descEl.textContent.trim();if(t.length>10&&t.length<400)return t.substring(0,150);}
        // Try first meaningful <p>
        const paras=item.querySelectorAll('p');
        for(let j=0;j<paras.length;j++){const t=paras[j].textContent.trim();if(t.length>15&&t.length<300)return t.substring(0,150);}
        // Try any element with a title attribute that looks descriptive
        const titled=item.querySelector('[title]');
        if(titled){const t=(titled.getAttribute('title')||'').trim();if(t.length>10&&t.length<200)return t;}
        // Fallback: img alt text — most reliable for shop pages
        const imgs=item.querySelectorAll('img[alt]');
        for(let k=0;k<imgs.length;k++){
          const raw=imgs[k].getAttribute('alt')||'';
          const alt=raw.replace(/packshot|thumbnail|image|photo|picture|\bpng\b|\bjpg\b/gi,'').trim();
          if(alt.length>5)return alt.substring(0,120);
        }
        return'';
      }

      // Helper: extract category from WooCommerce class names on parent elements
      function getCategory(item){
        let el2=item;
        for(let j=0;j<8;j++){
          el2=el2.parentElement;if(!el2)break;
          const cls=el2.className||'';
          const cats=cls.match(/product_cat-([\w-]+)/g);
          if(cats&&cats.length){
            const clean=cats.map(function(c){return c.replace('product_cat-','').replace(/-|_/g,' ');})
              .filter(function(c){return!['uncategorised','uncategorized','featured','sale','new'].includes(c);});
            if(clean.length)return clean.slice(0,2).join(', ');
          }
        }
        return'';
      }

      // Strategy 1: WooCommerce / BOOM Library style
      // Use a Set to track processed names and avoid duplicates from nested selectors
      const containers=doc.querySelectorAll('.wr-item-animation, .product__wrap, li.product, .product-item, [class*="product-card"], [class*="ProductCard"]');
      const seenProductNames=new Set();

      containers.forEach(function(item){
        // Skip if this element is a descendant of another already-matched container
        // (avoids double-processing .product__wrap inside .wr-item-animation)
        const parent=item.parentElement;
        if(parent&&parent.matches&&(parent.matches('.wr-item-animation')||parent.matches('[class*="product-card"]')))return;
        const priceEl=item.querySelector('.product__price, .price, [class*="price"], [itemprop="price"]');
        if(!priceEl)return;

        // Get product name — h1/h2/h3, .product__title, or alt text from image
        let name='';
        const hEl=item.querySelector('h1,h2,h3,h4,[class*="product__title"],[class*="product-title"],[class*="ProductTitle"]');
        if(hEl)name=hEl.textContent.trim();
        if(!name){const img=item.querySelector('img[alt]');if(img)name=img.alt.replace(/packshot|image|photo|thumbnail/gi,'').trim();}
        if(!name)return;

        // Get URL
        const link=item.querySelector('a[href]');
        const url=link?link.href:'';

        // Extract price — del=original/was, ins=sale price → we always want the ORIGINAL (non-sale) price
        const delEl=priceEl.querySelector('del');
        const insEl=priceEl.querySelector('ins');

        let cost=0;
        let onSale=false;

        function parsePrice(el2){
          if(!el2)return 0;
          const txt=el2.textContent.replace(/,/g,'');
          const m=txt.match(/[\d]+\.?\d*/g);
          if(!m)return 0;
          // Pick the largest number to avoid matching "3D" or "5.1"
          const nums=m.map(Number).filter(function(n){return n>0.5;});
          return nums.length?Math.max.apply(null,nums):0;
        }

        if(delEl&&insEl){
          // On sale: del = original price, ins = sale price → use del (original)
          cost=parsePrice(delEl);
          onSale=true;
        } else {
          cost=parsePrice(priceEl);
        }

        if(name&&cost>0){
          if(seenProductNames.has(name.toLowerCase()))return;
          seenProductNames.add(name.toLowerCase());
          // Detect payment type from price text and DOM signals
          const priceText=(priceEl.textContent||'').toLowerCase();
          const hasSubscription=!!(item.querySelector('[class*="wcsatt"],[class*="subscri"]'));
          let paymentType='one-time';
          if(cost===0||priceText.includes('free')){
            paymentType='free';
          } else if(priceText.includes('/month')||priceText.includes('monthly')||priceText.includes('per month')){
            paymentType='subscription-monthly';
          } else if(priceText.includes('/year')||priceText.includes('annual')||priceText.includes('per year')||priceText.includes('/yr')){
            paymentType='subscription-annual';
          } else if(hasSubscription&&(priceText.includes('year')||priceText.includes('annual'))){
            paymentType='subscription-annual';
          } else if(hasSubscription){
            paymentType='subscription-monthly';
          } else if(priceText.includes('rent')||priceText.includes('rent-to-own')){
            paymentType='rent-to-own';
          } else if(priceText.includes('freemium')){
            paymentType='freemium';
          }
          const descText=getDesc(item);
          found.push({name:name,desc:descText||(onSale?'On sale — original price used':''),url:url,cost:cost,paymentType:paymentType,imageUrl:getBestImgUrl(item),category:getCategory(item),activationInstructions:''});
        }
      });

      // Strategy 2: JSON-LD structured data (many modern shops embed this)
      if(found.length===0){
        doc.querySelectorAll('script[type="application/ld+json"]').forEach(function(s2){
          try{
            const json=JSON.parse(s2.textContent);
            const items=Array.isArray(json)?json:[json];
            items.forEach(function(obj){
              if(obj['@type']==='Product'||obj['@type']==='ItemList'){
                const products2=obj['@type']==='ItemList'?(obj.itemListElement||[]).map(function(i2){return i2.item||i2;}):[obj];
                products2.forEach(function(p2){
                  if(!p2||!p2.name)return;
                  let cost2=0;
                  const offers=Array.isArray(p2.offers)?p2.offers[0]:p2.offers;
                  if(offers){
                    // Use highPrice if available (original before discount), else price
                    cost2=parseFloat(offers.highPrice||offers.price)||0;
                  }
                  if(p2.name&&cost2>0){
                    // JSON-LD offers can have priceSpecification with billingDuration
                    let pt2='one-time';
                    if(cost2===0)pt2='free';
                    else if(offers&&(offers['@type']==='AggregateOffer'||String(offers.priceSpecification||'').toLowerCase().includes('month')))pt2='subscription-monthly';
                    else if(offers&&String(offers.priceSpecification||'').toLowerCase().includes('year'))pt2='subscription-annual';
                    found.push({name:p2.name,desc:p2.description||'',url:p2.url||'',cost:cost2,paymentType:pt2,imageUrl:(p2.image&&p2.image.url)||p2.image||'',category:'',activationInstructions:''});
                  }
                });
              }
            });
          }catch(ex){}
        });
      }

      // Strategy 3: meta tags / og:title + structured price spans (fallback)
      if(found.length===0){
        const allPriceEls=doc.querySelectorAll('[class*="price"],[class*="Price"],[itemprop="price"]');
        const seenNames=new Set();
        allPriceEls.forEach(function(pe){
          const txt=pe.textContent.replace(/,/g,'');
          const m=txt.match(/[\d]+\.?\d*/g);
          if(!m)return;
          const nums=m.map(Number).filter(function(n){return n>0.5;});
          const cost3=nums.length?Math.max.apply(null,nums):0;
          if(cost3<0.5)return;
          // Walk up for a title
          let nameEl=null;let p3=pe;
          for(let i2=0;i2<5;i2++){
            p3=p3.parentElement;if(!p3)break;
            nameEl=p3.querySelector('h1,h2,h3,h4,[class*="title"],[class*="name"]');
            if(nameEl)break;
          }
          const name2=nameEl?nameEl.textContent.trim():'';
          if(name2&&!seenNames.has(name2)&&cost3>0){
            seenNames.add(name2);
            found.push({name:name2,desc:'',url:'',cost:cost3,paymentType:'',imageUrl:'',category:'',activationInstructions:''});
          }
        });
      }

      if(found.length===0){
        if(status)status.textContent='No products found in this file.';
        input.value='';
        return;
      }

      // Merge with existing — skip duplicates by name
      const existing=readProductRows();
      const existingNames=new Set(existing.map(function(p4){return p4.name.toLowerCase();}));
      let added=0;
      found.forEach(function(p5){
        if(!existingNames.has(p5.name.toLowerCase())){
          existing.push(p5);
          added++;
        }
      });

      // Re-render product list
      const listEl=el('sp-products-list');
      if(listEl){listEl.innerHTML=renderProductsEdit(existing);var w=el('sp-prod-rows');if(w)w.style.display='';}
      if(status){
        status.style.color='var(--green)';
        status.textContent='✓ Imported '+added+' product'+(added!==1?'s':'')+' ('+found.length+' found, '+(found.length-added)+' already existed)';
      }
      // Clear file input so the same file can be re-selected if needed
      input.value='';
    }catch(err){
      const status2=el('sp-html-import-status');
      if(status2){status2.style.color='var(--red)';status2.textContent='Error: '+err.message;}
      input.value='';
    }
  };
  reader.readAsText(file);
}

function addAudienceTag(){
  const inp=el('sp-audience-inp');if(!inp)return;
  const tag=inp.value.trim().replace(/,$/,'');
  if(!tag)return;
  const hidden=el('sp-audience-hidden');
  const existing=(hidden?.value||'').split(',').filter(Boolean);
  if(existing.includes(tag)){inp.value='';return;}
  existing.push(tag);
  if(hidden)hidden.value=existing.join(',');
  inp.value='';
  // Re-render tags
  const wrap=el('sp-audience-tags-wrap');
  if(wrap){
    const spans=wrap.querySelectorAll('[data-tag]');
    const newSpan=document.createElement('span');
    newSpan.dataset.tag=tag;
    newSpan.style.cssText='display:inline-flex;align-items:center;gap:4px;padding:2px 8px;background:rgba(167,139,250,.15);border:1px solid rgba(167,139,250,.3);color:#a78bfa;border-radius:20px;font-size:.68rem;';
    newSpan.innerHTML=`${tag}<span onclick="removeAudienceTag('${tag}')" style="cursor:pointer;opacity:.7;margin-left:2px;">×</span>`;
    wrap.insertBefore(newSpan,inp);
  }
}
function removeAudienceTag(tag){
  const hidden=el('sp-audience-hidden');
  if(hidden)hidden.value=(hidden.value||'').split(',').filter(t=>t!==tag).join(',');
  const wrap=el('sp-audience-tags-wrap');
  if(wrap){const span=wrap.querySelector(`[data-tag="${tag}"]`);if(span)span.remove();}
}

function toggleIntegration(type,lbl){
  const cb=lbl.querySelector('input[type="checkbox"]');
  cb.checked=!cb.checked;
  lbl.style.borderColor=cb.checked?'var(--acc)':'var(--border)';
  lbl.style.background=cb.checked?'var(--teal-dim)':'var(--surface2)';
  // Update hidden input
  const hidden=el('sp-integrations-hidden');if(!hidden)return;
  const current=(hidden.value||'').split('||').filter(Boolean);
  if(cb.checked){if(!current.includes(type))current.push(type);}
  else{const idx=current.indexOf(type);if(idx>=0)current.splice(idx,1);}
  hidden.value=current.join('||');
}

function uploadSponsorLogo(input){
  const file=input.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      // Compress: max 120×120, JPEG 72%
      const MAX=120;
      const canvas=document.createElement('canvas');
      const scale=Math.min(MAX/img.width,MAX/img.height,1);
      canvas.width=Math.round(img.width*scale);
      canvas.height=Math.round(img.height*scale);
      canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
      const dataUrl=canvas.toDataURL('image/jpeg',0.72);
      // Show preview immediately
      const preview=el('sp-logo-preview');
      if(preview)preview.innerHTML=`<img src="${dataUrl}" style="width:100%;height:100%;object-fit:contain;">`;
      // Store in a temp variable — saved on modal save
      window._spLogoDataUrl=dataUrl;
      // Show remove button
      const btns=preview?.nextElementSibling?.querySelector('.btn-ghost.btn-xs:last-child');
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

function saveSponsor(eid){
  // sp-nm may be hidden (on non-main tab) — use mirror input as fallback
  const nameEl=el('sp-nm');
  const nameMirror=el('sp-nm-mirror');
  const name=(nameEl?.value||nameMirror?.value||'').trim();
  if(!name){
    if(nameEl)nameEl.style.borderColor='var(--red)';
    // Switch to main tab so user can see the error
    if(typeof switchSpTab==='function')switchSpTab('main');
    setTimeout(()=>{if(el('sp-nm')){el('sp-nm').style.borderColor='var(--red)';el('sp-nm').focus();}},50);
    return;
  }
  const priorities=Object.keys(SP_PRIO_LABELS).filter(p=>el(`sp-p-${p}`)?.checked);
  const history=el('sp-hist-edit')?readHistRows().filter(h=>h.event):(eid?getSponsor(eid)?.history||[]:[]);
  const products=el('sp-products-list')?readProductRows():(eid?getSponsor(eid)?.products||[]:[]);
  const audienceTags=(el('sp-audience-hidden')?.value||'').split(',').filter(Boolean);
  const integrationTypes=(el('sp-integrations-hidden')?.value||'').split('||').filter(Boolean);

  const existing=eid?getSponsor(eid):{};
  const data={
    name,
    website:el('sp-web')?.value.trim()||existing?.website||'',
    description:el('sp-desc')?.value.trim()||existing?.description||'',
    contactName:el('sp-cn')?.value.trim()||existing?.contactName||'',
    contactRole:el('sp-cr')?.value.trim()||existing?.contactRole||'',
    contactEmail:el('sp-ce')?.value.trim()||existing?.contactEmail||'',
    backupContact:el('sp-bc')?.value.trim()||existing?.backupContact||'',
    relationshipOwner:el('sp-ro')?.value.trim()||existing?.relationshipOwner||'',
    bestContact:el('sp-bm')?.value.trim()||existing?.bestContact||'',
    budgetCycle:el('sp-bc2')?.value.trim()||existing?.budgetCycle||'',
    assetsUrl:el('sp-assets-url')?.value.trim()||existing?.assetsUrl||'',
    assets:el('sp-as')?.value.trim()||existing?.assets||'',
    priorities:priorities.length?priorities:(existing?.priorities||[]),
    notes:el('sp-nt')?.value.trim()||existing?.notes||'',
    products:products.length?products:(existing?.products||[]),
    audienceTags:audienceTags.length?audienceTags:(existing?.audienceTags||[]),
    audienceNotes:el('sp-audience-notes')?.value.trim()||existing?.audienceNotes||'',
    priceTier:el('sp-price-tier')?.value||existing?.priceTier||'',
    integrationTypes:integrationTypes.length?integrationTypes:(existing?.integrationTypes||[]),
    integrationNotes:el('sp-integration-notes')?.value.trim()||existing?.integrationNotes||'',
    history,
    deliverables:existing?.deliverables||[],
    logoDataUrl:window._spLogoDataUrl==='__remove__'?null:
               window._spLogoDataUrl||existing?.logoDataUrl||null
  };

  if(eid){
    const idx=S.sponsors.findIndex(s=>s.id===eid);
    if(idx>-1){S.sponsors[idx]={...existing,...data};}
  } else {
    const newSponsor={id:'sp'+uid(),...data};
    S.sponsors.push(newSponsor);
    _spSelectedId=newSponsor.id;
  }
  window._spLogoDataUrl=null;
  save();closeModal();
  if(V==='sponsors'){el('content').innerHTML=renderSponsors();}
}

function updateFavicon(){
  const canvas=document.createElement('canvas');
  canvas.width=64;canvas.height=64;
  const ctx=canvas.getContext('2d');
  const logo=S.settings&&S.settings.logoUrl;
  if(logo){
    const img=new Image();
    img.onload=function(){
      ctx.fillStyle='#141414';
      _faviconRoundRect(ctx,0,0,64,64,12);ctx.fill();
      ctx.drawImage(img,6,6,52,52);
      _setFavicon(canvas.toDataURL('image/png'));
    };
    img.onerror=function(){_faviconMonogram(ctx,canvas);};
    img.src=logo;
  } else {
    _faviconMonogram(ctx,canvas);
  }
}
function _faviconMonogram(ctx,canvas){
  const acc='#62D0AA';
  ctx.fillStyle='#141414';
  _faviconRoundRect(ctx,0,0,64,64,14);ctx.fill();
  ctx.fillStyle=acc;
  _faviconRoundRect(ctx,7,7,50,50,10);ctx.fill();
  ctx.fillStyle='#141414';
  ctx.font='bold 26px sans-serif';
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('PF',32,33);
  _setFavicon(canvas.toDataURL('image/png'));
}
function _faviconRoundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}
function _setFavicon(dataUrl){
  let l=document.getElementById('favicon');
  if(!l){l=document.createElement('link');l.id='favicon';l.rel='icon';l.type='image/png';document.head.appendChild(l);}
  l.href=dataUrl;
}
