<script>
/* ════ CONSTANTS ════ */
const PASS='AirwigglesSecurity';

/* ════════════════════════════════════════════════════════
   SUPABASE CONFIGURATION
   These are your project credentials — safe to be in the
   client for a read/write anon key setup with RLS.
════════════════════════════════════════════════════════ */
const SB_URL='https://ozsoadqugrrqufuhlyaz.supabase.co';
const SB_KEY='sb_publishable_xP5lkE6IzTPjDym__9zmFg_PQBFusKo';
const SB_WORKSPACE='airwiggles'; // unique workspace ID — change if you run multiple instances

/* ── Supabase REST helpers ── */
async function sbGet(){
  try{
    const r=await fetch(`${SB_URL}/rest/v1/projectflow_state?workspace=eq.${SB_WORKSPACE}&select=*`,{
      headers:{'apikey':SB_KEY,'Authorization':`Bearer ${SB_KEY}`,'Content-Type':'application/json'}
    });
    if(r.status===404||r.status===400){
      // Table doesn't exist yet — show setup instructions
      console.error('ProjectFlow: Supabase table missing. Run the setup SQL in your Supabase dashboard.');
      _showSetupBanner();
      return null;
    }
    if(!r.ok)return null;
    const rows=await r.json();
    return rows.length>0?rows[0]:null;
  }catch(e){console.warn('Supabase load error:',e);return null;}
}

function _showSetupBanner(){
  if(document.getElementById('setup-banner'))return;
  const b=document.createElement('div');
  b.id='setup-banner';
  b.style.cssText='position:fixed;top:0;left:0;right:0;background:#f59e0b;color:#000;padding:10px 16px;font-size:.78rem;font-weight:600;z-index:99999;display:flex;align-items:center;gap:12px;';
  b.innerHTML=`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
  <span>Supabase table not found. Go to your Supabase dashboard → SQL Editor and run the setup query. <a href="#" onclick="document.getElementById('setup-sql-modal').style.display='flex';return false;" style="text-decoration:underline;">Show SQL →</a></span>
  <button onclick="this.parentElement.remove()" style="margin-left:auto;background:none;border:none;cursor:pointer;font-size:18px;font-weight:700;">×</button>`;
  document.body.appendChild(b);

  // Setup SQL modal
  const m=document.createElement('div');
  m.id='setup-sql-modal';
  m.style.cssText='display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:999999;align-items:center;justify-content:center;padding:20px;';
  m.innerHTML=`<div style="background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:24px;max-width:560px;width:100%;">
    <div style="font-size:1rem;font-weight:700;margin-bottom:12px;">Supabase Setup — Run this SQL once</div>
    <div style="font-size:.72rem;color:var(--text2);margin-bottom:12px;">Go to your Supabase project → SQL Editor → New query → paste and run:</div>
    <pre id="setup-sql-text" style="background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;font-size:.72rem;font-family:'DM Mono',monospace;overflow-x:auto;white-space:pre;color:var(--acc);">CREATE TABLE IF NOT EXISTS projectflow_state (
  workspace TEXT PRIMARY KEY,
  data TEXT NOT NULL,
  updated_at TIMESTAMPTZ DEFAULT NOW()
);

-- Allow anonymous read/write (secured by your app password)
ALTER TABLE projectflow_state ENABLE ROW LEVEL SECURITY;
CREATE POLICY "allow_all" ON projectflow_state
  FOR ALL USING (true) WITH CHECK (true);</pre>
    <div style="display:flex;gap:8px;margin-top:14px;">
      <button onclick="navigator.clipboard.writeText(document.getElementById('setup-sql-text').textContent);this.textContent='Copied!';setTimeout(()=>this.textContent='Copy SQL',1500);" style="background:var(--acc);color:var(--black);border:none;border-radius:7px;padding:8px 16px;font-size:.78rem;font-weight:700;cursor:pointer;">Copy SQL</button>
      <button onclick="document.getElementById('setup-sql-modal').style.display='none';" style="background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:7px;padding:8px 16px;font-size:.78rem;cursor:pointer;">Close</button>
    </div>
  </div>`;
  document.body.appendChild(m);
  m.addEventListener('click',e=>{if(e.target===m)m.style.display='none';});
}

async function sbUpsert(data,updatedAt){
  try{
    const r=await fetch(`${SB_URL}/rest/v1/projectflow_state`,{
      method:'POST',
      headers:{
        'apikey':SB_KEY,'Authorization':`Bearer ${SB_KEY}`,
        'Content-Type':'application/json',
        'Prefer':'resolution=merge-duplicates'
      },
      body:JSON.stringify({workspace:SB_WORKSPACE,data,updated_at:updatedAt})
    });
    return r.ok;
  }catch(e){console.warn('Supabase save error:',e);return false;}
}

/* ── Sync state ── */
let _lastSavedAt=null;       // ISO string of last save we wrote
let _syncChannel=null;       // Supabase realtime channel
let _saveDebounce=null;      // debounce timer for rapid saves
let _saveQueue=null;         // pending save while one is in flight
let _saving=false;           // save in flight flag
let _online=true;            // connectivity flag

function _setSyncStatus(status,msg=''){
  const ind=document.getElementById('sync-indicator');
  if(!ind)return;
  const icons={synced:'<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>',saving:'<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 102.13-9.36L1 10"/></svg>',error:'<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>',offline:'<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="1" y1="1" x2="23" y2="23"/><path d="M16.72 11.06A10.94 10.94 0 0119 12.55M5 12.55a10.94 10.94 0 015.17-2.39M10.71 5.05A16 16 0 0122.56 9M1.42 9a15.91 15.91 0 014.7-2.88M8.53 16.11a6 6 0 016.95 0M12 20h.01"/></svg>'};
  const colors={synced:'var(--green)',saving:'var(--acc)',error:'var(--red)',offline:'var(--yellow)'};
  const labels={synced:'Saved',saving:'Saving…',error:'Save failed',offline:'Offline'};
  ind.innerHTML=`<span style="color:${colors[status]};display:flex;align-items:center;gap:4px;">${icons[status]}<span style="font-size:.65rem;font-family:'DM Mono',monospace;">${msg||labels[status]}</span></span>`;
}

/* ── Core save — debounced, queued ── */
function save(){
  // Keep localStorage as offline fallback
  try{localStorage.setItem('pf4',JSON.stringify(S));}catch(e){}
  // Debounce remote saves — don't hammer Supabase on every keystroke
  if(_saveDebounce)clearTimeout(_saveDebounce);
  _saveDebounce=setTimeout(_doSave,600);
  _setSyncStatus('saving');
}

async function _doSave(){
  if(_saving){_saveQueue=true;return;}
  _saving=true;
  _saveQueue=false;
  const now=new Date().toISOString();
  const ok=await sbUpsert(JSON.stringify(S),now);
  _saving=false;
  if(ok){
    _lastSavedAt=now;
    _setSyncStatus('synced');
    const ts=new Date(now).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
    _setSyncStatus('synced',`Saved ${ts}`);
  } else {
    _setSyncStatus('error');
    _online=false;
  }
  // If another save was queued while this one was in flight, run it now
  if(_saveQueue)_doSave();
}

/* ── saveWithUndo — replaces all direct localStorage writes ── */
function saveWithUndo(label='Action'){
  _undoStack.push({snap:JSON.stringify(S),label});
  if(_undoStack.length>MAX_UNDO)_undoStack.shift();
  _redoStack.length=0;
  save();
}

function undo(){
  if(!_undoStack.length)return;
  const entry=_undoStack.pop();
  _redoStack.push({snap:JSON.stringify(S),label:entry.label});
  Object.assign(S,JSON.parse(entry.snap));
  save();
  render();
  showUndoToast(`Undone: ${entry.label}`,true);
}

function redo(){
  if(!_redoStack.length)return;
  const entry=_redoStack.pop();
  _undoStack.push({snap:JSON.stringify(S),label:entry.label});
  Object.assign(S,JSON.parse(entry.snap));
  save();
  render();
  showUndoToast(`Redone: ${entry.label}`,false);
}

/* ── load — fetches from Supabase, falls back to localStorage ── */
async function load(){
  // First, try Supabase
  const row=await sbGet();
  if(row&&row.data){
    try{
      const p=JSON.parse(row.data);
      S={...S,...p};
      _lastSavedAt=row.updated_at||null;
      _applyDefaults();
      return;
    }catch(e){console.warn('Failed to parse Supabase data:',e);}
  }
  // Fallback: localStorage (first time, or if offline)
  try{
    const r=localStorage.getItem('pf4');
    if(r){const p=JSON.parse(r);S={...S,...p};_applyDefaults();}
  }catch(e){}
}

/* ── Real-time polling (checks every 15s for changes from other users) ── */
let _pollTimer=null;
let _pollLastAt=null;

function startPolling(){
  if(_pollTimer)clearInterval(_pollTimer);
  _pollTimer=setInterval(async()=>{
    if(_saving||document.hidden)return; // don't poll if we're mid-save or tab is hidden
    try{
      const row=await sbGet();
      if(!row)return;
      // Only update if the server has a newer version than what we last saved
      if(row.updated_at&&row.updated_at!==_lastSavedAt&&row.updated_at!==_pollLastAt){
        _pollLastAt=row.updated_at;
        // Don't overwrite if we have pending unsaved changes in the debounce queue
        if(_saveDebounce)return;
        try{
          const remote=JSON.parse(row.data);
          Object.assign(S,remote);
          _applyDefaults();
          _lastSavedAt=row.updated_at;
          render();
          const ts=new Date(row.updated_at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
          _setSyncStatus('synced',`Updated ${ts}`);
          _showSyncToast();
        }catch(e){console.warn('Failed to apply remote update:',e);}
      }
    }catch(e){}
  },15000);
}

function _showSyncToast(){
  let t=document.getElementById('sync-toast');
  if(!t){t=document.createElement('div');t.id='sync-toast';
    t.style.cssText='position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:var(--surface3);color:var(--text2);border:1px solid var(--border);padding:7px 14px;border-radius:8px;font-size:.73rem;z-index:9999;opacity:0;transition:opacity .2s;white-space:nowrap;';
    document.body.appendChild(t);}
  t.textContent='↓ Updated by a team member';
  t.style.opacity='1';
  setTimeout(()=>{t.style.opacity='0';},3000);
}

/* ════ TASK DRAG REORDER ════ */
let _dragReorderTask=null;
let _dragGhost=null;
let _dragDropTarget=null;
let _dragDropPos=null; // 'before' | 'after'

function initTaskDragReorder(){
  document.querySelectorAll('[data-drag-grip]').forEach(grip=>{
    grip.addEventListener('pointerdown',startTaskDrag,{passive:false});
  });
}

function startTaskDrag(e){
  e.preventDefault();
  const row=e.currentTarget.closest('.task-item');
  if(!row)return;
  const id=row.dataset.id;
  if(!id)return;
  _dragReorderTask=id;

  // Ghost
  const t=getTask(id);
  _dragGhost=document.createElement('div');
  _dragGhost.className='task-drag-ghost';
  _dragGhost.textContent=t?t.name:'Task';
  document.body.appendChild(_dragGhost);
  moveDragGhost(e);

  row.classList.add('dragging');

  document.addEventListener('pointermove',onTaskDragMove,{passive:false});
  document.addEventListener('pointerup',onTaskDragEnd);
  document.addEventListener('pointercancel',onTaskDragEnd);
}

function moveDragGhost(e){
  if(!_dragGhost)return;
  _dragGhost.style.left=(e.clientX+14)+'px';
  _dragGhost.style.top=(e.clientY-12)+'px';
}

function onTaskDragMove(e){
  e.preventDefault();
  moveDragGhost(e);
  // Find target task item
  document.querySelectorAll('.task-row.drag-over-top,.task-row.drag-over-bot').forEach(r=>r.classList.remove('drag-over-top','drag-over-bot'));
  const el=document.elementFromPoint(e.clientX,e.clientY);
  const targetRow=el?.closest('.task-item');
  if(!targetRow||targetRow.dataset.id===_dragReorderTask){_dragDropTarget=null;return;}
  const rect=targetRow.getBoundingClientRect();
  const midY=rect.top+rect.height/2;
  _dragDropTarget=targetRow.dataset.id;
  _dragDropPos=e.clientY<midY?'before':'after';
  const taskRow=targetRow.querySelector('.task-row');
  if(taskRow)taskRow.classList.add(_dragDropPos==='before'?'drag-over-top':'drag-over-bot');
}

function onTaskDragEnd(e){
  document.removeEventListener('pointermove',onTaskDragMove);
  document.removeEventListener('pointerup',onTaskDragEnd);
  document.removeEventListener('pointercancel',onTaskDragEnd);

  if(_dragGhost){_dragGhost.remove();_dragGhost=null;}
  document.querySelectorAll('.task-item.dragging').forEach(r=>r.classList.remove('dragging'));
  document.querySelectorAll('.task-row.drag-over-top,.task-row.drag-over-bot').forEach(r=>r.classList.remove('drag-over-top','drag-over-bot'));

  if(_dragReorderTask&&_dragDropTarget&&_dragReorderTask!==_dragDropTarget){
    saveWithUndo('Reorder task');
    const ai=S.tasks.findIndex(t=>t.id===_dragReorderTask);
    const bi=S.tasks.findIndex(t=>t.id===_dragDropTarget);
    if(ai>=0&&bi>=0){
      const [moved]=S.tasks.splice(ai,1);
      const newBi=S.tasks.findIndex(t=>t.id===_dragDropTarget);
      S.tasks.splice(_dragDropPos==='before'?newBi:newBi+1,0,moved);
      save();
      render();
    }
  }
  _dragReorderTask=null;_dragDropTarget=null;_dragDropPos=null;
}

/* ════ FINANCE YEAR ════ */
function getFinYears(){
  const allDates=[...S.finance.recurring.map(e=>e.date||''),
    ...S.finance.oneoff.map(e=>e.date||''),
    ...S.projects.flatMap(p=>(p.expenses||[]).map(e=>e.date||''))
  ].filter(Boolean);
  const now=new Date();
  const curFY=now.getMonth()>=3?now.getFullYear():now.getFullYear()-1;
  const years=new Set();
  // Always include current + 2 future FYs so you can plan ahead
  years.add(curFY);
  years.add(curFY+1);
  years.add(curFY+2);
  // Add any FY that has actual data
  allDates.forEach(d=>{
    const dt=new Date(d);
    const fy=dt.getMonth()>=3?dt.getFullYear():dt.getFullYear()-1;
    years.add(fy);
  });
  return [...years].sort((a,b)=>b-a);
}

function getFYLabel(y){return`FY ${y}/${String(y+1).slice(2)}`;}

function isInFY(dateStr,fyYear){
  if(!dateStr)return true; // undated items always included
  const d=new Date(dateStr);
  const start=new Date(fyYear,3,1); // Apr 1
  const end=new Date(fyYear+1,2,31,23,59,59); // Mar 31
  return d>=start&&d<=end;
}

function totalRecFY(fy){
  // Recurring: annualise by freq (no date filter — recurring spans whole year)
  return S.finance.recurring.reduce((a,e)=>a+finAnn(e),0);
}

function totalOOFY(fy){
  return S.finance.oneoff.filter(e=>isInFY(e.date,fy)).reduce((a,e)=>a+e.amount,0);
}

function projExpTotalFY(fy){
  return S.projects.reduce((a,p)=>a+(p.expenses||[]).filter(e=>isInFY(e.date,fy)).reduce((b,e)=>b+e.amount,0),0);
}

  if(!text)return'';
  let h=text
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    // Code blocks (must be before inline code)
    .replace(/```([^`]+)```/g,'<pre style="background:var(--surface2);border-radius:6px;padding:8px 12px;font-family:\'DM Mono\',monospace;font-size:.78rem;overflow-x:auto;margin:6px 0;">$1</pre>')
    // Inline code
    .replace(/`([^`]+)`/g,'<code style="background:var(--surface2);border-radius:4px;padding:1px 5px;font-family:\'DM Mono\',monospace;font-size:.82em;">$1</code>')
    // Bold+italic
    .replace(/\*\*\*([^*]+)\*\*\*/g,'<strong><em>$1</em></strong>')
    // Bold
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    // Italic
    .replace(/\*([^*]+)\*/g,'<em>$1</em>')
    // Links
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener" style="color:var(--acc);">$1</a>')
    // Bullet lists
    .replace(/^[ \t]*[-*] (.+)$/gm,'<li style="margin-left:16px;">$1</li>')
    .replace(/(<li[^>]*>.*<\/li>\n?)+/g,'<ul style="margin:6px 0;padding:0;list-style:disc;">$&</ul>')
    // Numbered lists
    .replace(/^\d+\. (.+)$/gm,'<li style="margin-left:16px;">$1</li>')
    // Line breaks
    .replace(/\n/g,'<br>');
  return h;
}

let _searchIdx=0;
function openSearch(){
  const o=document.getElementById('search-overlay');
  if(!o)return;
  o.classList.add('open');
  const inp=document.getElementById('search-inp');
  if(inp){inp.value='';inp.focus();}
  document.getElementById('search-results').innerHTML='<div class="search-empty">Start typing to search tasks</div>';
}
function closeSearch(){
  document.getElementById('search-overlay')?.classList.remove('open');
}
function runSearch(q){
  const box=document.getElementById('search-results');
  if(!q.trim()){box.innerHTML='<div class="search-empty">Start typing to search tasks</div>';return;}
  const ql=q.toLowerCase();
  const hits=S.tasks.filter(t=>t.name.toLowerCase().includes(ql)||(t.description||'').toLowerCase().includes(ql)).slice(0,20);
  if(!hits.length){box.innerHTML='<div class="search-empty">No tasks found</div>';return;}
  _searchIdx=0;
  box.innerHTML=hits.map((t,i)=>{
    const proj=getProject(t.projectId);
    const hl=t.name.replace(new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`, 'gi'),'<mark>$1</mark>');
    return`<div class="search-result-item${i===0?' active':''}" data-id="${t.id}" onclick="goToTask('${t.id}')">
      <div class="ti-check ${t.done?'done':''}" style="pointer-events:none;flex-shrink:0;"></div>
      <div style="flex:1;min-width:0;">
        <div class="search-result-name">${hl}</div>
        ${proj?`<div class="search-result-meta">${proj.name}</div>`:''}
      </div>
      ${t.endDate?`<div class="search-result-meta">${fmtD(t.endDate)}</div>`:''}
    </div>`;
  }).join('');
}
function searchNav(e){
  if(e.key==='Escape'){closeSearch();return;}
  const items=[...document.querySelectorAll('.search-result-item')];
  if(!items.length)return;
  if(e.key==='ArrowDown'){e.preventDefault();_searchIdx=(_searchIdx+1)%items.length;}
  else if(e.key==='ArrowUp'){e.preventDefault();_searchIdx=(_searchIdx-1+items.length)%items.length;}
  else if(e.key==='Enter'){const active=items[_searchIdx];if(active)goToTask(active.dataset.id);return;}
  items.forEach((el,i)=>el.classList.toggle('active',i===_searchIdx));
  items[_searchIdx]?.scrollIntoView({block:'nearest'});
}
function goToTask(id){
  closeSearch();
  const t=getTask(id);if(!t)return;
  if(t.projectId){S.detailId=t.projectId;nav('dashboard');}else{nav('dashboard');}
  setTimeout(()=>{
    const el=document.querySelector(`.task-item[data-id="${id}"]`);
    if(el){el.scrollIntoView({behavior:'smooth',block:'center'});el.style.outline='2px solid var(--acc)';setTimeout(()=>el.style.outline='',1800);}
  },200);
}

function applyKanbanStatusChange(task, newStatus){
  const wasBlocked = task.kStatus === 'blocked';
  task.kStatus = newStatus;
  // Moving out of blocked → clear blockers (user is saying "this is unblocked")
  if(wasBlocked && newStatus !== 'blocked'){
    task.blockedBy = [];
  }
  if(newStatus === 'done'){
    task.done = true;
    cascadeChildrenDone(task.id);
    if(task.recur?.enabled) spawnRecurring(task);
  } else if(task.done && newStatus !== 'done'){
    task.done = false;
    // Re-check if it should be in blocked now (blockedBy was cleared above if wasBlocked)
    syncBlockedStatus(task.id);
  }
  // Sync anything that was blocked by this task
  S.tasks.filter(x=>(x.blockedBy||[]).includes(task.id)).forEach(x=>syncBlockedStatus(x.id));
}

function cascadeChildrenDone(parentId){
  kids(parentId).forEach(child=>{
    if(!child.done){
      child.done=true;
      child.kStatus='done';
      // recurse for subtasks
      cascadeChildrenDone(child.id);
    }
    // Unblock anything waiting on this child too
    S.tasks.filter(x=>(x.blockedBy||[]).includes(child.id)).forEach(x=>syncBlockedStatus(x.id));
  });
}

function syncBlockedStatus(id){
  const t=getTask(id);
  if(!t)return;
  // Blocked = has at least one blocker that is not yet done
  const hasActiveBlocker=(t.blockedBy||[]).some(bid=>{
    const b=getTask(bid);
    return b&&!b.done;
  });
  if(hasActiveBlocker&&!t.done&&t.kStatus!=='blocked'){
    t.kStatus='blocked';
  } else if(!hasActiveBlocker&&t.kStatus==='blocked'){
    // All blockers done — move to done if task is done, else to-do
    t.kStatus=t.done?'done':'todo';
  }
}

document.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx,dy=Math.abs(e.changedTouches[0].clientY-sy);if(dy>40)return;if(sx<60&&dx>55&&!el('panel').classList.contains('open'))togglePanel();if(dx<-55&&el('panel').classList.contains('open'))closePanel();},{passive:true});

/* ════ RENDER DISPATCH ════ */
function render(){
  const c=el('content');
  if(!c)return;
  hideBlockTooltip();
  if(S.detailId){c.innerHTML=renderDetail(S.detailId);initBlockedHover();return;}
  switch(V){
    case'dashboard':try{c.innerHTML=renderDash();}catch(e){console.error('Dashboard error:',e);c.innerHTML=`<div class='fu'><div class='page-hd'><div class='page-title'><em>Dashboard</em></div></div><div class='empty'><div class='empty-ico'><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" style="opacity:.35"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></div><div class='empty-txt'>Error loading dashboard: ${e.message}</div></div></div>`;}setTimeout(()=>{scrollGanttToday();initCoworkTooltips();},60);break;
    
    case'kanban':c.innerHTML=renderKanban();setTimeout(()=>initAllDnD(),80);return;
    case'campaign':c.innerHTML=renderCampaign();setTimeout(()=>{scrollGanttToday();initCoworkTooltips();},60);break;

    case'labels':c.innerHTML=renderLabels();break;
    case'templates':c.innerHTML=renderTemplates();break;
    case'finance':
      if(!S.finance.finAuth){
        c.innerHTML=renderFinanceGate();
      } else {
        c.innerHTML=renderFinance();setTimeout(()=>renderFinCharts(),80);
      }
      break;
    case'sponsors':c.innerHTML=renderSponsors();setTimeout(()=>initSponsorSearch(),50);break;
    case'settings':c.innerHTML=renderSettings();break;
  }
  c.scrollTop=0;
  initBlockedHover();
  
}

/* ════ DASHBOARD ════ */
// Track which event cards are expanded and which tab is active
if(!window._ecExpanded)window._ecExpanded={};
if(!window._ecTab)window._ecTab={};

function ecToggle(projId){
  window._ecExpanded[projId]=!window._ecExpanded[projId];
  if(!window._ecTab[projId])window._ecTab[projId]='tasks';
  const card=document.querySelector(`.ec-card[data-proj="${projId}"]`);
  if(!card)return;
  card.classList.toggle('expanded',!!window._ecExpanded[projId]);
  const body=card.querySelector('.ec-body');
  const chev=card.querySelector('.ec-chevron');
  if(body)body.classList.toggle('open',!!window._ecExpanded[projId]);
  if(chev)chev.classList.toggle('open',!!window._ecExpanded[projId]);
  if(window._ecExpanded[projId]){
    setTimeout(()=>{
      const qa=card.querySelector('.qa-bar-input');
      // Don't auto-focus — just ensure tabs are showing correct pane
      ecShowTab(projId,window._ecTab[projId],false);
    },30);
  }
}

function ecShowTab(projId,tab,save=true){
  if(save)window._ecTab[projId]=tab;
  const card=document.querySelector(`.ec-card[data-proj="${projId}"]`);
  if(!card)return;
  card.querySelectorAll('.ec-tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===tab));
  card.querySelectorAll('.ec-pane').forEach(p=>p.classList.toggle('active',p.dataset.pane===tab));
}

function renderDash(){
  const active=S.projects.filter(p=>p.status==='active');
  const mf=S.activeMember;

  // Team workload counts
  const memberTaskCounts={};
  S.members.forEach(m=>{memberTaskCounts[m.id]=0;});
  S.tasks.forEach(t=>{
    const p=getProject(t.projectId);if(!p||p.status!=='active'||t.done)return;
    (t.assignees||[]).forEach(mid=>{if(memberTaskCounts[mid]!==undefined)memberTaskCounts[mid]++;});
  });

  // Focus: overdue + due this week across all projects
  const now=new Date();const todayStr=toISO(now);
  const weekEnd=toISO(new Date(now.getTime()+7*86400000));
  const focusTasks=S.tasks.filter(t=>{
    if(t.done)return false;
    const p=getProject(t.projectId);if(!p||p.status!=='active')return false;
    if(mf&&!(t.assignees||[]).includes(mf))return false;
    return t.endDate&&t.endDate<=weekEnd;
  }).sort((a,b)=>a.endDate<b.endDate?-1:1).slice(0,8);

  return`<div class="fu">
<div class="page-hd">
  <div class="page-title"><em>Dashboard</em>${mf?`<span style="font-size:.75rem;font-weight:400;color:var(--acc);margin-left:8px;">· ${getMember(mf)?.name||''} <button class="btn btn-ghost btn-xs" style="margin-left:4px;" onclick="S.activeMember=null;save();render()">✕</button></span>`:''}</div>
  <div class="page-acts">
    <button class="btn btn-acc btn-sm" onclick="openModal('project',null)">+ Event</button>
  </div>
</div>

<!-- TIMELINE (collapsible) -->
${active.length>0?`<div style="margin-bottom:18px;">
  <div class="sec-hd" style="margin-bottom:10px;cursor:pointer;" onclick="const g=el('dash-gantt');if(g){const open=g.style.display!=='none';g.style.display=open?'none':'block';this.querySelector('.sec-chev').style.transform=open?'rotate(-90deg)':'';}">
    <span class="sec-lbl">Timeline</span>
    <svg class="sec-chev" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2.5" stroke-linecap="round" style="transition:transform .2s;"><polyline points="6 9 12 15 18 9"/></svg>
  </div>
  <div id="dash-gantt">${renderGantt(active,false)}</div>
</div>`:''}

${S.quickLinks.length>0||true?`<div style="margin-bottom:18px;">

function tryDomain(url){try{return new URL(url).hostname;}catch{return url;}}

function filterByMember(id){S.activeMember=S.activeMember===id?null:id;if(!S.dashFilters)S.dashFilters={project:'',member:'',label:''};S.dashFilters.member=S.activeMember||'';save();render();}

function filterMemberAndExpand(memberId){
  S.activeMember=S.activeMember===memberId?null:memberId;
  if(!S.dashFilters)S.dashFilters={project:'',member:'',label:''};
  S.dashFilters.member=S.activeMember||'';
  save();
  render();
}

function getDashTasks(){
  if(!S.dashFilters)S.dashFilters={project:'',member:'',label:''};
  if(S.hideDone===undefined)S.hideDone=false;
  const activeIds=S.projects.filter(p=>p.status==='active').map(p=>p.id);
  return S.tasks.filter(t=>{
    if(t.parentId)return false;
    // Include tasks with no project OR tasks belonging to active projects
    if(t.projectId && !activeIds.includes(t.projectId))return false;
    if(S.dashFilters.project&&t.projectId!==S.dashFilters.project)return false;
    if(S.dashFilters.member&&(!t.assignees||!t.assignees.includes(S.dashFilters.member)))return false;
    if(S.dashFilters.label&&(!t.labels||!t.labels.includes(S.dashFilters.label)))return false;
    if(S.activeMember&&(!t.assignees||!t.assignees.includes(S.activeMember)))return false;
    if(S.hideDone&&taskComp(t)===100)return false;
    return true;
  });
}

function renderDashTasksInline(){
  const d=el('dash-task-list');if(!d)return;
  const tasks=getDashTasks();
  const expanded=d.dataset.expanded==='1';
  const limit=expanded?tasks.length:7;
  d.innerHTML=renderTaskList(tasks.slice(0,limit),true);
  // Scrollable: truncated = max-height so user can scroll within 7-item view
  d.classList.toggle('truncated',!expanded);
  initBlockedHover();
  setTimeout(()=>{initAllDnD();},60);
  // Update task count
  const cnt=d.closest('.card')?.querySelector('.card-title span');
  if(cnt)cnt.textContent=`(${tasks.length})`;
  // Show/hide clear filters button
  const cfb=el('clear-filters-btn');
  if(cfb)cfb.style.display=(S.dashFilters?.project||S.dashFilters?.member||S.dashFilters?.label||S.activeMember)?'':'none';
  // Keep hide-done button state synced
  const hdb=el('hide-done-btn');
  if(hdb){hdb.classList.toggle('on',!!S.hideDone);}
  // Update view more / show less buttons
  const vmb=el('dash-view-more');
  const vsb=el('dash-show-less');
  if(vmb){
    if(tasks.length>7&&!expanded){
      vmb.style.display='';
      vmb.textContent=`View all ${tasks.length} tasks ↓`;
    } else {
      vmb.style.display='none';
    }
  }
  if(vsb){
    vsb.style.display=(expanded&&tasks.length>7)?'':'none';
  }
}
function expandDashTasks(){
  const d=el('dash-task-list');if(!d)return;
  d.dataset.expanded='1';
  renderDashTasksInline();
}
function collapseDashTasks(){
  const d=el('dash-task-list');if(!d)return;
  d.dataset.expanded='0';
  renderDashTasksInline();
}

function sortTasksDoneToBottom(tasks){
  // Stable sort: incomplete first, done last. Within each group preserve original order.
  return [...tasks].sort((a,b)=>{
    if(a.done===b.done)return 0;
    return a.done?1:-1;
  });
}
function renderTaskList(tasks,showProj=false){return sortTasksDoneToBottom(tasks).map(t=>renderTaskRow(t,0,showProj)).join('');}

function _posCoworkTip(e,tip){
  const x=e.clientX,y=e.clientY;
  const tw=tip.offsetWidth||220,th=tip.offsetHeight||80;
  let left=x+12,top=y-th/2;
  if(left+tw>window.innerWidth-8)left=x-tw-12;
  if(top<8)top=8;
  if(top+th>window.innerHeight-8)top=window.innerHeight-th-8;
  tip.style.left=left+'px';tip.style.top=top+'px';
}
function hideCoworkTip(){const tip=el('cowork-tooltip');if(tip)tip.classList.remove('visible');}

function initBlockedHover(){
  const bt=el('block-tooltip');
  if(!bt)return;
  document.querySelectorAll('[data-blockers]').forEach(row=>{
    row.addEventListener('mouseenter',e=>{
      const names=row.dataset.blockers;
      if(!names)return;
      bt.innerHTML=`<strong style="display:flex;align-items:center;gap:5px;"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>Blocked by:</strong><br>${names}<br><span style="font-size:.65rem;color:rgba(240,201,107,.6);">Click row to view blocker task</span>`;
      bt.style.display='block';
      const r=row.getBoundingClientRect();
      bt.style.left=Math.min(r.left+10,window.innerWidth-260)+'px';
      bt.style.top=(r.bottom+6)+'px';
    });
    row.addEventListener('mouseleave',e=>{
      if(!e.relatedTarget||!row.contains(e.relatedTarget))bt.style.display='none';
    });
    row.addEventListener('click',e=>{
      bt.style.display='none';
      if(e.target.closest('.task-acts')||e.target.closest('.qsub-btn')||e.target.classList.contains('ti-check')||e.target.classList.contains('ti-exp'))return;
      const ids=row.dataset.blockerIds;if(!ids)return;

      if(t.projectId){S.detailId=t.projectId;nav('dashboard');}

  });

function showBlockedAlert(id){
  const t=getTask(id);if(!t)return;
  const names=blockerNames(t).join(', ');
  alert(`Blocked by: ${names}\n\nComplete those tasks first.`);
}

function toggleExp(id){const i=S.expandedTasks.indexOf(id);i>=0?S.expandedTasks.splice(i,1):S.expandedTasks.push(id);save();render();}

function toggleDone(id){
  saveWithUndo("Toggle done");
  const t=getTask(id);if(!t)return;
  const ch=kids(id);if(ch.length>0)return;
  t.done=!t.done;
  if(t.done){t.kStatus='done';}
  else{syncBlockedStatus(id);} // restore to blocked or todo based on active blockers
  if(t.done&&t.recur?.enabled)spawnRecurring(t);
  // Cascade: if marking a parent done, also complete all children
  if(t.done)cascadeChildrenDone(id);
  // Unblock any tasks that were waiting on this one
  S.tasks.filter(x=>(x.blockedBy||[]).includes(id)).forEach(x=>syncBlockedStatus(x.id));
  save();render();
}

function spawnRecurring(t){
  const shifts={daily:1,weekly:7,monthly:30,yearly:365};
  const shift=(shifts[t.recur.type]||7)*(t.recur.interval||1);
  S.tasks.push({...t,id:uid(),done:false,kStatus:t.kStatus==='done'?'todo':t.kStatus,slackReminder:{},
    startDate:t.startDate?addDays(t.startDate,shift):'',
    endDate:t.endDate?addDays(t.endDate,shift):'',
    parentId:null});
}

function _commitInlineSub(inp,parentId,projectId,subAddEl){
  const name=inp.value.trim();if(!name)return;
  const prioBtn=subAddEl?.querySelector('.qa-prio-btn');
  const prio=prioBtn?.dataset.prio||'Medium';
  const phase=subAddEl?.querySelector('.qa-phase-pill.active')?.dataset.phase||'';
  const labels=Array.from(subAddEl?.querySelectorAll('.qa-label-dot.active')||[]).map(d=>d.dataset.lid);
  const endDate=subAddEl?.querySelector('input[type="date"]')?.value||'';
  const assignees=Array.from(subAddEl?.querySelectorAll('[data-mid]')||[]).filter(d=>d.style.opacity==='1').map(d=>d.dataset.mid);
  const description=subAddEl?.querySelector('.inline-sub-desc')?.value.trim()||'';
  saveWithUndo('Add subtask');
  if(!S.expandedTasks.includes(parentId))S.expandedTasks.push(parentId);
  S.tasks.unshift({id:uid(),name,description,projectId,parentId,priority:prio,phase,assignees,labels,blockedBy:[],startDate:'',endDate,kStatus:'todo',done:false,recur:{enabled:false,type:'weekly',interval:1},slackReminder:{}});
  save();
  inp.value='';
  if(prioBtn){prioBtn.dataset.prio='Medium';prioBtn.className='qa-prio-btn Medium';prioBtn.textContent='M';}
  // Reset meta fields
  if(subAddEl){
    subAddEl.querySelectorAll('.qa-phase-pill.active').forEach(p=>{p.classList.remove('active');p.style.background='transparent';p.style.color=phaseColor(p.dataset.phase);});
    subAddEl.querySelectorAll('.qa-label-dot.active').forEach(d=>d.classList.remove('active'));
    subAddEl.querySelectorAll('[data-mid]').forEach(d=>{d.style.opacity='0.4';d.style.outline='';});
    const di=subAddEl.querySelector('input[type="date"]');if(di)di.value='';
    const de=subAddEl.querySelector('.inline-sub-desc');if(de){de.value='';de.classList.remove('open');}
  }
  render();
  // Re-open inline bar on the same task after render
  setTimeout(()=>{
    const r=document.querySelector(`.task-item[data-id="${parentId}"]`);
    if(r){const ex=r.querySelector('.inline-sub-add');if(ex){ex.classList.add('open');ex.querySelector('.inline-sub-inp')?.focus();}else quickAddSub(parentId);}
  },60);
}

function qaTogglePrio(btn){
  const order=['Low','Medium','High'];
  const cur=btn.dataset.prio||'Medium';
  const next=order[(order.indexOf(cur)+1)%order.length];
  btn.dataset.prio=next;
  btn.className=`qa-prio-btn ${next}`;
  btn.textContent=next[0];
}

function qaInitBar(barId){
  const bar=el(barId);
  if(!bar)return;
  bar.addEventListener('focusout',e=>{
    // Check if focus is moving outside the bar
    setTimeout(()=>{
      if(bar.contains(document.activeElement))return;
      // Desc: hide if empty
      const desc=el(`${barId}-desc`);
      if(desc&&!desc.value.trim())desc.classList.remove('open');
    },80);
  });
}

function qaOpenDesc(barId){
  const desc=el(`${barId}-desc`);
  if(desc)desc.classList.add('open');
}

function qaMaybeCloseDesc(barId){
  // Use setTimeout so we can check if focus moved within the bar
  setTimeout(()=>{
    const bar=el(barId);
    if(!bar)return;
    // If focus is still within the bar, don't close
    if(bar.contains(document.activeElement))return;
    // Close description only if it's empty
    const desc=el(`${barId}-desc`);
    if(desc&&!desc.value.trim()){
      desc.classList.remove('open');
    }
  },120);
}

function qaTogglePhase(el,barId,phase){
  const pills=document.querySelectorAll(`#${barId}-meta .qa-phase-pill`);
  const wasActive=el.classList.contains('active');
  pills.forEach(p=>{
    p.classList.remove('active');
    p.style.background='transparent';
    p.style.color=phaseColor(p.dataset.phase);
  });
  if(!wasActive){
    el.classList.add('active');
    el.style.background=phaseColor(phase);
    el.style.color='#111';
  }
  // Keep meta pinned if anything selected
  _qaPinMeta(barId);
}

function qaToggleLabel(el,barId,labelId){
  el.classList.toggle('active');
  _qaPinMeta(barId);
}

function _qaPinMeta(barId){
  const meta=el(`${barId}-meta`);if(!meta)return;
  const hasPhase=meta.querySelector('.qa-phase-pill.active');
  const hasLabel=meta.querySelector('.qa-label-dot.active');
  const hasDate=el(`${barId}-date`)?.value;
  if(hasPhase||hasLabel||hasDate)meta.classList.add('pinned');
  else meta.classList.remove('pinned');
}

function qaKeyDown(e,barId,projectId){
  if(!el(barId)._qaInited){el(barId)._qaInited=true;qaInitBar(barId);}
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();qaSubmit(barId,projectId);}
  if(e.key==='Escape'){
    // Esc on name: close desc if empty, blur bar
    const desc=el(`${barId}-desc`);
    if(desc&&!desc.value.trim())desc.classList.remove('open');
    el(`${barId}-name`)?.blur();
  }
}

function qaAutoDesc(e,barId){
  // Description only opens via Shift+Enter - this handler is kept for future use
}

function qaSubmit(barId,projectId){
  const nameEl=el(`${barId}-name`);
  const name=nameEl?.value.trim();
  if(!name)return;
  const desc=el(`${barId}-desc`)?.value.trim()||'';
  const prioBtn=el(`${barId}-prio`);
  const prio=prioBtn?.dataset.prio||'Medium';
  const proj=projectId||el(`${barId}-proj`)?.value||'';
  const assignees=[...(window._qaAssignees[barId]||[])];
  // Read meta row values
  const activePhase=document.querySelector(`#${barId}-meta .qa-phase-pill.active`)?.dataset.phase||'';
  const activeLabels=Array.from(document.querySelectorAll(`#${barId}-meta .qa-label-dot.active`)).map(d=>d.dataset.lid);
  const endDate=el(`${barId}-date`)?.value||'';
  saveWithUndo('Add task');
  S.tasks.unshift({id:uid(),name,description:desc,projectId:proj,parentId:null,priority:prio,phase:activePhase,assignees,labels:activeLabels,blockedBy:[],startDate:'',endDate,kStatus:'todo',done:false,recur:{enabled:false,type:'weekly',interval:1},slackReminder:{}});
  save();
  // Clear name and desc but KEEP assignees and priority sticky
  if(nameEl)nameEl.value='';
  const descEl=el(`${barId}-desc`);
  if(descEl){descEl.value='';descEl.classList.remove('open');}
  // Reset meta row
  const metaEl=el(`${barId}-meta`);
  if(metaEl){
    metaEl.querySelectorAll('.qa-phase-pill.active').forEach(p=>{p.classList.remove('active');p.style.background='transparent';p.style.color=phaseColor(p.dataset.phase);});
    metaEl.querySelectorAll('.qa-label-dot.active').forEach(d=>d.classList.remove('active'));
    metaEl.classList.remove('pinned');
  }
  const dateEl=el(`${barId}-date`);if(dateEl)dateEl.value='';
  render();
  // Re-focus bar after render — restore sticky assignees
  setTimeout(()=>{
    const inp=document.querySelector(`#${barId}-name`)||document.querySelector('.qa-bar-input');
    if(inp)inp.focus();
  },60);
}

/* Inline task name editing — click name to edit in-place */
function inlineEditName(id,el){
  const t=getTask(id);if(!t)return;
  const span=el;
  const input=document.createElement('input');
  input.className='ti-name-edit';
  input.value=t.name;
  span.replaceWith(input);
  input.focus();input.select();
  function commit(){
    const v=input.value.trim();
    if(v&&v!==t.name){saveWithUndo('Rename task');t.name=v;save();}
    render();
  }
  input.addEventListener('blur',commit);
  input.addEventListener('keydown',e=>{
    if(e.key==='Enter'){e.preventDefault();input.blur();}
    if(e.key==='Escape'){input.value=t.name;input.blur();}
  });
}

${(()=>{

  // Prize & delivery counts
  let totalPrizes=0,deliveredPrizes=0;
  spons.forEach(sp=>{
    (sp.products||[]).forEach(prod=>{
      totalPrizes++;
      if(prod.delivered)deliveredPrizes++;
    });
  });

  // Cash value & invoice status
  let cashTotal=0,invoicesSent=0,invoicesPaid=0,cashSponsorCount=0,fulfilledCount=0;
  spons.forEach(sp=>{
    const s=getSponsor(sp.id);
    if(!s)return;
    if(sp.type==='cash'||sp.type==='both'){
      cashSponsorCount++;
      if(sp.invoiceSent)invoicesSent++;
      if(sp.invoicePaid)invoicesPaid++;
    }
    if(sp.fulfilled)fulfilledCount++;
  });

  // Prize pool value
  const prizePool=spons.reduce((tot,sp)=>{
    const s=getSponsor(sp.id);if(!s)return tot;
    return tot+(sp.products||[]).reduce((sub,prod)=>{
      const pp=(s.products||[]).find(x=>x.name===prod.name);
      const cost=pp?.cost||0;
      const qty=Object.values(prod.quantities||{}).reduce((a,q)=>a+(parseInt(q)||0),0)||(prod.categories||[]).length||0;
      return sub+cost*qty;
    },0);
  },0);

  // Event date tile — three states using startDate and endDate
  const today=new Date();todayStr=toISO(today);
  const msPerDay=86400000;
  const eventDateTile=(()=>{
    if(!p.startDate&&!p.endDate)return null;
    const start=p.startDate?new Date(p.startDate):null;
    const end=p.endDate?new Date(p.endDate):null;
    const daysToStart=start?Math.round((start-today)/msPerDay):null;
    const daysToEnd=end?Math.round((end-today)/msPerDay):null;
    const daysSinceEnd=end?Math.round((today-end)/msPerDay):null;

    // BEFORE event starts
    if(daysToStart!==null&&daysToStart>0){
      return{
        label:'Starts in',
        value:`${daysToStart}d`,
        color:'var(--text2)',
        sub:fmtD(p.startDate)

    // Event starts today

    }
    // Event in progress (started, not ended yet)

      return{
        label:'Event ends in',
        value:`${daysToEnd}d`,
        color:'var(--acc)',
        sub:`Ends ${fmtD(p.endDate)}`
      };

    // Ends today

      </div>

  return`<div style="margin-bottom:18px;">
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:9px;cursor:pointer;" onclick="toggleOverviewExpanded('${p.id}')">
    <svg id="ov-toggle-ico-${p.id}" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="var(--acc)" stroke-width="2.5" stroke-linecap="round" style="transition:transform .2s;transform:${(window._ovExpanded||{})[p.id]!==false?'rotate(0deg)':'rotate(-90deg)'}"><polyline points="6 9 12 15 18 9"/></svg>
    <span style="font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--acc);">Overview</span>
  </div>
  <div id="ov-body-${p.id}" style="display:${(window._ovExpanded||{})[p.id]!==false?'block':'none'};">
  <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;">
    ${stat('<polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/>',
      'Tasks',
      `${doneTasks}/${totalTasks}`,
      comp===100?'var(--green)':overdueTasks>0?'var(--red)':'var(--text2)',
      overdueTasks>0?`⚠ ${overdueTasks} overdue`:comp===100?'All done!':'')}
    ${sponsorCount>0?stat('<path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/>',
      'Sponsors',
      `${sponsorCount}`,
      'var(--acc)',
      cashSponsorCount>0?`${cashSponsorCount} cash sponsor${cashSponsorCount!==1?'s':''}`:''
    ):''}
    ${totalPrizes>0?stat('<polyline points="20 12 20 22 4 22 4 12"/><rect x="2" y="7" width="20" height="5"/><line x1="12" y1="22" x2="12" y2="7"/><path d="M12 7H7.5a2.5 2.5 0 010-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 000-5C13 2 12 7 12 7z"/>',
      'Prizes',
      `${deliveredPrizes}/${totalPrizes}`,
      deliveredPrizes===totalPrizes&&totalPrizes>0?'var(--green)':'var(--yellow)',
      deliveredPrizes===totalPrizes&&totalPrizes>0?'All delivered':deliveredPrizes>0?`${totalPrizes-deliveredPrizes} remaining`:'None delivered yet'
    ):''}
    ${prizePool>0?stat('<line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/>',
      'Prize pool',
      `£${prizePool.toFixed(0)}`,
      'var(--yellow)',
      ''
    ):''}
    ${cashSponsorCount>0?stat('<path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>',
      'Invoices',
      `${invoicesPaid}/${cashSponsorCount}`,

    ):''}
    ${eventDateTile?stat(calIcon,
      eventDateTile.label,

function toggleKanbanDone(id){
  const t=getTask(id);if(!t)return;
  t.done=!t.done;
  if(t.done){t.kStatus='done';}
  else{syncBlockedStatus(id);}
  if(t.done&&t.recur?.enabled)spawnRecurring(t);
  if(t.done)cascadeChildrenDone(id);
  S.tasks.filter(x=>(x.blockedBy||[]).includes(id)).forEach(x=>syncBlockedStatus(x.id));
  save();render();
}

function getGanttMonths(){
  // Rolling 12 months: from 1 month before today
  const now=new Date();
  const months=[];
  for(let i=-1;i<11;i++){
    const d=new Date(now.getFullYear(),now.getMonth()+i,1);
    months.push({month:d.getMonth(),year:d.getFullYear(),days:new Date(d.getFullYear(),d.getMonth()+1,0).getDate()});
  }
  return months;
}
function ganttDayOffset(dateStr){
  // offset in days from start of gantt window
  if(!dateStr)return null;
  const gm=getGanttMonths();
  const startDate=new Date(gm[0].year,gm[0].month,1);
  const d=new Date(dateStr);
  const diff=Math.round((d-startDate)/86400000);
  return diff;
}
function ganttTotalDays(){return getGanttMonths().reduce((a,m)=>a+m.days,0);}

function renderGantt(projects,fullPage=false){
  const gmonths=getGanttMonths();
  const totalDays=ganttTotalDays();
  const totalW=totalDays*DPX;
  const now=new Date();
  const todayOffset=ganttDayOffset(now.toISOString().slice(0,10));
  let prevYear=null;
  const monthsHtml=gmonths.map(m=>{
    const yr=m.year!==prevYear?` '${String(m.year).slice(2)}`:'';
    prevYear=m.year;
    return`<div class="gmo" style="width:${m.days*DPX}px;min-width:${m.days*DPX}px;">${MOS[m.month]}${yr}</div>`;
  }).join('');
  let rows='';
  projects.forEach(p=>{
    const comp=projComp(p);const isExp=S.expandedGantt.includes(p.id);
    const bp=barP(p.startDate,p.endDate);
    const bHtml=bp?`<div class="gbar" style="left:${bp.l}px;width:${bp.w}px;background:${p.color}22;border:1px solid ${p.color}55;" onclick="openDetail('${p.id}')"><div class="gbar-fill" style="width:${comp}%;background:${p.color};"></div><div class="gbar-txt">${p.name} · ${comp}%</div></div>`:'';
    // Phase segments rendered as a separate row below the project bar
    const phaseBars=getPhaseBars(p);
    const phaseHtml=phaseBars.length>0?phaseBars.map(seg=>{
      const col=phaseColor(seg.phase);
      const bg=phaseBg(seg.phase);
      const label=seg.w>40?`<span style="font-size:.55rem;font-weight:700;color:${col};white-space:nowrap;overflow:hidden;padding:0 4px;line-height:1;">${seg.phase}</span>`:'';
      return`<div style="position:absolute;left:${seg.l}px;width:${seg.w}px;height:14px;background:${bg};border:1px solid ${col}44;border-radius:3px;display:flex;align-items:center;overflow:hidden;" title="${seg.phase}">${label}</div>`;
    }).join(''):'';
    const top=S.tasks.filter(t=>t.projectId===p.id&&!t.parentId);
    rows+=`<div class="grow"><div class="grow-lbl" onclick="openDetail('${p.id}')"><button class="gexp" onclick="event.stopPropagation();toggleGExp('${p.id}')">${top.length>0?(isExp?'▼':'▶'):'·'}</button><div style="width:7px;height:7px;border-radius:50%;background:${p.color};flex-shrink:0;"></div><span class="grow-lbl-name">${p.name}</span></div><div class="grow-chart" style="width:${totalW}px;position:relative;">${bHtml}${phaseHtml?`<div style="position:relative;height:14px;margin-top:2px;">${phaseHtml}</div>`:''}</div></div>`;
    if(isExp)top.forEach(t=>{const tb=barP(t.startDate,t.endDate);const tc=taskComp(t);const tHtml=tb?`<div class="gbar" style="left:${tb.l}px;width:${tb.w}px;height:11px;background:${p.color}18;border:1px solid ${p.color}35;"><div class="gbar-fill" style="width:${tc}%;background:${p.color}80;"></div></div>`:'';rows+=`<div class="grow"><div class="grow-lbl sub"><span class="grow-lbl-name" style="font-size:.68rem;color:var(--text2);">${t.name}</span><span style="font-family:'DM Mono',monospace;font-size:.58rem;color:var(--muted);">${tc}%</span></div><div class="grow-chart" style="width:${totalW}px;">${tHtml}</div></div>`;});
  });
  const inner=`<div class="gantt-scroll" id="gantt-scroll"><div class="gantt-inner" style="width:${175+totalW}px;"><div class="gantt-hdr"><div class="glcol">Project / Task</div><div class="gmonths" style="width:${totalW}px;">${monthsHtml}</div></div><div style="position:relative;"><div class="today-ln" style="left:${175+Math.max(0,todayOffset)*DPX}px;height:100%;"><span class="today-tag">TODAY</span></div>${renderCoworkRow(totalW)}${projects.length===0?`<div class="empty"><div class="empty-ico">${ICO.calendar}</div><div class="empty-txt">No active projects.</div></div>`:rows}</div></div></div>`;
  if(fullPage)return`<div class="fu"><div class="page-hd"><div class="page-title">Gantt <em>Timeline</em></div></div>${inner}</div>`;
  return inner;
}
function barP(s,e){
  if(!s||!e)return null;
  const sd=ganttDayOffset(s),ed=ganttDayOffset(e);
  if(sd===null||ed===null)return null;
  const w=Math.max((ed-sd)*DPX,8);
  return{l:sd*DPX,w};
}

function getPhaseBars(p){
  // Returns array of {phase, l, w} for rendering on the Gantt
  if(!p.startDate||!p.endDate)return[];
  const defs=S.settings.phaseDefaults||{planning:2,prelaunch:6,postEvent:2};
  const pw=p.phaseWeeks||{};
  const planWks=pw.planning!=null?pw.planning:defs.planning??2;
  const preWks=pw.prelaunch!=null?pw.prelaunch:defs.prelaunch??6;
  const postWks=pw.postEvent!=null?pw.postEvent:defs.postEvent??2;

  const liveStart=new Date(p.startDate);
  const liveEnd=new Date(p.endDate);

  // Pre-launch start: liveStart - prelaunch weeks
  const preLaunchStart=new Date(liveStart);preLaunchStart.setDate(preLaunchStart.getDate()-preWks*7);
  // Planning start: preLaunch start - planning weeks
  const planningStart=new Date(preLaunchStart);planningStart.setDate(planningStart.getDate()-planWks*7);
  // Post-event end: liveEnd + postEvent weeks
  const postEnd=new Date(liveEnd);postEnd.setDate(postEnd.getDate()+postWks*7);

  function iso(d){return d.toISOString().slice(0,10);}
  const segments=[];
  if(planWks>0){
    const b=barP(iso(planningStart),iso(preLaunchStart));
    if(b)segments.push({phase:'Planning',l:b.l,w:b.w});
  }
  if(preWks>0){
    const b=barP(iso(preLaunchStart),iso(liveStart));
    if(b)segments.push({phase:'Pre-launch',l:b.l,w:b.w});
  }
  {
    const b=barP(p.startDate,p.endDate);
    if(b)segments.push({phase:'Live',l:b.l,w:b.w});
  }
  if(postWks>0){
    const b=barP(iso(liveEnd),iso(postEnd));
    if(b)segments.push({phase:'Post-event',l:b.l,w:b.w});
  }
  return segments;
}

    const members=(d.members||[]).map(id=>getMember(id)).filter(Boolean);

    const dateStr=fmtD(d.date);

    const safeMembers=memberNames.replace(/'/g,"\\'").replace(/"/g,'&quot;');

}

/* ════ TEMPLATES ════ */
function renderCampaign(){
  // Filters stored on S.campaignFilter
  if(!S.campaignFilter)S.campaignFilter={project:'',phase:'',member:''};
  const cf=S.campaignFilter;
  const allProjs=S.projects.filter(p=>p.status==='active');

  // Get filtered tasks — top-level only for the board view
  let tasks=S.tasks.filter(t=>{
    const p=getProject(t.projectId);
    if(!p||p.status!=='active')return false;
    if(cf.project&&t.projectId!==cf.project)return false;
    if(cf.phase&&t.phase!==cf.phase)return false;
    if(cf.member&&!(t.assignees||[]).includes(cf.member))return false;
    return true;
  });

  // Group by label — tasks with multiple labels appear in each group
  // Tasks with no label go into an "Uncategorised" group
  const labelMap={};
  S.labels.forEach(l=>{labelMap[l.id]=l;});
  const groups={}; // labelId -> {label, tasks[]}
  const noLabel=[];
  tasks.forEach(t=>{
    const tLabels=(t.labels||[]).filter(id=>labelMap[id]);
    if(tLabels.length===0){noLabel.push(t);}
    else{tLabels.forEach(lid=>{if(!groups[lid])groups[lid]={label:labelMap[lid],tasks:[]};groups[lid].tasks.push(t);});}
  });

  // Phase summary counts
  const phaseCounts={};
  PHASES.forEach(ph=>{phaseCounts[ph]=tasks.filter(t=>t.phase===ph).length;});
  const total=tasks.length;
  const done=tasks.filter(t=>t.done).length;

  const taskCard=(t)=>{
    const proj=getProject(t.projectId);
    const od=overdue(t.endDate)&&!t.done;
    const ch=kids(t.id);
    const comp=taskComp(t);
    const phC=t.phase?phaseColor(t.phase):'';
    const phBg=t.phase?phaseBg(t.phase):'';
    return`<div style="background:var(--surface2);border:1px solid ${t.done?'var(--border2)':od?'rgba(224,96,96,.3)':'var(--border)'};border-radius:10px;padding:10px 12px;cursor:pointer;transition:border-color .15s;opacity:${t.done?.55:1};" onclick="openModal('task','${t.id}')">
      <div style="display:flex;align-items:flex-start;gap:8px;">
        <div class="ti-check ${t.done?'done':''}" onclick="event.stopPropagation();toggleDone('${t.id}')" style="margin-top:2px;flex-shrink:0;"></div>
        <div style="flex:1;min-width:0;">
          <div style="font-size:.8rem;font-weight:600;color:${t.done?'var(--muted)':'var(--text)'};text-decoration:${t.done?'line-through':'none'};line-height:1.35;margin-bottom:4px;">${t.name}</div>
          <div style="display:flex;flex-wrap:wrap;gap:4px;align-items:center;">
            ${t.phase?`<span style="font-size:.6rem;padding:1px 6px;border-radius:3px;font-weight:700;background:${phBg};color:${phC};">${t.phase}</span>`:''}
            ${proj?`<span style="font-size:.6rem;padding:1px 5px;border-radius:3px;background:${proj.color}22;color:${proj.color};font-weight:600;">${proj.name}</span>`:''}
            ${t.endDate?`<span style="font-size:.6rem;color:${od?'var(--red)':'var(--muted)'};">${od?'⚠ ':''}${fmtD(t.endDate)}</span>`:''}
            ${ch.length>0?`<span style="font-size:.6rem;color:var(--muted);">${comp}% (${ch.filter(c=>c.done).length}/${ch.length})</span>`:''}
          </div>
          ${(t.assignees||[]).length>0?`<div style="display:flex;gap:3px;margin-top:5px;">${(t.assignees||[]).map(id=>avHtml(id,16)).join('')}</div>`:''}
        </div>
      </div>
    </div>`;
  };

  const orderedGroups=S.labels
    .filter(l=>groups[l.id])
    .map(l=>groups[l.id]);
  if(noLabel.length>0)orderedGroups.push({label:{id:'__none',name:'Uncategorised',color:'var(--muted)'},tasks:noLabel});

  const colHtml=orderedGroups.map(g=>`
    <div style="min-width:260px;max-width:300px;flex:1;">
      <div style="display:flex;align-items:center;gap:7px;margin-bottom:10px;padding:0 2px;">
        <div style="width:10px;height:10px;border-radius:2px;background:${g.label.color};flex-shrink:0;"></div>
        <span style="font-size:.75rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--text2);">${g.label.name}</span>
        <span style="font-size:.68rem;color:var(--muted);margin-left:auto;">${g.tasks.filter(t=>t.done).length}/${g.tasks.length}</span>
      </div>
      <div style="display:flex;flex-direction:column;gap:7px;">
        ${g.tasks.map(taskCard).join('')}
      </div>
    </div>`).join('');

  return`<div class="fu">
<div class="page-hd">
  <div class="page-title"><em>Campaign Board</em></div>
  <div style="margin-left:auto;display:flex;align-items:center;gap:6px;font-size:.72rem;color:var(--muted);">
    <span style="font-family:'DM Mono',monospace;color:var(--green);">${done}</span>/<span style="font-family:'DM Mono',monospace;">${total}</span> done
    ${cf.project||cf.phase||cf.member?`<button class="btn btn-ghost btn-xs" style="margin-left:4px;" onclick="S.campaignFilter={project:'',phase:'',member:''};save();render()">✕ Clear all</button>`:''}
  </div>
</div>

<!-- Timeline -->
<div style="margin-bottom:18px;">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
    <span style="font-size:.7rem;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.07em;">Timeline</span>
    <div style="display:flex;gap:6px;">
      <button class="btn btn-ghost btn-xs" onclick="scrollGanttToday()" style="font-size:.65rem;">Today</button>
      <button class="btn btn-ghost btn-xs" onclick="var w=document.getElementById('campaign-gantt');var open=w.style.display!=='none';w.style.display=open?'none':'';this.textContent=open?'Show timeline':'Hide timeline';" style="font-size:.65rem;">Hide timeline</button>
    </div>
  </div>
  <div id="campaign-gantt" style="background:var(--surface);border:1px solid var(--border);border-radius:11px;overflow:hidden;">
    ${renderGantt(allProjs)}
  </div>
</div>

<!-- Filter bar — projects, phases, members as clickable pills -->
<div style="display:flex;flex-direction:column;gap:10px;margin-bottom:18px;padding:12px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:11px;">

  ${allProjs.length>0?`<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
    <span style="font-size:.65rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;flex-shrink:0;width:52px;">Project</span>
    <div style="display:flex;gap:5px;flex-wrap:wrap;">
      <span class="pill-opt${!cf.project?' active':''}" style="${!cf.project?'background:var(--teal-dim);border-color:var(--acc);color:var(--acc);':''}" onclick="S.campaignFilter.project='';save();render()">All</span>
      ${allProjs.map(p=>{const act=cf.project===p.id;return`<span class="pill-opt${act?' active':''}" style="${act?'background:'+p.color+'22;border-color:'+p.color+';color:'+p.color+';':'border-color:'+p.color+'33;'}" onclick="S.campaignFilter.project=S.campaignFilter.project==='${p.id}'?'':'${p.id}';save();render()"><span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:${p.color};margin-right:4px;vertical-align:middle;flex-shrink:0;"></span>${p.name}</span>`;}).join('')}
    </div>
  </div>`:''}

  <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
    <span style="font-size:.65rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;flex-shrink:0;width:52px;">Phase</span>
    <div style="display:flex;gap:5px;flex-wrap:wrap;">
      <span class="pill-opt${!cf.phase?' active':''}" style="${!cf.phase?'background:var(--teal-dim);border-color:var(--acc);color:var(--acc);':''}" onclick="S.campaignFilter.phase='';save();render()">All</span>
      ${PHASES.map(ph=>{const act=cf.phase===ph;const n=phaseCounts[ph]||0;return`<span class="pill-opt${act?' active':''}" style="border:2px solid ${phaseColor(ph)};background:${act?phaseColor(ph):'transparent'};color:${act?'#111':phaseColor(ph)};font-weight:${act?'700':'500'};transition:all .15s;" onclick="S.campaignFilter.phase=S.campaignFilter.phase==='${ph}'?'':'${ph}';save();render()">${act?'✓ ':''}${ph}${n?` <span style="font-family:'DM Mono',monospace;font-size:.58rem;opacity:${act?'1':'.7'};">${n}</span>`:''}</span>`;}).join('')}
    </div>
  </div>

  ${S.members.length>0?`<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
    <span style="font-size:.65rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;flex-shrink:0;width:52px;">Member</span>
    <div class="av-toggle-grid" style="gap:5px;">
      ${S.members.map(m=>{const act=cf.member===m.id;return`<div class="av-toggle${act?' active':''}" style="padding:3px 8px 3px 4px;" onclick="S.campaignFilter.member=S.campaignFilter.member==='${m.id}'?'':'${m.id}';save();render()">${avHtml(m.id,18)}<span style="font-size:.71rem;">${m.name.split(' ')[0]}</span></div>`;}).join('')}
    </div>
  </div>`:``}

</div>

${orderedGroups.length===0?`<div class="empty"><div class="empty-ico">${ICO.tag}</div><div class="empty-txt">No tasks with labels yet.<br>Add labels to your tasks to organise by channel.</div></div>`:`
<div style="display:flex;gap:14px;overflow-x:auto;align-items:flex-start;padding-bottom:20px;">
  ${colHtml}
</div>`}
</div>`;
}

</div>
${generalTmpls.length>0?`

`:''}
${generalTmpls.length===0?`<div class="empty"><div class="empty-ico">${ICO.copy}</div><div class="empty-txt">No general task templates yet.</div></div>`:''}

</div>`;

function saveProjectAsTemplate(projId){
  const p=getProject(projId);if(!p)return;
  // Show a small inline modal to name the template
  const mc=el('mc');
  mc.style.display='flex';
  mc.innerHTML=`<div class="mo" onclick="if(event.target.classList.contains('mo'))closeModal()">
  <div class="mo-box" style="max-width:400px;">
    <div class="mo-hd"><span class="mo-title">Save as template</span><button class="mo-close" onclick="closeModal()">×</button></div>
    <div class="mo-body">
      <div style="font-size:.78rem;color:var(--text2);margin-bottom:14px;">Saves the task structure from <strong style="color:var(--text);">${p.name}</strong> as a reusable template. Sponsors, assignees, dates and expenses are not included.</div>
      <div class="field"><label class="flbl">Template name</label><input class="inp" id="pt-name" value="${p.name} template" placeholder="e.g. AirCon template"></div>
      <div style="font-size:.72rem;color:var(--muted);margin-top:6px;">${S.tasks.filter(t=>t.projectId===projId&&!t.parentId).length} top-level tasks · ${S.tasks.filter(t=>t.projectId===projId&&t.parentId).length} subtasks will be saved</div>
    </div>
    <div class="mo-ft">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-acc" onclick="_confirmSaveProjTemplate('${projId}')">Save template</button>
    </div>
  </div></div>`;
  setTimeout(()=>{const inp=el('pt-name');if(inp){inp.focus();inp.select();}},60);
}

function _confirmSaveProjTemplate(projId){
  const name=el('pt-name')?.value.trim();
  if(!name){const inp=el('pt-name');if(inp)inp.style.borderColor='var(--red)';return;}
  const p=getProject(projId);if(!p)return;
  if(!S.projectTemplates)S.projectTemplates=[];
  const captureTasks=(tasks,parentId=null)=>tasks
    .filter(t=>t.projectId===projId&&t.parentId===parentId)
    .map(t=>({
      name:t.name,
      description:t.description||'',
      priority:t.priority||'Medium',
      kStatus:'todo',
      subtasks:captureTasks(tasks,t.id),
    }));
  const allTasks=S.tasks.filter(t=>t.projectId===projId);
  const tmpl={
    id:uid(),name,
    description:p.description||'',
    priority:p.priority||'',
    color:p.color||COLORS[0],
    tasks:captureTasks(allTasks),
    expenses:(p.expenses||[]).map(e=>({id:uid(),desc:e.desc,amount:e.amount,cat:e.cat,date:''})),
    tools:(p.tools||[]).map(t=>({id:uid(),name:t.name,cost:t.cost,url:t.url})),
    savedAt:toISO(new Date()),
  };
  S.projectTemplates.push(tmpl);
  save();
  closeModal();
  showToast(`"${name}" saved — find it in Templates`);
  window._tmplTab='project';
}

function useProjectTemplate(tmplId){
  const tmpl=(S.projectTemplates||[]).find(t=>t.id===tmplId);
  if(!tmpl)return;
  // Store template ref so projectModalHtml can pre-fill from it
  window._pendingProjTmpl=tmpl;
  openModal('project',null);
}

    <div class="mo-ft">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-danger" onclick="S.projectTemplates=(S.projectTemplates||[]).filter(t=>t.id!=='${id}');save();closeModal();render();">Delete</button>

  </div></div>`;
}

/* ════ PROJECT TEMPLATE EDITOR ════ */
let _ptBuf=[];
let _ptEditing=-1;
let _ptTmplId='';

function escHtml(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function ptPickPrio(btn,val){
  const prioColors={Low:'var(--green)',Medium:'var(--yellow)',High:'var(--orange,#f97316)',Critical:'var(--red)'};
  document.querySelectorAll('#pt-prio-pills .pill-opt').forEach(function(p){p.classList.remove('active');p.style.background='';p.style.borderColor='';p.style.color='';});
  btn.classList.add('active');
  const col=prioColors[val]||'var(--acc)';
  btn.style.background=col;btn.style.borderColor=col;btn.style.color='var(--black)';
  const inp=document.getElementById('pt-prio');if(inp)inp.value=val;
}

function editProjectTemplate(id){
  const tmpl=(S.projectTemplates||[]).find(t=>t.id===id);
  if(!tmpl)return;
  _ptBuf=(tmpl.tasks||[]).map(function(t){return Object.assign({},t,{subtasks:(t.subtasks||[]).map(function(s){return Object.assign({},s);})});});
  _ptEditing=-1;
  _ptTmplId=id;
  const mc=el('mc');mc.style.display='flex';

  const defPrio=tmpl.priority||'Medium';
  const defColor=tmpl.color||COLORS[0];
  const PRIOS=['Low','Medium','High','Critical'];
  const prioColors={Low:'var(--green)',Medium:'var(--yellow)',High:'var(--orange,#f97316)',Critical:'var(--red)'};

  var prioPills=PRIOS.map(function(pr){
    var act=defPrio===pr;var col=prioColors[pr]||'var(--acc)';
    return '<span class="pill-opt'+(act?' active':'')+'" style="'+(act?'background:'+col+';border-color:'+col+';color:var(--black);':'')+'" onclick="ptPickPrio(this,\''+pr+'\')" data-val="'+pr+'">'+pr+'</span>';
  }).join('');

  var colorDots=COLORS.map(function(c){
    return '<svg class="clr-dot'+(defColor===c?' sel':'')+'" width="26" height="26" viewBox="0 0 26 26" onclick="pickC(\'pt-clrs\',\'pt-color\',\''+c+'\',this)" style="cursor:pointer;flex:none;"><circle cx="13" cy="13" r="10" fill="'+c+'"/><circle class="ring-hover" cx="13" cy="13" r="11.5" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.2" opacity="0" style="transition:opacity .15s;"/><circle class="ring" cx="13" cy="13" r="11.5" fill="none" stroke="white" stroke-width="1.5" opacity="0" style="transition:opacity .15s;"/></svg>';
  }).join('');

  var html='<div class="mo-box mo-wide">';
  html+='<div class="mo-hd"><span class="mo-title">Edit project template</span><button class="mo-close" onclick="closeModal()">×</button></div>';
  html+='<div class="mo-body" style="display:flex;flex-direction:column;gap:13px;">';
  html+='<div><input class="inp" id="pt-edit-name" value="'+escHtml(tmpl.name)+'" placeholder="Template name…" style="font-size:.92rem;font-weight:600;"></div>';
  html+='<div><label class="flbl">Description</label><textarea class="txta" id="pt-edit-desc" style="min-height:55px;">'+escHtml(tmpl.description||'')+'</textarea></div>';
  html+='<div><label class="flbl">Priority</label><div class="pill-sel" id="pt-prio-pills">'+prioPills+'</div><input type="hidden" id="pt-prio" value="'+defPrio+'"></div>';
  html+='<div><label class="flbl">Colour</label><div class="clr-grid" id="pt-clrs">'+colorDots+'</div><input type="hidden" id="pt-color" value="'+defColor+'"></div>';
  html+='<hr class="div" style="margin:0;">';
  html+='<div><div style="font-size:.72rem;font-weight:700;color:var(--text2);margin-bottom:9px;text-transform:uppercase;letter-spacing:.06em;">Tasks in template</div>';
  html+='<div id="pt-task-list"></div>';
  html+='<div style="background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:12px;margin-top:8px;">';
  html+='<div style="font-size:.72rem;font-weight:600;margin-bottom:9px;">Add task</div>';
  html+='<input class="inp" id="pt-t-name" placeholder="Task name…" style="margin-bottom:9px;" onkeydown="if(event.key===\'Enter\'){event.preventDefault();addPtT();}">';
  if(S.members.length>0){
    html+='<div style="margin-bottom:9px;"><label class="flbl">Assignees</label><div class="av-toggle-grid" id="pt-t-av">';
    S.members.forEach(function(m){html+='<div class="av-toggle" onclick="this.classList.toggle(\'active\')" data-id="'+m.id+'">'+avHtml(m.id,18)+'<span>'+m.name.split(' ')[0]+'</span></div>';});
    html+='</div></div>';
  }
  if(S.labels.length>0){
    html+='<div style="margin-bottom:9px;"><label class="flbl">Labels</label><div class="pill-sel" id="pt-t-lb">';
    S.labels.forEach(function(l){html+='<span class="pill-opt" style="border-color:'+l.color+'44;color:'+l.color+'88;" onclick="this.classList.toggle(\'active\');this.style.background=this.classList.contains(\'active\')?\''+l.color+'22\':\'\';this.style.borderColor=this.classList.contains(\'active\')?\''+l.color+'\':\''+l.color+'44\';this.style.color=this.classList.contains(\'active\')?\''+l.color+'\':\''+l.color+'88\';" data-id="'+l.id+'">'+l.name+'</span>';});
    html+='</div></div>';
  }
  html+='<div style="margin-bottom:9px;"><label class="flbl">Phase</label><div class="pill-sel" id="pt-t-phase-pills"><span class="pill-opt active" onclick="ptPickAddPhase(this,\'\')" data-val="">None</span>';
  PHASES.forEach(function(ph){html+='<span class="pill-opt" onclick="ptPickAddPhase(this,\''+ph+'\')" data-val="'+ph+'">'+ph+'</span>';});
  html+='</div><input type="hidden" id="pt-t-phase" value=""></div>';
  html+='<button class="btn btn-acc btn-sm" onclick="addPtT()" style="width:100%;">+ Add task</button>';
  html+='</div></div></div>';
  html+='<div class="mo-ft"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-acc" onclick="savePtTmpl()">Save changes</button></div>';
  html+='</div>';

  mc.innerHTML='<div class="mo" onclick="if(event.target.classList.contains(\'mo\'))closeModal()">'+html+'</div>';
  setTimeout(renderPtBuf, 30);
}

function ptPickAddPhase(btn,val){
  document.querySelectorAll('#pt-t-phase-pills .pill-opt').forEach(function(p){p.classList.remove('active');p.style.background='';p.style.borderColor='';p.style.color='';});
  btn.classList.add('active');
  if(val){btn.style.background=phaseBg(val);btn.style.borderColor=phaseColor(val);btn.style.color=phaseColor(val);}
  const inp=document.getElementById('pt-t-phase');if(inp)inp.value=val;
}

function addPtT(){
  const n=el('pt-t-name')?.value.trim();if(!n)return;
  const phase=el('pt-t-phase')?.value||'';
  const assignees=Array.from(document.querySelectorAll('#pt-t-av .av-toggle.active')).map(function(x){return x.dataset.id;}).filter(Boolean);
  const labels=Array.from(document.querySelectorAll('#pt-t-lb .pill-opt.active')).map(function(x){return x.dataset.id;}).filter(Boolean);
  _ptBuf.push({name:n,phase,assignees,labels,subtasks:[]});
  renderPtBuf();
  const inp=el('pt-t-name');if(inp){inp.value='';inp.focus();}
  document.querySelectorAll('#pt-t-av .av-toggle').forEach(function(x){x.classList.remove('active');});
  document.querySelectorAll('#pt-t-lb .pill-opt').forEach(function(x){x.classList.remove('active');x.style.background='';x.style.borderColor='';x.style.color='';});
  const nonePhase=document.querySelector('#pt-t-phase-pills .pill-opt[data-val=""]');
  if(nonePhase)ptPickAddPhase(nonePhase,'');
}

function rmPtT(i){if(_ptEditing===i)_ptEditing=-1;else if(_ptEditing>i)_ptEditing--;_ptBuf.splice(i,1);renderPtBuf();}
function movePtT(i,dir){const j=i+dir;if(j<0||j>=_ptBuf.length)return;var tmp=_ptBuf[i];_ptBuf[i]=_ptBuf[j];_ptBuf[j]=tmp;if(_ptEditing===i)_ptEditing=j;else if(_ptEditing===j)_ptEditing=i;renderPtBuf();}

function editPtT(i){
  if(_ptEditing>=0&&_ptEditing!==i)savePtTEdit(_ptEditing);
  _ptEditing=(_ptEditing===i)?-1:i;
  renderPtBuf();
  if(_ptEditing===i)setTimeout(function(){el('pt-edit-name-'+i)?.focus();},30);
}

function savePtTEdit(i){
  const t=_ptBuf[i];if(!t)return;
  const name=el('pt-edit-name-'+i)?.value.trim();if(name)t.name=name;
  t.phase=el('pt-edit-phase-'+i)?.value||'';
  t.assignees=Array.from(document.querySelectorAll('#pt-edit-av-'+i+' .av-toggle.active')).map(function(x){return x.dataset.id;}).filter(Boolean);
  t.labels=Array.from(document.querySelectorAll('#pt-edit-lb-'+i+' .pill-opt.active')).map(function(x){return x.dataset.id;}).filter(Boolean);
  _ptEditing=-1;
  renderPtBuf();
}

function ptEditPickPhase(i,btn,val){
  const container=btn.closest('.pill-sel');
  if(container)container.querySelectorAll('.pill-opt').forEach(function(p){p.classList.remove('active');p.style.background='';p.style.borderColor='';p.style.color='';});
  btn.classList.add('active');
  if(val){btn.style.background=phaseBg(val);btn.style.borderColor=phaseColor(val);btn.style.color=phaseColor(val);}
  else{btn.style.background='var(--surface3)';btn.style.borderColor='var(--border2)';}
  const inp=document.getElementById('pt-edit-phase-'+i);if(inp)inp.value=val;
}

function commitPtSub(ti){
  const n=el('pt-sub-name-'+ti)?.value.trim();if(!n)return;
  const assignees=Array.from(document.querySelectorAll('#pt-sub-av-'+ti+' .av-toggle.active')).map(function(x){return x.dataset.id;}).filter(Boolean);
  const labels=Array.from(document.querySelectorAll('#pt-sub-lb-'+ti+' .pill-opt.active')).map(function(x){return x.dataset.id;}).filter(Boolean);
  const phase=el('pt-sub-phase-'+ti)?.value||'';
  if(!_ptBuf[ti].subtasks)_ptBuf[ti].subtasks=[];
  _ptBuf[ti].subtasks.push({name:n,assignees,labels,phase});
  renderPtBuf();
}

function ptSubPickPhase(ti,btn,val){
  const container=document.getElementById('pt-sub-phase-pills-'+ti);
  if(container)container.querySelectorAll('.pill-opt').forEach(function(p){p.classList.remove('active');p.style.background='';p.style.borderColor='';p.style.color='';});
  btn.classList.add('active');
  if(val){btn.style.background=phaseBg(val);btn.style.borderColor=phaseColor(val);btn.style.color=phaseColor(val);}
  else{btn.style.background='var(--surface3)';btn.style.borderColor='var(--border2)';}
  const inp=document.getElementById('pt-sub-phase-'+ti);if(inp)inp.value=val;
}

function rmPtSub(ti,si){if(_ptBuf[ti]?.subtasks)_ptBuf[ti].subtasks.splice(si,1);renderPtBuf();}

function renderPtBuf(){
  const l=el('pt-task-list');if(!l)return;
  if(_ptBuf.length===0){l.innerHTML='<div style="color:var(--muted);font-size:.75rem;padding:8px 0;">No tasks yet. Add one below.</div>';return;}
  var out='';
  _ptBuf.forEach(function(t,i){
    var isEditing=_ptEditing===i;
    var chips=[
      t.phase?'<span style="font-size:.6rem;padding:1px 6px;border-radius:3px;background:'+phaseBg(t.phase)+';color:'+phaseColor(t.phase)+';font-weight:700;">'+t.phase+'</span>':'',
    ];
    (t.assignees||[]).forEach(function(id){var m=getMember(id);if(m)chips.push(avHtml(id,16));});
    (t.labels||[]).forEach(function(id){var lb=getLabel(id);if(lb)chips.push('<span style="font-size:.6rem;padding:1px 6px;border-radius:3px;background:'+lb.color+'22;color:'+lb.color+';border:1px solid '+lb.color+'44;">'+lb.name+'</span>');});
    chips=chips.filter(Boolean);

    if(isEditing){
      var memberPills='';
      S.members.forEach(function(m){memberPills+='<div class="av-toggle'+((t.assignees||[]).includes(m.id)?' active':'')+'" onclick="this.classList.toggle(\'active\')" data-id="'+m.id+'">'+avHtml(m.id,18)+'<span>'+m.name.split(' ')[0]+'</span></div>';});
      var labelPills='';
      S.labels.forEach(function(lb){var sel=(t.labels||[]).includes(lb.id);labelPills+='<span class="pill-opt'+(sel?' active':'')+'" style="border-color:'+lb.color+(sel?'':44)+';color:'+lb.color+(sel?'':'88')+';'+(sel?'background:'+lb.color+'22;':'')+'" onclick="this.classList.toggle(\'active\');var on=this.classList.contains(\'active\');this.style.background=on?\''+lb.color+'22\':\'\';this.style.borderColor=on?\''+lb.color+'\':\''+lb.color+'44\';this.style.color=on?\''+lb.color+'\':\''+lb.color+'88\';" data-id="'+lb.id+'">'+lb.name+'</span>';});
      var phasePills='<span class="pill-opt'+(!t.phase?' active':'')+'" style="'+(!t.phase?'background:var(--surface3);border-color:var(--border2);':'')+'" onclick="ptEditPickPhase('+i+',this,\'\')" data-val="">None</span>';
      PHASES.forEach(function(ph){var sel=t.phase===ph;phasePills+='<span class="pill-opt'+(sel?' active':'')+'" style="'+(sel?'background:'+phaseBg(ph)+';border-color:'+phaseColor(ph)+';color:'+phaseColor(ph)+';':'')+'" onclick="ptEditPickPhase('+i+',this,\''+ph+'\')" data-val="'+ph+'">'+ph+'</span>';});

      out+='<div style="background:var(--surface2);border:1.5px solid var(--acc);border-radius:9px;padding:12px;margin-bottom:6px;">';
      out+='<div style="font-size:.7rem;font-weight:600;color:var(--acc);margin-bottom:8px;">Editing task</div>';
      out+='<input class="inp" id="pt-edit-name-'+i+'" value="'+escHtml(t.name)+'" placeholder="Task name…" style="margin-bottom:9px;">';
      if(S.members.length>0)out+='<div style="margin-bottom:9px;"><label class="flbl">Assignees</label><div class="av-toggle-grid" id="pt-edit-av-'+i+'">'+memberPills+'</div></div>';
      if(S.labels.length>0)out+='<div style="margin-bottom:9px;"><label class="flbl">Labels</label><div class="pill-sel" id="pt-edit-lb-'+i+'">'+labelPills+'</div></div>';
      out+='<div style="margin-bottom:10px;"><label class="flbl">Phase</label><div class="pill-sel">'+phasePills+'</div><input type="hidden" id="pt-edit-phase-'+i+'" value="'+(t.phase||'')+'"></div>';
      out+='<div style="display:flex;gap:6px;justify-content:flex-end;"><button class="btn btn-ghost btn-sm" onclick="_ptEditing=-1;renderPtBuf()">Cancel</button><button class="btn btn-acc btn-sm" onclick="savePtTEdit('+i+')">Save</button></div>';
      out+='</div>';
    } else {
      out+='<div style="background:var(--surface2);border-radius:7px;padding:9px 11px;margin-bottom:6px;border:1px solid var(--border);">';
      out+='<div style="display:flex;align-items:center;gap:6px;">';
      out+='<div style="display:flex;flex-direction:column;gap:1px;flex-shrink:0;">';
      out+='<button class="reorder-arrow" style="padding:1px 5px;font-size:9px;" onclick="movePtT('+i+',-1)" '+(i===0?'disabled':'')+'>▲</button>';
      out+='<button class="reorder-arrow" style="padding:1px 5px;font-size:9px;" onclick="movePtT('+i+',1)" '+(i===_ptBuf.length-1?'disabled':'')+'>▼</button>';
      out+='</div>';
      out+='<span style="flex:1;font-size:.82rem;font-weight:500;">'+escHtml(t.name)+'</span>';
      if(chips.length)out+='<div style="display:flex;align-items:center;gap:4px;flex-wrap:wrap;">'+chips.join('')+'</div>';
      out+='<button style="background:none;border:none;cursor:pointer;color:var(--muted);padding:2px 5px;border-radius:4px;font-size:.7rem;" onclick="editPtT('+i+')" title="Edit">✎</button>';
      out+='<button style="background:none;border:none;cursor:pointer;color:var(--muted);font-size:14px;line-height:1;padding:2px 5px;border-radius:4px;" onmouseover="this.style.color=\'var(--red)\'" onmouseout="this.style.color=\'var(--muted)\'" onclick="rmPtT('+i+')">×</button>';
      out+='</div>';

      // Subtasks

function savePtTmpl(){
  const tmpl=(S.projectTemplates||[]).find(function(t){return t.id===_ptTmplId;});if(!tmpl)return;
  const name=document.getElementById('pt-edit-name')?.value.trim();
  if(!name){const i=document.getElementById('pt-edit-name');if(i)i.style.borderColor='var(--red)';return;}
  if(_ptEditing>=0)savePtTEdit(_ptEditing);
  tmpl.name=name;
  tmpl.description=document.getElementById('pt-edit-desc')?.value.trim()||'';
  tmpl.priority=document.getElementById('pt-prio')?.value||'Medium';
  tmpl.color=document.getElementById('pt-color')?.value||COLORS[0];
  tmpl.tasks=[..._ptBuf];
  _ptBuf=[];_ptEditing=-1;_ptTmplId='';
  save();closeModal();render();
}

function _createSponsorTemplate(type){
  // Pre-populate _ttBuf with defaults then open modal
  const subtasks=SP_TYPE_SUBTASKS[type]||[];
  _ttBuf=subtasks.map(name=>({name,priority:'Medium',subtasks:[]}));
  const typeLabel=SP_TYPES[type]?.label||type;
  // Open the template modal and pre-set the name and type
  openModal('taskTmpl',null);
  // After modal renders, set the type and name
  setTimeout(()=>{
    const nameEl=el('tt-name');if(nameEl)nameEl.value=`${typeLabel} Sponsorship`;
    const typeEl=el('tt-sp-type');if(typeEl)typeEl.value=type;
    renderTtBuf();
  },50);
}
