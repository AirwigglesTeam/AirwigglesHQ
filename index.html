    const sv=S.finance.savings||{rate:20};
    const rev2=totalRevenue();
    const rec2=totalRec(),oo2=totalOO(),projE=projExpTotal(),allE=rec2+oo2+projE;
    const profit2=rev2-allE,ct2=corpTax(Math.max(0,profit2)),net2=profit2-ct2.tax;
    const savingsAmt=Math.max(0,net2)*(sv.rate/100);
    const profitForPayout=Math.max(0,net2)-savingsAmt;
    const teamRates=S.finance.teamRates||{};
    const globalRate=parseFloat(S.finance.globalRate)||0;
    const effRate=m=>globalRate>0?globalRate:(parseFloat(teamRates[m.id])||0);
    const totalTeamPay=S.members.reduce((a,m)=>{const h=memberHoursTotal(m);return a+h*effRate(m);},0);

    // ── DIVIDEND WATERFALL per Articles of Association (Art. 3.1) ──
    // A shares (held by directors): Greg 42, Jonny 20, Lewis 38 (raw weights → total 100)
    // B shares (investor): Asbjoern 25 (raw weight, same pool as above-threshold)
    // Phase 1: First £81,000 of distributable profit → A shareholders only, pro-rata
    // Phase 2: Above £81,000 → all shareholders, new weights: Greg 32, Jonny 15, Lewis 28, Asbjoern 25 (total 100)
    const THRESHOLD = 81000;
    const A_SHARES = [{name:'Greg Lester',w:42},{name:'Jonny Sands',w:20},{name:'Lewis Thompson',w:38}];
    const ALL_SHARES = [{name:'Greg Lester',w:32,type:'A'},{name:'Jonny Sands',w:15,type:'A'},{name:'Lewis Thompson',w:28,type:'A'},{name:'Asbjoern Andersen',w:25,type:'B'}];
    const aTotal = A_SHARES.reduce((s,x)=>s+x.w,0);  // 100
    const allTotal = ALL_SHARES.reduce((s,x)=>s+x.w,0); // 100

    // Phase 1 pool: min(profitForPayout, THRESHOLD)
    const phase1Pool = Math.min(profitForPayout, THRESHOLD);
    // Phase 2 pool: anything above threshold
    const phase2Pool = Math.max(0, profitForPayout - THRESHOLD);

    // Calculate each person's total dividend
    const dividends = {};
    A_SHARES.forEach(s=>{dividends[s.name]=(dividends[s.name]||0)+phase1Pool*(s.w/aTotal);});
    ALL_SHARES.forEach(s=>{dividends[s.name]=(dividends[s.name]||0)+phase2Pool*(s.w/allTotal);});

    const phase1Done = profitForPayout >= THRESHOLD;
    const phase2Active = phase2Pool > 0;
    const phase1Pct = profitForPayout > 0 ? Math.min(100, (phase1Pool/THRESHOLD)*100) : 0;

    function avBadge(name,type){
      const initials=name.split(' ').map(w=>w[0]).join('');
      const col=type==='B'?'var(--blue)':'var(--acc)';
      return`<div style="position:relative;flex-shrink:0;">
        <div style="width:32px;height:32px;border-radius:50%;background:${type==='B'?'rgba(61,130,240,.15)':'var(--teal-dim)'};border:1.5px solid ${col};display:flex;align-items:center;justify-content:center;font-size:.6rem;font-weight:700;color:${col};">${initials}</div>
        <div style="position:absolute;bottom:-2px;right:-2px;width:12px;height:12px;border-radius:50%;background:${col};display:flex;align-items:center;justify-content:center;font-size:.48rem;font-weight:800;color:var(--black);border:1.5px solid var(--surface);">${type}</div>
      </div>`;
    }

    return`
    <div class="fin-grid2" style="align-items:start;">

      <!-- LEFT: Team payouts -->
      <div class="card">
        <div class="card-hd"><span class="card-title">Team Member Payouts (Hours × Rate)</span></div>
        <div style="padding:11px 14px;border-bottom:1px solid var(--border2);display:flex;align-items:center;gap:12px;">
          <span style="font-size:.76rem;font-weight:600;">Hourly rate for all members</span>
          <div style="display:flex;align-items:center;gap:4px;">
            <span style="font-size:.72rem;color:var(--muted);">£</span>
            <input class="amt-inp" type="number" min="0" step="0.50" value="${parseFloat(S.finance.globalRate)||''}" placeholder="0.00" style="width:80px;" onchange="S.finance.globalRate=parseFloat(this.value)||0;save();reCalcFin();">
            <span style="font-size:.72rem;color:var(--muted);">/hr</span>
          </div>
          <span style="font-size:.68rem;color:var(--muted);margin-left:4px;">applied to all team members</span>
        </div>
        <div class="card-bd">
          ${(()=>{
            const nonDirectors=S.members.filter(m=>!m.isDirector);
            const directors=S.members.filter(m=>m.isDirector);
            const totalNDPay=nonDirectors.reduce((a,m)=>{const h=memberHoursTotal(m);return a+h*effRate(m);},0);
            const totalNDHours=nonDirectors.reduce((a,m)=>a+memberHoursTotal(m),0);
            const teamPayBudget=parseFloat((S.finance.budgets||{})["Team Pay"])||0;
            const availFunds=teamPayBudget>0?teamPayBudget:profitForPayout;
            return`
            ${S.members.length===0?'<div style="color:var(--muted);font-size:.78rem;">No team members added yet.</div>':''}            ${directors.length>0?`<div style="font-size:.62rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:4px 0 6px;">Directors — paid via dividends</div>
            ${directors.map(m=>`<div style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--border2);opacity:.6;min-width:0;">
              ${m.photoUrl?`<img src="${m.photoUrl}" style="width:26px;height:26px;border-radius:50%;object-fit:cover;flex-shrink:0;">`:`<div class="av" style="width:26px;height:26px;background:${m.color};font-size:.5rem;flex-shrink:0;">${m.initials}</div>`}
              <span style="font-size:.8rem;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${m.name}</span>
              <span style="font-size:.6rem;color:var(--acc);padding:1px 6px;background:var(--teal-dim);border:1px solid var(--teal-mid);border-radius:4px;flex-shrink:0;">dividends</span>
            </div>`).join('')}`:''}
            ${nonDirectors.length>0?`<div style="font-size:.62rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:${directors.length>0?'10':'4'}px 0 6px;">Team Members</div>
            ${nonDirectors.map(m=>{
              const h=memberHoursTotal(m);const rate=effRate(m);const pay=h*rate;
              const propPay=totalNDHours>0?(h/totalNDHours)*Math.min(availFunds,totalNDPay):0;
              const isCapped=totalNDPay>availFunds&&h>0;
              return`<div style="display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--border2);min-width:0;">
                ${m.photoUrl?`<img src="${m.photoUrl}" style="width:28px;height:28px;border-radius:50%;object-fit:cover;flex-shrink:0;">`:`<div class="av" style="width:28px;height:28px;background:${m.color};font-size:.55rem;flex-shrink:0;">${m.initials}</div>`}
                <div style="flex:1;min-width:0;">
                  <div style="font-size:.82rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${m.name}</div>
                  <div style="font-size:.7rem;color:var(--muted);margin-top:1px;">${h.toFixed(1)}h × <span style="font-family:'DM Mono',monospace;">£${rate.toFixed(2)}/hr</span></div>

                  <div style="font-family:Inter,sans-serif;font-size:.85rem;font-weight:700;color:var(--acc);">${fmtGBP(pay)}</div>
                  ${isCapped?`<div style="font-size:.62rem;color:var(--yellow);">≈${fmtGBP(propPay)}</div>`:''}

            }).join('')}
            <div style="margin-top:10px;padding:10px 12px;background:var(--surface2);border-radius:8px;font-size:.73rem;">
              <div style="display:flex;justify-content:space-between;margin-bottom:4px;"><span style="color:var(--muted);">Team contracted total</span><span style="font-family:'DM Mono',monospace;">${fmtGBP(totalNDPay)}</span></div>
              <div style="display:flex;justify-content:space-between;margin-bottom:4px;"><span style="color:var(--muted);">Available funds${teamPayBudget>0?" (Team Pay budget)":""}</span><span style="font-family:'DM Mono',monospace;color:var(--acc);">${fmtGBP(availFunds)}</span></div>
              ${totalNDPay>availFunds?`<div style="display:flex;justify-content:space-between;padding-top:5px;border-top:1px solid var(--border);"><span style="color:var(--red);font-weight:600;">Shortfall — prop. split</span><span style="font-family:'DM Mono',monospace;color:var(--red);">${fmtGBP(totalNDPay-availFunds)}</span></div>`:`<div style="display:flex;justify-content:space-between;padding-top:5px;border-top:1px solid var(--border);"><span style="color:var(--green);">Surplus</span><span style="font-family:'DM Mono',monospace;color:var(--green);">${fmtGBP(availFunds-totalNDPay)}</span></div>`}
            </div>`:''}            `;
          })()}
        </div>
      </div>

      <!-- RIGHT: Dividend waterfall -->
      <div style="display:flex;flex-direction:column;gap:12px;">

        <!-- Summary bar -->
        <div class="card">
          <div class="card-hd"><span class="card-title">Dividend Pool</span><span style="font-family:'DM Mono',monospace;font-size:.78rem;color:var(--acc);">${fmtGBP(profitForPayout)}</span></div>
          <div class="card-bd">
            <div style="font-size:.72rem;color:var(--text2);margin-bottom:10px;">Profit after tax and savings available for distribution</div>
            <!-- Phase 1 progress -->
            <div style="margin-bottom:10px;">
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;">
                <span style="font-size:.68rem;font-weight:700;color:var(--acc);text-transform:uppercase;letter-spacing:.06em;">Phase 1 — A Share Threshold</span>
                <span style="font-family:'DM Mono',monospace;font-size:.7rem;color:${phase1Done?'var(--green)':'var(--yellow)'};">${phase1Done?'✓ Complete':fmtGBP(phase1Pool)+' / '+fmtGBP(THRESHOLD)}</span>
              </div>
              <div style="height:6px;background:var(--surface3);border-radius:99px;overflow:hidden;">
                <div style="height:100%;width:${phase1Pct}%;background:${phase1Done?'var(--green)':'var(--acc)'};border-radius:99px;transition:width .3s;"></div>
              </div>
              <div style="font-size:.67rem;color:var(--muted);margin-top:4px;">First £81,000 goes exclusively to A shareholders per Art. 3.1</div>
            </div>
            ${phase2Active?`<div style="display:flex;justify-content:space-between;align-items:center;padding:7px 10px;background:rgba(61,130,240,.08);border:1px solid rgba(61,130,240,.2);border-radius:7px;">
              <span style="font-size:.68rem;font-weight:700;color:#3d82f0;text-transform:uppercase;letter-spacing:.06em;">Phase 2 — All Shareholders</span>
              <span style="font-family:'DM Mono',monospace;font-size:.75rem;color:#3d82f0;">${fmtGBP(phase2Pool)}</span>
            </div>`:'<div style="font-size:.7rem;color:var(--muted);padding:7px 10px;background:var(--surface2);border-radius:7px;">Phase 2 (B share participation) begins above £81,000</div>'}
          </div>
        </div>

        <!-- A shareholders -->
        <div class="card">
          <div class="card-hd">
            <span class="card-title" style="display:flex;align-items:center;gap:7px;">
              <span style="width:8px;height:8px;border-radius:50%;background:var(--acc);flex-shrink:0;"></span>
              Ordinary A Shareholders
            </span>
          </div>
          <div class="card-bd">
            <div style="font-size:.68rem;color:var(--muted);margin-bottom:10px;">Phase 1: 42/20/38 weights · Phase 2: 32/15/28 weights</div>
            ${A_SHARES.map(s=>{
              const p1=phase1Pool*(s.w/aTotal);
              const abl=ALL_SHARES.find(x=>x.name===s.name);
              const p2=abl?phase2Pool*(abl.w/allTotal):0;
              const total=p1+p2;
              return`<div style="display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border2);">
                ${avBadge(s.name,'A')}
                <span style="flex:1;font-size:.84rem;font-weight:500;">${s.name}</span>
                <div style="text-align:right;">
                  ${phase2Active?`<div style="font-size:.65rem;color:var(--muted);">Ph1: ${fmtGBP(p1)} + Ph2: ${fmtGBP(p2)}</div>`:''}
                  <div style="font-family:Inter,sans-serif;font-size:.92rem;font-weight:700;color:var(--green);">${fmtGBP(total)}</div>
                </div>
              </div>`;
            }).join('')}
            <div style="display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--border);margin-top:2px;font-size:.72rem;color:var(--muted);">
              <span>A total</span>
              <span style="font-family:Inter,sans-serif;color:var(--green);font-weight:600;">${fmtGBP(A_SHARES.reduce((s,x)=>{const p1=phase1Pool*(x.w/aTotal);const abl=ALL_SHARES.find(a=>a.name===x.name);const p2=abl?phase2Pool*(abl.w/allTotal):0;return s+p1+p2;},0))}</span>
            </div>
          </div>
        </div>

        <!-- B shareholders -->
        <div class="card" style="opacity:${phase2Active?1:.55};">
          <div class="card-hd">
            <span class="card-title" style="display:flex;align-items:center;gap:7px;">
              <span style="width:8px;height:8px;border-radius:50%;background:#3d82f0;flex-shrink:0;"></span>
              Ordinary B Shareholders
            </span>
            ${!phase2Active?`<span style="font-size:.65rem;color:var(--muted);padding:2px 7px;background:var(--surface2);border-radius:4px;">Threshold not yet reached</span>`:''}
          </div>
          <div class="card-bd">
            <div style="font-size:.68rem;color:var(--muted);margin-bottom:10px;">Phase 2 only · 25% weight · participates above £81,000 threshold</div>
            ${ALL_SHARES.filter(s=>s.type==='B').map(s=>{
              const total=phase2Pool*(s.w/allTotal);
              return`<div style="display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border2);">
                ${avBadge(s.name,'B')}
                <span style="flex:1;font-size:.84rem;font-weight:500;">${s.name}</span>
                <div style="text-align:right;">
                  ${phase2Active?`<div style="font-size:.65rem;color:var(--muted);">25% of ${fmtGBP(phase2Pool)}</div>`:''}
                  <div style="font-family:Inter,sans-serif;font-size:.92rem;font-weight:700;color:#3d82f0;">${fmtGBP(total)}</div>
                </div>
              </div>`;
            }).join('')}
          </div>
        </div>

        <!-- Total check -->
        <div style="display:flex;justify-content:space-between;align-items:center;background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:11px 14px;">
          <span style="font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-family:'DM Mono',monospace;">Total distributed</span>
          <span style="font-family:Inter,sans-serif;font-size:1rem;font-weight:700;color:var(--acc);">${fmtGBP(Object.values(dividends).reduce((a,b)=>a+b,0))}</span>
        </div>

      </div><!-- /right col -->
    </div>`;
  })()}
</div>

<div class="fin-view${tab==='budget'?' active':''}" id="fin-budget">
  ${(()=>{

    return`<div style="max-width:780px;">
    ${overBudgetCats.length>0?`<div style="background:rgba(224,96,96,.1);border:1px solid rgba(224,96,96,.25);border-radius:9px;padding:12px 16px;margin-bottom:16px;display:flex;align-items:center;gap:10px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--red)" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <div><div style="font-size:.82rem;font-weight:700;color:var(--red);">Over budget in ${overBudgetCats.length} category${overBudgetCats.length!==1?'s':''}</div>
      <div style="font-size:.72rem;color:var(--muted);">${overBudgetCats.join(' · ')}</div></div>
    </div>`:''}    <div class="fin-grid4" style="margin-bottom:14px;">
      <div class="fin-metric"><div class="flbl2">Total Budgeted</div><div class="fval blue">${fmtGBP(totalBudget)}</div></div>
      <div class="fin-metric"><div class="flbl2">Total Spent</div><div class="fval ${totalSpend>totalBudget?'red':'green'}">${fmtGBP(totalSpend)}</div></div>
      <div class="fin-metric"><div class="flbl2">Remaining</div><div class="fval ${totalBudget-totalSpend<0?'red':'green'}">${fmtGBP(totalBudget-totalSpend)}</div></div>
      <div class="fin-metric"><div class="flbl2">Over Budget</div><div class="fval ${overBudgetCats.length>0?'red':'green'}">${overBudgetCats.length} ${overBudgetCats.length===1?'Category':'Categories'}</div></div>
    </div>
    <div class="card">
      <div class="card-hd"><span class="card-title">Category Budgets vs Actual Spend (annualised)</span></div>
      <div class="card-bd">
        <div style="display:grid;grid-template-columns:1fr auto auto;gap:0;padding-bottom:7px;border-bottom:1px solid var(--border);margin-bottom:4px;" class="budget-hdr">
          <div style="font-size:.6rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;">Category</div>
          <div style="font-size:.6rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;text-align:right;padding-right:8px;min-width:90px;">Budget / yr</div>
          <div style="font-size:.6rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;text-align:right;min-width:70px;">Actual</div>
        </div>
        ${allCats.map(cat=>{
          const budget=parseFloat(budgets[cat])||0;
          const spend=catSpend[cat]||0;
          const rem=budget-spend;
          const over=budget>0&&spend>budget;
          const pct=budget>0?Math.min(100,Math.round(spend/budget*100)):0;
          const catColor=(FIN_CATS[cat]||{c:'#888'}).c;
          return`<div style="padding:8px 0;border-bottom:1px solid rgba(255,255,255,.04);">
            <div style="display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:4px;margin-bottom:${budget>0?'5':'0'}px;">

                ${over?`<span style="font-size:.58rem;color:var(--red);background:rgba(224,96,96,.12);padding:1px 5px;border-radius:3px;font-weight:700;flex-shrink:0;">OVER</span>`:''}
              </div>
              <div style="text-align:right;padding-right:6px;min-width:90px;">

              <div style="font-size:.65rem;color:${rem<0?'var(--red)':'var(--green)'};font-family:'DM Mono',monospace;">${rem<0?'Over by '+fmtGBP(Math.abs(rem)):'Remaining: '+fmtGBP(rem)}</div>
              <div style="font-size:.62rem;color:var(--muted);">${pct}%</div>

            <div style="height:4px;background:var(--surface3);border-radius:99px;overflow:hidden;"><div style="height:100%;width:${pct}%;background:${over?'var(--red)':catColor};border-radius:99px;transition:width .3s;"></div></div>`:''}

</div>

</div>`;}

function renderAssetsPage(){
  if(!S.finance.assets)S.finance.assets=[];
  var assets=S.finance.assets;
  var TYPES=['Equipment','Software License','Intellectual Property','Domain / URL','Brand Asset','Physical','Other'];
  var STATUSES=['Active','Paused','Deprecated','Sold'];
  var SC={Active:'var(--green)',Paused:'var(--yellow)',Deprecated:'var(--muted)',Sold:'var(--red)'};
  var SB={Active:'rgba(31,186,122,.12)',Paused:'rgba(240,201,107,.12)',Deprecated:'rgba(90,90,90,.15)',Sold:'rgba(224,96,96,.12)'};
  var tab='assets';

  var totalVal=0;
  for(var i=0;i<assets.length;i++){if(assets[i].status!=='Sold')totalVal+=parseFloat(assets[i].value)||0;}
  var nActive=0,nPaused=0,nSold=0;
  for(var i=0;i<assets.length;i++){
    if(assets[i].status==='Active')nActive++;
    else if(assets[i].status==='Paused')nPaused++;
    else if(assets[i].status==='Sold')nSold++;
  }
  var grouped={};
  for(var i=0;i<TYPES.length;i++)grouped[TYPES[i]]=[];
  for(var i=0;i<assets.length;i++){var t=assets[i].type||'Other';if(!grouped[t])grouped[t]=[];grouped[t].push(assets[i]);}

  var h='';
  // Page header
  h+='<div class="fu"><div class="page-hd"><div class="page-title">Finances <em>/ Assets</em></div></div>';

  // Sub nav (same as other finance tabs)
  h+='<div class="fin-sub-nav">';
  var tabs=['overview','recurring','oneoff','categories','tax','projects','savings','payout','budget','assets'];
  var tabLabels={oneoff:'One-off',payout:'Team Payout',savings:'Savings',budget:'Budgets',assets:'Assets'};
  for(var i=0;i<tabs.length;i++){
    var t=tabs[i];
    var lbl=tabLabels[t]||(t.charAt(0).toUpperCase()+t.slice(1));
    var active=t===tab?' active':'';
    h+='<button class="fin-tab'+active+'" onclick="S.finance.finTab=\''+t+'\';save();render()">'+lbl+'</button>';
  }
  h+='</div>';

const _assetStatusOrder=['Active','Paused','Deprecated','Sold'];
function assetPickType(el){
  document.querySelectorAll('#asset-type-pills .pill-opt').forEach(function(p){p.classList.remove('active');p.style.background='';p.style.borderColor='';p.style.color='';});
  el.classList.add('active');el.style.background='var(--teal-dim)';el.style.borderColor='var(--acc)';el.style.color='var(--acc)';
  var inp=document.getElementById('asset-type');if(inp)inp.value=el.dataset.val;
}
function assetPickStatus(el,val){
  var SC={Active:'var(--green)',Paused:'var(--yellow)',Deprecated:'var(--muted)',Sold:'var(--red)'};
  var SB={Active:'rgba(31,186,122,.12)',Paused:'rgba(240,201,107,.12)',Deprecated:'rgba(90,90,90,.15)',Sold:'rgba(224,96,96,.12)'};
  document.querySelectorAll('#asset-status-pills .pill-opt').forEach(function(p){p.classList.remove('active');p.style.background='';p.style.borderColor='';p.style.color='';});
  el.classList.add('active');el.style.background=SB[val]||SB.Active;el.style.borderColor=SC[val]||SC.Active;el.style.color=SC[val]||SC.Active;
  var inp=document.getElementById('asset-status');if(inp)inp.value=val;
}
function addAsset(){
  var name=document.getElementById('asset-name')?.value.trim();if(!name)return;
  var value=parseFloat(document.getElementById('asset-value')?.value)||0;
  var type=document.getElementById('asset-type')?.value||'Other';
  var status=document.getElementById('asset-status')?.value||'Active';
  var acquired=document.getElementById('asset-acquired')?.value||'';
  var notes=document.getElementById('asset-notes')?.value.trim()||'';
  if(!S.finance.assets)S.finance.assets=[];
  S.finance.assets.push({id:uid(),name:name,value:value,type:type,status:status,acquired:acquired,notes:notes});
  save();render();
}
function deleteAsset(id){
  S.finance.assets=(S.finance.assets||[]).filter(function(a){return a.id!==id;});
  save();render();
}
function cycleAssetStatus(id){
  var a=(S.finance.assets||[]).find(function(x){return x.id===id;});if(!a)return;
  var idx=_assetStatusOrder.indexOf(a.status||'Active');
  a.status=_assetStatusOrder[(idx+1)%_assetStatusOrder.length];
  save();render();
}

function generateFinanceReport(){
  // ── Compute all figures ──
  const sv=S.finance.savings||{rate:20};
  const rec=totalRec(),oo=totalOO(),projE=projExpTotal(),allE=rec+oo+projE;
  const rev=S.finance.revenue||0;
  const profit=rev-allE;
  const ct=corpTax(Math.max(0,profit));
  const net=profit-ct.tax;
  const savAmt=Math.max(0,net)*(sv.rate/100);
  const pfp=Math.max(0,net)-savAmt;
  const globalRate=parseFloat(S.finance.globalRate)||0;
  const effR=m=>globalRate>0?globalRate:(parseFloat((S.finance.teamRates||{})[m.id])||0);
  const THRESHOLD=81000;
  const A_SHARES=[{name:'Greg Lester',w:42},{name:'Jonny Sands',w:20},{name:'Lewis Thompson',w:38}];
  const ALL_SHARES=[{name:'Greg Lester',w:32,type:'A'},{name:'Jonny Sands',w:15,type:'A'},{name:'Lewis Thompson',w:28,type:'A'},{name:'Asbjoern Andersen',w:25,type:'B'}];
  const aTotal=A_SHARES.reduce((s,x)=>s+x.w,0);
  const allTotal=ALL_SHARES.reduce((s,x)=>s+x.w,0);
  const p1Pool=Math.min(pfp,THRESHOLD);
  const p2Pool=Math.max(0,pfp-THRESHOLD);
  const divs={};
  A_SHARES.forEach(s=>{divs[s.name]=(divs[s.name]||0)+p1Pool*(s.w/aTotal);});
  ALL_SHARES.forEach(s=>{divs[s.name]=(divs[s.name]||0)+p2Pool*(s.w/allTotal);});
  const budgets=S.finance.budgets||{};
  const catItems=[...S.finance.recurring,...S.finance.oneoff.map(e=>({...e,freq:'One-off'}))];
  const catSpend={};
  catItems.forEach(e=>{const v=e.freq==='One-off'?e.amount:finAnn(e);catSpend[e.cat]=(catSpend[e.cat]||0)+v;});
  const allCats=Object.keys(FIN_CATS);
  const brandName=S.settings?.brandName||'Airwiggles — ProjectFlow';

  // ── SVG helpers ──
  function bar(val,max,color,w=180,h=10){
    const pct=max>0?Math.min(100,val/max*100):0;

  }
  function donut(slices,r=60){
    let total=slices.reduce((a,s)=>a+s.v,0);if(total===0)return'';
    const cx=r+10,cy=r+10,sw=r*.45;let angle=-Math.PI/2;
    let paths='';
    slices.forEach(s=>{
      if(s.v<=0)return;
      const a=s.v/total*Math.PI*2;
      const x1=cx+r*Math.cos(angle),y1=cy+r*Math.sin(angle);
      const x2=cx+r*Math.cos(angle+a),y2=cy+r*Math.sin(angle+a);
      const large=a>Math.PI?1:0;
      paths+=`<path d="M${cx},${cy} L${x1},${y1} A${r},${r} 0 ${large},1 ${x2},${y2} Z" fill="${s.c}" opacity="0.9"/>`;
      angle+=a;
    });
    const dim=(r+10)*2;
    return`<svg width="${dim}" height="${dim}" viewBox="0 0 ${dim} ${dim}"><circle cx="${cx}" cy="${cy}" r="${r}" fill="#1a1a1a"/>${paths}<circle cx="${cx}" cy="${cy}" r="${r-sw}" fill="#111"/></svg>`;

        <tr class="tr-total"><td>Gross Profit</td><td class="right ${profit>=0?'green':'red'}">${fmtS(profit)}</td><td>${bar(Math.abs(profit),rev,profit>=0?'#62D0AA':'#e05c3a')}</td></tr>
        <tr><td class="muted">Corporation Tax (${ct.label})</td><td class="right amber">- ${fmtGBP(ct.tax)}</td><td>${bar(ct.tax,rev,'#f59e0b')}</td></tr>
        <tr class="tr-total"><td>Net Profit</td><td class="right ${net>=0?'green':'red'}">${fmtS(net)}</td><td>${bar(Math.abs(net),rev,net>=0?'#62D0AA':'#e05c3a')}</td></tr>
        <tr><td class="muted">Savings Reserve (${sv.rate}%)</td><td class="right blue">- ${fmtGBP(savAmt)}</td><td>${bar(savAmt,rev,'#3d82f0')}</td></tr>
        <tr class="tr-total"><td style="color:#62D0AA;">Profit for Payout</td><td class="right green">${fmtGBP(pfp)}</td><td>${bar(pfp,rev,'#62D0AA')}</td></tr>
      </table>
    </div>
  </div>`;

  // ── P3: Expenses detail + Category breakdown ──
  const catSlices=allCats.filter(k=>catSpend[k]>0).map(k=>({c:(FIN_CATS[k]||{c:'#888'}).c,v:catSpend[k],k}));
  const catPage=`<div class="page">
    <h2>3 — Expense Categories</h2>
    <div class="grid2" style="align-items:start;">
      <div>
        ${donut(catSlices,70)}
        <div style="margin-top:12px;">
          ${catSlices.sort((a,b)=>b.v-a.v).map(s=>`<div class="flex" style="margin-bottom:5px;">
            <span class="dot" style="background:${s.c};"></span>
            <span style="flex:1;font-size:.75rem;">${s.k}</span>
            <span style="font-family:'Courier New',monospace;font-size:.75rem;">${fmtGBP(s.v)}</span>
          </div>`).join('')}
        </div>
      </div>
      <div>
        <table>
          <tr><th>Category</th><th class="right">Spend</th><th class="right">Budget</th><th class="right">Status</th></tr>
          ${allCats.map(k=>{
            const sp=catSpend[k]||0;const bg=parseFloat(budgets[k])||0;const over=bg>0&&sp>bg;
            return sp>0||bg>0?`<tr>
              <td><span class="dot" style="background:${(FIN_CATS[k]||{c:'#888'}).c};"></span>${k}</td>
              <td class="right">${sp>0?fmtGBP(sp):'—'}</td>
              <td class="right muted">${bg>0?fmtGBP(bg):'—'}</td>
              <td class="right"><span class="pill ${over?'pill-b':'pill-a'}">${over?'OVER':'OK'}</span></td>
            </tr>`:'';
          }).join('')}
        </table>
      </div>
    </div>
    <h2>4 — Recurring Expenses</h2>
    <div class="card"><table>
      <tr><th>Name</th><th>Category</th><th>Frequency</th><th class="right">Amount</th><th class="right">Annualised</th></tr>
      ${S.finance.recurring.length===0?'<tr><td colspan="5" class="muted">No recurring expenses</td></tr>':
        S.finance.recurring.map(e=>`<tr>
          <td>${e.name}</td><td class="muted">${e.cat}</td><td class="muted">${e.freq}</td>
          <td class="right">${fmtGBP(e.amount)}</td><td class="right">${fmtGBP(finAnn(e))}</td>
        </tr>`).join('')}
      ${S.finance.recurring.length>0?`<tr class="tr-total"><td colspan="4">Total annualised</td><td class="right green">${fmtGBP(rec)}</td></tr>`:''}
    </table></div>
    <h2>5 — One-off Expenses</h2>
    <div class="card"><table>
      <tr><th>Name</th><th>Category</th><th class="right">Amount</th></tr>
      ${S.finance.oneoff.length===0?'<tr><td colspan="3" class="muted">No one-off expenses</td></tr>':
        S.finance.oneoff.map(e=>`<tr><td>${e.name}</td><td class="muted">${e.cat}</td><td class="right">${fmtGBP(e.amount)}</td></tr>`).join('')}
      ${S.finance.oneoff.length>0?`<tr class="tr-total"><td colspan="2">Total</td><td class="right green">${fmtGBP(oo)}</td></tr>`:''}
    </table></div>
  </div>`;

  // ── P4: Tax + Team payout ──
  const dirs=S.members.filter(m=>m.isDirector);
  const nondirs=S.members.filter(m=>!m.isDirector);
  const totalNDPay=nondirs.reduce((a,m)=>a+memberHoursTotal(m)*effR(m),0);
  const totalNDHours=nondirs.reduce((a,m)=>a+memberHoursTotal(m),0);
  const teamBudget=parseFloat(budgets['Team Pay'])||0;
  const availFunds=teamBudget>0?teamBudget:pfp;
  const taxPage=`<div class="page">
    <h2>6 — Corporation Tax</h2>
    <div class="grid3" style="margin-bottom:14px;">
      <div class="metric"><div class="metric-label">Taxable Profit</div><div class="metric-val">${fmtGBP(Math.max(0,profit))}</div></div>
      <div class="metric"><div class="metric-label">Rate Applied</div><div class="metric-val amber">${ct.rate}</div></div>
      <div class="metric"><div class="metric-label">Tax Due</div><div class="metric-val red">${fmtGBP(ct.tax)}</div></div>
    </div>
    <div class="card" style="font-size:.78rem;">
      <div class="flex" style="margin-bottom:6px;"><span style="flex:1;">Gross profit</span><span class="right" style="font-family:'Courier New',monospace;">${fmtS(profit)}</span></div>
      <div class="flex" style="margin-bottom:6px;"><span style="flex:1;">Tax rate (${ct.label})</span><span style="font-family:'Courier New',monospace;color:#f59e0b;">${ct.rate}</span></div>
      ${ct.mr>0?`<div class="flex" style="margin-bottom:6px;"><span style="flex:1;color:#666;">Marginal relief</span><span style="font-family:'Courier New',monospace;color:#62D0AA;">- ${fmtGBP(ct.mr)}</span></div>`:''}
      <div class="flex" style="font-weight:700;padding-top:8px;border-top:1px solid #2a2a2a;"><span style="flex:1;">Corporation tax due</span><span style="font-family:'Courier New',monospace;color:#e05c3a;">${fmtGBP(ct.tax)}</span></div>
      <div class="flex" style="font-weight:700;padding-top:8px;"><span style="flex:1;">Effective rate</span><span style="font-family:'Courier New',monospace;color:#f59e0b;">${ct.eff}</span></div>
    </div>
    <h2>7 — Team Member Payouts</h2>
    <p class="section-intro">Hourly rate: <strong style="color:#62D0AA;">${globalRate>0?'£'+globalRate.toFixed(2)+'/hr (global rate)':'Per-member rates'}</strong> · Available funds: <strong style="color:#62D0AA;">${fmtGBP(availFunds)}</strong>${teamBudget>0?' (Team Pay budget)':' (profit for payout)'}</p>
    ${dirs.length>0?`<h3>Directors (reference only — paid via dividends)</h3>
    <div class="card"><table>
      <tr><th>Name</th><th class="right">Hours</th><th class="right">Rate</th><th class="right">Equivalent</th></tr>
      ${dirs.map(m=>{const h=memberHoursTotal(m);const r=effR(m);return`<tr style="opacity:.65;">
        <td>${m.name}</td><td class="right muted">${h.toFixed(1)}h</td>
        <td class="right muted">${r>0?'£'+r.toFixed(2):'-'}</td>
        <td class="right muted">${r>0&&h>0?fmtGBP(h*r):'—'}</td>
      </tr>`;}).join('')}
    </table></div>`:''}
    ${nondirs.length>0?`<h3>Team Members</h3>
    <div class="card"><table>
      <tr><th>Name</th><th class="right">Hours</th><th class="right">Rate</th><th class="right">Contracted</th><th class="right">Proportional</th></tr>
      ${nondirs.map(m=>{
        const h=memberHoursTotal(m);const r=effR(m);const pay=h*r;
        const prop=totalNDHours>0?(h/totalNDHours)*Math.min(availFunds,totalNDPay):0;
        const capped=totalNDPay>availFunds;
        return`<tr>
          <td>${m.name}</td><td class="right">${h.toFixed(1)}h</td>
          <td class="right">${r>0?'£'+r.toFixed(2):'-'}</td>
          <td class="right">${fmtGBP(pay)}</td>
          <td class="right ${capped?'amber':'green'}">${capped?'≈'+fmtGBP(prop):fmtGBP(pay)}</td>
        </tr>`;}).join('')}
      <tr class="tr-total"><td colspan="3">Total</td><td class="right">${fmtGBP(totalNDPay)}</td>
        <td class="right ${totalNDPay>availFunds?'red':'green'}">${totalNDPay>availFunds?'Shortfall: '+fmtGBP(totalNDPay-availFunds):'Surplus: '+fmtGBP(availFunds-totalNDPay)}</td></tr>
    </table></div>`:''}
  </div>`;

  // ── P5: Dividend waterfall ──
  const p1pct=pfp>0?Math.min(100,(p1Pool/THRESHOLD)*100):0;
  const divPage=`<div class="page">
    <h2>8 — Dividend Waterfall</h2>
    <p class="section-intro">Per Articles of Association (Art. 3.1) — B shares (Asbjoern Andersen) only entitled after the first £81,000 is distributed to A shareholders.</p>
    <div class="grid2" style="margin-bottom:14px;align-items:start;">
      <div>
        <div class="phase-hd">Phase 1 — A Shareholders only (first £81,000)</div>
        <div class="card">
          <div style="display:flex;justify-content:space-between;font-size:.72rem;margin-bottom:8px;">
            <span class="muted">Pool: ${fmtGBP(p1Pool)}</span>
            <span style="color:${p1pct>=100?'#62D0AA':'#f59e0b'};">${Math.round(p1pct)}% of threshold</span>
          </div>
          <div style="background:#2a2a2a;border-radius:99px;height:6px;margin-bottom:12px;overflow:hidden;">
            <div style="width:${Math.round(p1pct)}%;height:100%;background:${p1pct>=100?'#62D0AA':'#f59e0b'};border-radius:99px;"></div>
          </div>
          <table>
            <tr><th>Shareholder</th><th class="right">Share %</th><th class="right">Amount</th></tr>
            ${A_SHARES.map(s=>`<tr><td>${s.name} <span class="pill pill-a">A</span></td><td class="right">${(s.w/aTotal*100).toFixed(0)}%</td><td class="right green">${fmtGBP(p1Pool*(s.w/aTotal))}</td></tr>`).join('')}
          </table>
        </div>
      </div>
      <div>
        <div class="phase-hd">Phase 2 — All Shareholders (above £81,000)</div>
        <div class="card">
          <div style="font-size:.72rem;margin-bottom:12px;color:${p2Pool>0?'#62D0AA':'#555'};">
            ${p2Pool>0?`Pool: ${fmtGBP(p2Pool)}`:'Not yet reached — profit below £81,000 threshold'}
          </div>
          <table>
            <tr><th>Shareholder</th><th class="right">Share %</th><th class="right">Amount</th></tr>
            ${ALL_SHARES.map(s=>`<tr>
              <td>${s.name} <span class="pill ${s.type==='A'?'pill-a':'pill-b'}">${s.type}</span></td>
              <td class="right">${(s.w/allTotal*100).toFixed(0)}%</td>
              <td class="right ${p2Pool>0?'green':'muted'}">${p2Pool>0?fmtGBP(p2Pool*(s.w/allTotal)):'—'}</td>
            </tr>`).join('')}
          </table>
        </div>
      </div>
    </div>
    <h2>9 — Total Dividends Payable</h2>
    <div class="card"><table>
      <tr><th>Shareholder</th><th>Share Class</th><th class="right">Phase 1</th><th class="right">Phase 2</th><th class="right">Total</th></tr>
      ${ALL_SHARES.map(s=>{
        const p1=A_SHARES.find(x=>x.name===s.name)?p1Pool*(A_SHARES.find(x=>x.name===s.name).w/aTotal):0;
        const p2=p2Pool*(s.w/allTotal);
        return`<tr><td>${s.name}</td><td><span class="pill ${s.type==='A'?'pill-a':'pill-b'}">${s.type}</span></td>
          <td class="right">${p1>0?fmtGBP(p1):'—'}</td><td class="right">${p2>0?fmtGBP(p2):'—'}</td>
          <td class="right green">${fmtGBP(p1+p2)}</td></tr>`;}).join('')}
      <tr class="tr-total"><td colspan="4">Total dividends</td><td class="right green">${fmtGBP(Object.values(divs).reduce((a,b)=>a+b,0))}</td></tr>
    </table></div>
    <div class="footer">Airwiggles Ltd · Finance Report · Generated ${today} · Confidential</div>
  </div>`;

  // ── Assemble & open ──
  const html=`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Airwiggles Finance Report — ${today}</title><style>${css}</style></head><body>${cover}${summary}${catPage}${taxPage}${divPage}</body></html>`;
  const blob=new Blob([html],{type:'text/html'});
  const url=URL.createObjectURL(blob);
  const w=window.open(url,'_blank');
  if(!w){
    // Popup blocked — fall back to download
    const a=document.createElement('a');
    a.href=url;
    a.download='airwiggles-finance-report-'+new Date().toISOString().slice(0,10)+'.html';
    a.click();
    setTimeout(()=>URL.revokeObjectURL(url),5000);
  }
}
function lockFinance(){S.finance.finAuth=false;save();nav('finance');}

function reCalcFin(){const c=el('content');if(c&&V==='finance'){c.innerHTML=renderFinance();setTimeout(()=>renderFinCharts(),80);}}

function renderFinCharts(){
  const rev=S.finance.revenue||0,rec=totalRec(),oo=totalOO(),proj=projExpTotal(),allExp=rec+oo+proj;
  const profit=rev-allExp,ct=corpTax(Math.max(0,profit)),net=profit-ct.tax;
  const tab=S.finance.finTab||'overview';

  // Waterfall
  const wf=[{l:'Revenue',v:rev,c:'#1fba7a',b:false},{l:'Recurring',v:-rec,c:'#e06060',b:false},{l:'One-off',v:-oo,c:'#f0a500',b:false},{l:'Project Exp',v:-proj,c:'#f59e0b',b:false},{l:'Pre-tax profit',v:profit,c:profit>=0?'#3d82f0':'#e06060',b:true},{l:'Corp tax',v:-ct.tax,c:'#8b5cf6',b:false},{l:'Net profit',v:net,c:net>=0?'#1fba7a':'#e06060',b:true}];
  const wm=Math.max(...wf.map(d=>Math.abs(d.v)),1);
  const wfEl=el('fin-waterfall');
  if(wfEl)wfEl.innerHTML=wf.map(d=>`<div class="wf-row"><div class="wf-lbl${d.b?' bold':''}">${d.l}</div><div class="wf-track"><div class="wf-fill" style="width:${Math.round(Math.abs(d.v)/wm*100)}%;background:${d.c}"></div></div><div class="wf-val" style="color:${d.c}">${d.v<0?'-':''}${fmtGBP(d.v)}</div></div>`).join('');

  // Category breakdowns
  const allItems=[...S.finance.recurring,...S.finance.oneoff.map(e=>({...e,freq:'One-off'}))];
  const catTotals={};allItems.forEach(e=>{const v=e.freq==='One-off'?e.amount:finAnn(e);catTotals[e.cat]=(catTotals[e.cat]||0)+v;});
  const catKeys=Object.keys(catTotals),catVals=catKeys.map(k=>catTotals[k]),catColors=catKeys.map(k=>(FIN_CATS[k]||{c:'#888'}).c);

  if(tab==='overview'||tab==='categories'){
    mkDonut('fin-donut-main',['Recurring','One-off','Project Exp','Net profit','Corp tax'],[rec,oo,proj,Math.max(0,net),ct.tax],['#e06060','#f0a500','#f59e0b','#1fba7a','#8b5cf6'],'fin-leg-main');
    mkDonut('fin-donut-cat',catKeys,catVals,catColors,'fin-leg-cat');
    mkDonut('fin-donut-cat-ov',catKeys,catVals,catColors,'fin-leg-cat-ov');
    const recCat={};S.finance.recurring.forEach(e=>{recCat[e.cat]=(recCat[e.cat]||0)+finAnn(e);});
    mkDonut('fin-donut-rec',Object.keys(recCat),Object.values(recCat),Object.keys(recCat).map(k=>(FIN_CATS[k]||{c:'#888'}).c));
    const ooCat={};S.finance.oneoff.forEach(e=>{ooCat[e.cat]=(ooCat[e.cat]||0)+e.amount;});
    mkDonut('fin-donut-oo',Object.keys(ooCat),Object.values(ooCat),Object.keys(ooCat).map(k=>(FIN_CATS[k]||{c:'#888'}).c));
  }
  if(tab==='tax'){
    const txData=[{l:'Taxable profit',v:fmtS(profit)},{l:'Rate',v:ct.label+' — '+ct.rate},{l:'Gross tax',v:fmtGBP(ct.gross)},{l:'Marginal relief',v:ct.mr>0?'-'+fmtGBP(ct.mr):'£0.00'},{l:'Tax due',v:`<span style="color:var(--yellow);font-weight:600;">${fmtGBP(ct.tax)}</span>`},{l:'Effective rate',v:`<span style="color:var(--yellow);font-weight:600;">${ct.eff}</span>`}];
    const txEl=el('fin-tax-rows');if(txEl)txEl.innerHTML=txData.map(d=>`<div class="tax-row"><span class="tax-lbl">${d.l}</span><span class="tax-val">${d.v}</span></div>`).join('');
    const bands=[{l:'Small profits ≤ £50k',th:50000,c:'#1fba7a'},{l:'Marginal £50k–£250k',th:250000,c:'#f0a500'},{l:'Main rate > £250k',th:500000,c:'#e06060'}];
    const bbEl=el('fin-band-bars');if(bbEl)bbEl.innerHTML=bands.map(b=>{const w=Math.min(100,Math.round(profit/b.th*100));const here=(b.th===50000&&profit<=50000)||(b.th===250000&&profit>50000&&profit<=250000)||(b.th===500000&&profit>250000);return`<div class="band-row"><div class="band-lbl"><span style="color:${here?b.c:'var(--muted)'};font-weight:${here?600:400};">${b.l}${here?' ◀':''}</span></div><div class="prog-bg"><div class="prog-fill-f" style="width:${w}%;background:${b.c}"></div></div></div>`}).join('');
    mkDonut('fin-donut-tax',['Net profit','Corp tax'],[Math.max(0,net),ct.tax],['#1fba7a','#8b5cf6']);
  }
  if(tab==='recurring'){renderFinRecurring();}
  if(tab==='oneoff'){renderFinOneoff();}
}

function var_css(name){return getComputedStyle(document.documentElement).getPropertyValue(name).trim()||'#e06060';}

function mkDonut(canvasId,labels,data,colors,legId=null){
  if(charts[canvasId])charts[canvasId].destroy();
  const cv=el(canvasId);if(!cv)return;
  charts[canvasId]=new Chart(cv,{type:'doughnut',data:{labels,datasets:[{data,backgroundColor:colors,borderWidth:2,borderColor:'#1c1c1c',hoverOffset:4}]},options:{responsive:true,maintainAspectRatio:false,cutout:'65%',plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>{const t=data.reduce((a,b)=>a+b,0);return` ${fmtGBP(ctx.raw)} (${(ctx.raw/t*100).toFixed(1)}%)`}}}}}});
  if(legId){const le=el(legId);if(le){const tot=data.reduce((a,b)=>a+b,0);le.innerHTML=labels.map((l,i)=>`<span class="leg-item"><span class="leg-dot" style="background:${colors[i]}"></span>${l}<span class="leg-pct">${(data[i]/tot*100).toFixed(1)}%</span></span>`).join('');}}
}

function renderFinRecurring(){
  const rl=el('fin-rec-list');if(!rl)return;
  const freqs=['Monthly','Quarterly','Annual'];
  rl.innerHTML=freqs.map(freq=>{
    const items=S.finance.recurring.filter(e=>e.freq===freq);if(!items.length)return'';
    const sub=items.reduce((a,e)=>a+finAnn(e),0);
    return`<div class="freq-grp"><div class="freq-hd"><span style="font-size:.65rem;font-family:'DM Mono',monospace;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);">${freq} ×${FIN_MULT[freq]}</span><span style="font-family:'DM Mono',monospace;font-size:.72rem;color:var(--acc);">${fmtGBP(sub)}/yr</span></div>
${items.map(e=>`<div class="exp-row">
<input style="flex:1;min-width:100px;background:none;border:none;color:var(--text);font-size:.8rem;outline:none;" value="${e.name}" oninput="updFinField('r','${e.id}','name',this.value)">
<select class="amt-inp cat-sel" onchange="updFinField('r','${e.id}','cat',this.value)">${FIN_CAT_NAMES.map(cn=>`<option value="${cn}"${e.cat===cn?' selected':''}>${cn}</option>`).join('')}</select>
<select class="amt-inp freq-sel" onchange="updFinField('r','${e.id}','freq',this.value)">${['Monthly','Quarterly','Annual'].map(f=>`<option${e.freq===f?' selected':''}>${f}</option>`).join('')}</select>
<input class="amt-inp amt-num" type="number" value="${e.amount.toFixed(2)}" step="0.01" min="0" oninput="updFinAmt('r','${e.id}',this.value)">
<button class="del-btn" onclick="delFin('r','${e.id}')">×</button>
</div>`).join('')}</div>`;
  }).join('');
}

function renderFinOneoff(){
  const ol=el('fin-oo-list');if(!ol)return;
  ol.innerHTML=S.finance.oneoff.map(e=>`<div class="exp-row">
<input style="flex:1;min-width:100px;background:none;border:none;color:var(--text);font-size:.8rem;outline:none;" value="${e.name}" oninput="updFinField('o','${e.id}','name',this.value)">
<select class="amt-inp cat-sel" onchange="updFinField('o','${e.id}','cat',this.value)">${FIN_CAT_NAMES.map(cn=>`<option value="${cn}"${e.cat===cn?' selected':''}>${cn}</option>`).join('')}</select>
<input class="amt-inp amt-num" type="number" value="${e.amount.toFixed(2)}" step="0.01" min="0" oninput="updFinAmt('o','${e.id}',this.value)">
<button class="del-btn" onclick="delFin('o','${e.id}')">×</button>
</div>`).join('');
}

function updFinField(t,id,f,v){const list=t==='r'?S.finance.recurring:S.finance.oneoff;const e=list.find(x=>x.id===id);if(e){e[f]=v;save();}}
function updFinAmt(t,id,v){const list=t==='r'?S.finance.recurring:S.finance.oneoff;const e=list.find(x=>x.id===id);if(e){e.amount=parseFloat(v)||0;save();}}
function delFin(t,id){if(t==='r')S.finance.recurring=S.finance.recurring.filter(x=>x.id!==id);else S.finance.oneoff=S.finance.oneoff.filter(x=>x.id!==id);save();reCalcFin();}
function addFinRec(){S.finance.recurring.push({id:'r'+uid(),name:'New expense',to:'',freq:'Monthly',amount:0,cat:'IT Infrastructure'});save();reCalcFin();}
function addFinOO(){S.finance.oneoff.push({id:'o'+uid(),name:'New expense',to:'',amount:0,cat:'IT Infrastructure'});save();reCalcFin();}

/* ════ SETTINGS ════ */
function renderSettings(){
  const nv=S.settings.navVisible||{};

function addDevTodo(){
  const inp=el('dev-todo-inp');
  const text=inp?.value.trim();
  if(!text)return;
  if(!S.settings.devTodos)S.settings.devTodos=[];
  S.settings.devTodos.push({id:uid(),text,done:false,date:new Date().toLocaleDateString('en-GB')});
  inp.value='';
  save();render();
  // Re-scroll to the dev todo section
  setTimeout(()=>document.getElementById('dev-todo-list')?.scrollIntoView({behavior:'smooth',block:'nearest'}),100);
}
function toggleDevTodo(id,done){
  if(!S.settings.devTodos)return;
  const t=S.settings.devTodos.find(x=>x.id===id);
  if(t){t.done=done;save();render();}
}
function deleteDevTodo(id){
  if(!S.settings.devTodos)return;
  S.settings.devTodos=S.settings.devTodos.filter(x=>x.id!==id);
  save();render();
}

function uploadLogo(input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{S.settings.logoUrl=e.target.result;save();applyBranding();updateFavicon();render();};
  reader.readAsDataURL(file);
}

function setAccent(color,dot){
  document.getElementById('st-colors')?.querySelectorAll('.clr-dot').forEach(d=>d.classList.remove('sel'));
  dot.classList.add('sel');
  S.settings.accentColor=color;save();applyBranding();
}

      rli.style.background='var(--acc)';

      rli.style.transform='rotate(45deg)';
      rli.style.borderRadius='7px';
      rli.style.width='';
      rli.style.height='';

      rli.style.justifyContent='center';
      rli.innerHTML=`<img src="${S.settings.logoUrl}" style="width:40px;height:40px;object-fit:cover;transform:rotate(-45deg);">`;

function saveSlack(){S.slackWebhook=el('slack-inp')?.value.trim()||'';save();const st=el('slack-st');if(st){st.textContent='✓ Saved';st.style.color='var(--green)';setTimeout(()=>{if(el('slack-st'))el('slack-st').textContent='';},2000);}}
async function testSlack(){const url=el('slack-inp')?.value.trim();if(!url){const st=el('slack-st');if(st){st.textContent='Enter URL first';st.style.color='var(--red)';}return;}try{await sendSlack(url,{text:'✅ *ProjectFlow* — Connected!'});const st=el('slack-st');if(st){st.textContent='✓ Check Slack';st.style.color='var(--green)';}}catch{const st=el('slack-st');if(st){st.textContent='Failed';st.style.color='var(--red)';}}}

/* ── Project modal range date picker ── */
let _pmRangeState={picking:'start'};
function pmOpenRangeCal(){
  const wrap=el('pm-range-wrap');if(!wrap)return;
  const existing=wrap.querySelector('.cal');
  if(existing){existing.remove();return;}
  document.querySelectorAll('.cal').forEach(c=>c.remove());
  const now=new Date();
  if(!window._pmRangeCal)window._pmRangeCal={y:now.getFullYear(),m:now.getMonth()};
  const sv=el('pm-s-v')?.value;
  if(sv){const d=new Date(sv);window._pmRangeCal={y:d.getFullYear(),m:d.getMonth()};}
  const pop=document.createElement('div');
  pop.className='cal';
  pop.style.cssText='position:absolute;top:calc(100% + 4px);left:0;z-index:700;width:220px;';
  pop.addEventListener('click',e=>e.stopPropagation());
  pop.innerHTML=_buildPmRangeCal(window._pmRangeCal.y,window._pmRangeCal.m);
  wrap.appendChild(pop);
}
function _buildPmRangeCal(y,m){
  const mn=['January','February','March','April','May','June','July','August','September','October','November','December'][m];
  const fd=new Date(y,m,1).getDay();const dm=new Date(y,m+1,0).getDate();
  const tod=toISO(new Date());const sv=el('pm-s-v')?.value||'';const ev=el('pm-e-v')?.value||'';
  let cells=['M','T','W','T','F','S','S'].map(d=>`<div class="cal-dow">${d}</div>`).join('');
  const off=(fd+6)%7;
  for(let i=0;i<off;i++)cells+=`<div class="cal-d empty"></div>`;
  for(let d=1;d<=dm;d++){
    const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    let cls='cal-d';
    if(ds===tod)cls+=' today';
    if(sv&&ds===sv)cls+=' range-start';
    else if(ev&&ds===ev)cls+=' range-end';
    else if(sv&&ev&&ds>sv&&ds<ev)cls+=' in-range';
    cells+=`<button class="${cls}" onclick="pmRangePickDay('${ds}')">${d}</button>`;
  }
  const hint=sv&&ev?`${fmtD(sv)} → ${fmtD(ev)}`:sv?`Start: ${fmtD(sv)} — now pick end`:'Click to set start date';
  return`<div class="cal-nav">
    <button class="cal-nb" onclick="event.stopPropagation();window._pmRangeCal.m--;if(window._pmRangeCal.m<0){window._pmRangeCal.m=11;window._pmRangeCal.y--;}el('pm-range-wrap').querySelector('.cal').innerHTML=_buildPmRangeCal(window._pmRangeCal.y,window._pmRangeCal.m)">‹</button>
    <span class="cal-mo">${mn} ${y}</span>
    <button class="cal-nb" onclick="event.stopPropagation();window._pmRangeCal.m++;if(window._pmRangeCal.m>11){window._pmRangeCal.m=0;window._pmRangeCal.y++;}el('pm-range-wrap').querySelector('.cal').innerHTML=_buildPmRangeCal(window._pmRangeCal.y,window._pmRangeCal.m)">›</button>
  </div>
  <div class="cal-grid">${cells}</div>
  <div class="cal-hint">${hint}</div>
  <div class="cal-ft">
    <button class="btn btn-ghost btn-xs" onclick="event.stopPropagation();pmClearRange()">Clear</button>
    <button class="btn btn-ghost btn-xs" onclick="event.stopPropagation();el('pm-range-wrap').querySelector('.cal')?.remove()">Done</button>
  </div>`;
}
function pmRangePickDay(ds){
  const sv=el('pm-s-v')?.value||'';const ev=el('pm-e-v')?.value||'';
  if(!sv||_pmRangeState.picking==='start'||(sv&&ev)){
    if(el('pm-s-v'))el('pm-s-v').value=ds;
    if(el('pm-e-v'))el('pm-e-v').value='';
    _pmRangeState.picking='end';
  } else {
    if(ds<sv){if(el('pm-e-v'))el('pm-e-v').value=sv;if(el('pm-s-v'))el('pm-s-v').value=ds;}
    else{if(el('pm-e-v'))el('pm-e-v').value=ds;}
    _pmRangeState.picking='start';
  }
  const newSv=el('pm-s-v')?.value||'';const newEv=el('pm-e-v')?.value||'';
  const lbl=el('pm-range-label');
  if(lbl){lbl.innerHTML=newSv||newEv?`${newSv?fmtD(newSv):'—'} → ${newEv?fmtD(newEv):'—'}`:'<span style="color:var(--muted);">Set dates…</span>';}
  const calEl=el('pm-range-wrap')?.querySelector('.cal');
  if(calEl)calEl.innerHTML=_buildPmRangeCal(window._pmRangeCal?.y||new Date().getFullYear(),window._pmRangeCal?.m??new Date().getMonth());
}
function pmClearRange(){
  if(el('pm-s-v'))el('pm-s-v').value='';if(el('pm-e-v'))el('pm-e-v').value='';
  _pmRangeState.picking='start';
  const lbl=el('pm-range-label');if(lbl)lbl.innerHTML='<span style="color:var(--muted);">Set dates…</span>';
  el('pm-range-wrap')?.querySelector('.cal')?.remove();
}

function filterProjProds(rowIdx,q){
  const container=document.getElementById('pm-sp-prods-'+rowIdx);
  if(!container)return;
  const term=q.toLowerCase().trim();
  container.querySelectorAll('[data-prod-search]').forEach(function(row){
    row.style.display=(!term||row.dataset.prodSearch.includes(term))?'':'none';
  });
}

function _calcRowTotal(products,savedProducts,i){
  // Called at render time only — returns HTML for the totals row
  const quantities=savedProducts.reduce((acc,sp)=>{
    if(sp.quantities)Object.entries(sp.quantities).forEach(([cat,qty])=>acc[cat]=(acc[cat]||0)+(parseInt(qty)||0));
    return acc;
  },{});
  const val=products.reduce((total,prod)=>{
    const saved=savedProducts.find(x=>x.name===prod.name);
    const lineQty=SP_PRODUCT_CATEGORIES.reduce((a,cat)=>a+(parseInt(saved?.quantities?.[cat])||0),0);
    return total+(prod.cost||0)*lineQty;
  },0);
  const catSums=SP_PRODUCT_CATEGORIES.map(cat=>{
    const total=products.reduce((a,prod)=>{
      const saved=savedProducts.find(x=>x.name===prod.name);
      return a+(parseInt(saved?.quantities?.[cat])||0);
    },0);
    return`<span style="font-size:.68rem;color:var(--muted);">${cat}: <strong style="color:${total>0?'var(--text)':'var(--muted)'};">${total}</strong></span>`;
  }).join('<span style="color:var(--border2);margin:0 4px;">·</span>');
  return`<span style="color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;">${catSums}</span><span style="font-family:'DM Mono',monospace;font-weight:700;color:var(--acc);">${val>0?`£${val.toFixed(2)}`:'No cost set'}</span>`;
}

function readProjSponsorRows(){
  const rows=[];
  const wrap=el('pm-sponsors-rows');if(!wrap)return rows;
  wrap.querySelectorAll('[id^="pm-sp-row-"]').forEach((row)=>{
    const rowIdx=row.id.replace('pm-sp-row-','');
    const spId=row.querySelector(`#pm-sp-id-${rowIdx}`)?.value||row.dataset.spid;
    if(!spId)return;
    const type=row.querySelector(`[id^="pm-sp-type-"]`)?.value||'product';
    const category=row.querySelector(`[id^="pm-sp-cat-"]`)?.value||'';
    const s=getSponsor(spId);
    // Find the existing project allocation for this sponsor so we can preserve
    // delivery fields (delivered, fulfillType, winners, activationInstructions)
    const projId=wrap.dataset.projId||'';
    const proj=projId?getProject(projId):null;
    const existingProjSp=proj?(proj.sponsors||[]).find(x=>x.id===spId):null;
    const products=(s?.products||[]).map((prod,pi)=>{
      const quantities={};
      let hasAny=false;
      SP_PRODUCT_CATEGORIES.forEach(cat=>{
        const inp=row.querySelector(`#pm-sp-qty-${rowIdx}-${pi}-${cat.replace(/\s/g,'_')}`);
        const qty=parseInt(inp?.value)||0;
        if(qty>0){quantities[cat]=qty;hasAny=true;}
      });
      // Find the existing allocation entry so we can preserve its extra fields
      const existingProd=(existingProjSp?.products||[]).find(p=>p.name===prod.name)||{};
      // Always include the product — merge new quantities with preserved delivery fields
      return{
        ...existingProd,
        name:prod.name,
        quantities:hasAny?quantities:(existingProd.quantities||{}),
      };
    });
    rows.push({id:spId,type,category,products});
  });
  return rows;
}

function saveProject(eid){
  const name=el('pm-name')?.value.trim();if(!name){if(el('pm-name'))el('pm-name').style.borderColor='var(--red)';return;}
  const newSponsors=readProjSponsorRows();
  const proj={id:eid||uid(),name,description:el('pm-desc')?.value.trim()||'',area:'',priority:el('pm-prio')?.value||'',ownerId:el('pm-owner')?.value||'',startDate:el('pm-s-v')?.value||dpVal('pm-s'),endDate:el('pm-e-v')?.value||dpVal('pm-e'),status:el('pm-status')?.value||'active',color:el('pm-clr')?.value||COLORS[0],graphicsUrl:el('pm-graphics')?.value.trim()||'',eventUrl:el('pm-eventurl')?.value.trim()||'',budget:parseFloat(el('pm-budget')?.value)||0,phaseWeeks:{planning:el('pm-phase-planning')?.value!==''?parseInt(el('pm-phase-planning').value):null,prelaunch:el('pm-phase-prelaunch')?.value!==''?parseInt(el('pm-phase-prelaunch').value):null,postEvent:el('pm-phase-postevent')?.value!==''?parseInt(el('pm-phase-postevent').value):null},expenses:[],sponsors:newSponsors};
  if(eid){
    const i=S.projects.findIndex(p=>p.id===eid);
    if(i>=0){
      const old=S.projects[i];
      proj.expenses=old.expenses||[];
      proj.quickLinks=old.quickLinks||[];
      // Merge product allocations: if a sponsor row didn't show product checkboxes
      // (because the sponsor had no products), preserve any existing allocation
      proj.sponsors=newSponsors.map(sp=>{
        const oldSp=(old.sponsors||[]).find(o=>o.id===sp.id);
        // Spread old to preserve invoiceSent, invoicePaid, prizeHistory, etc.
        // products already contain preserved delivery fields from readProjSponsorRows
        return{...(oldSp||{}),id:sp.id,type:sp.type,category:sp.category,products:sp.products};
      });
      // Find newly added sponsors
      const oldSpIds=(old.sponsors||[]).map(s=>s.id);
      const addedSponsors=proj.sponsors.filter(s=>!oldSpIds.includes(s.id));
      S.projects[i]={...old,...proj};
      addedSponsors.forEach(sp=>autoGenerateSponsorTasks(eid,sp));
    }
  } else {
    S.projects.push(proj);
    newSponsors.forEach(sp=>autoGenerateSponsorTasks(proj.id,sp));
    // Apply project template tasks if one was selected
    const tmpl=window._pendingProjTmpl;
    if(tmpl&&tmpl.tasks){
      const applyTasks=(tasks,parentId=null)=>{
        tasks.forEach(t=>{
          const taskId=uid();
          S.tasks.push({
            id:taskId,name:t.name,description:t.description||'',
            projectId:proj.id,parentId,
            priority:t.priority||'Medium',assignees:[],labels:[],
            blockedBy:[],startDate:'',endDate:'',kStatus:'todo',
            done:false,recur:{enabled:false,type:'weekly',interval:1},slackReminder:{}
          });
          if(t.subtasks&&t.subtasks.length>0)applyTasks(t.subtasks,taskId);
        });
      };
      applyTasks(tmpl.tasks);
    }
    // Apply template expenses if present
    if(tmpl&&tmpl.expenses&&tmpl.expenses.length>0){
      const idx=S.projects.findIndex(p=>p.id===proj.id);
      if(idx>=0)S.projects[idx].expenses=tmpl.expenses.map(e=>({...e,id:uid(),date:toISO(new Date())}));
    }
    // Apply template tools if present
    if(tmpl&&tmpl.tools&&tmpl.tools.length>0){
      const idx=S.projects.findIndex(p=>p.id===proj.id);
      if(idx>=0)S.projects[idx].tools=tmpl.tools.map(t=>({...t,id:uid()}));
    }
    window._pendingProjTmpl=null;
  }
  save();closeModal();render();
}

function autoGenerateSponsorTasks(projectId,sponsorAssignment){
  const sponsor=getSponsor(sponsorAssignment.id);
  if(!sponsor)return;
  const type=sponsorAssignment.type||'product';

  // Check if a task for this sponsor already exists in this project
  const existing=S.tasks.find(t=>t.projectId===projectId&&t._sponsorId===sponsorAssignment.id&&!t.parentId);
  if(existing)return;

  // Look up a template tagged with this sponsorship type (prefer non-built-in first)
  const matchingTemplate=
    S.taskTemplates.find(t=>t.sponsorType===type&&!t._builtIn)||
    S.taskTemplates.find(t=>t.sponsorType===type);

  const typeLabel=SP_TYPES[type]?.label||type;
  const parentId=uid();

  S.tasks.push({
    id:parentId,
    name:`${sponsor.name} — ${typeLabel} Sponsorship`,
    description:matchingTemplate
      ?`Tasks from template: "${matchingTemplate.name}"`
      :`Auto-generated tasks for ${sponsor.name} ${typeLabel.toLowerCase()} sponsorship.`,
    projectId,parentId:null,
    priority:'High',
    assignees:[],labels:[],blockedBy:[],
    startDate:'',endDate:'',
    kStatus:'todo',done:false,
    recur:{enabled:false,type:'weekly',interval:1},
    slackReminder:{},
    _sponsorId:sponsorAssignment.id,
    _sponsorType:type
  });

  // Use template tasks if found, otherwise fall back to hardcoded SP_TYPE_SUBTASKS
  if(matchingTemplate&&matchingTemplate.tasks?.length){
    matchingTemplate.tasks.forEach(tmplTask=>{
      const taskId=uid();
      S.tasks.push({
        id:taskId,name:tmplTask.name,description:'',
        projectId,parentId,
        priority:tmplTask.priority||'Medium',
        assignees:[],labels:[],blockedBy:[],
        startDate:'',endDate:'',
        kStatus:'todo',done:false,
        recur:{enabled:false,type:'weekly',interval:1},
        slackReminder:{}
      });
      // Also create subtasks from template if any
      (tmplTask.subtasks||[]).forEach(sub=>{
        S.tasks.push({
          id:uid(),name:sub.name,description:'',
          projectId,parentId:taskId,
          priority:sub.priority||'Medium',
          assignees:[],labels:[],blockedBy:[],
          startDate:'',endDate:'',
          kStatus:'todo',done:false,
          recur:{enabled:false,type:'weekly',interval:1},
          slackReminder:{}
        });
      });
    });
  } else {
    // Fallback: hardcoded defaults
    (SP_TYPE_SUBTASKS[type]||[]).forEach(name=>{
      S.tasks.push({
        id:uid(),name,description:'',
        projectId,parentId,
        priority:'Medium',
        assignees:[],labels:[],blockedBy:[],
        startDate:'',endDate:'',
        kStatus:'todo',done:false,
        recur:{enabled:false,type:'weekly',interval:1},
        slackReminder:{}
      });
    });
  }
}

/* ── Range date picker for task modal ── */
let _rangeState={picking:'start'}; // 'start' or 'end'
function tmOpenRangeCal(){
  const wrap=el('tm-range-wrap');if(!wrap)return;
  // If already open, close it
  const existing=wrap.querySelector('.cal');
  if(existing){existing.remove();return;}
  // Close any other open cals
  document.querySelectorAll('.cal').forEach(c=>c.remove());
  const now=new Date();
  if(!window._rangeCal)window._rangeCal={y:now.getFullYear(),m:now.getMonth()};
  // If existing dates, open to start date month
  const sv=el('tm-s-v')?.value;
  if(sv){const d=new Date(sv);window._rangeCal={y:d.getFullYear(),m:d.getMonth()};}
  const pop=document.createElement('div');
  pop.className='cal';
  pop.style.cssText='position:absolute;top:calc(100% + 4px);left:0;z-index:700;width:220px;';
  pop.addEventListener('click',e=>e.stopPropagation());
  pop.innerHTML=_buildRangeCal(window._rangeCal.y,window._rangeCal.m);
  wrap.appendChild(pop);
}
function _buildRangeCal(y,m){
  const mn=['January','February','March','April','May','June','July','August','September','October','November','December'][m];
  const fd=new Date(y,m,1).getDay();
  const dm=new Date(y,m+1,0).getDate();
  const tod=toISO(new Date());
  const sv=el('tm-s-v')?.value||'';
  const ev=el('tm-e-v')?.value||'';
  let cells=['M','T','W','T','F','S','S'].map(d=>`<div class="cal-dow">${d}</div>`).join('');
  const off=(fd+6)%7;
  for(let i=0;i<off;i++)cells+=`<div class="cal-d empty"></div>`;
  for(let d=1;d<=dm;d++){
    const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    let cls='cal-d';
    if(ds===tod)cls+=' today';
    if(sv&&ds===sv)cls+=' range-start';
    else if(ev&&ds===ev)cls+=' range-end';
    else if(sv&&ev&&ds>sv&&ds<ev)cls+=' in-range';
    cells+=`<button class="${cls}" onclick="tmRangePickDay('${ds}')">${d}</button>`;
  }
  const pickLabel=_rangeState.picking==='start'?'picking start date':'picking end date';
  return`<div class="cal-nav">
    <button class="cal-nb" onclick="event.stopPropagation();window._rangeCal.m--;if(window._rangeCal.m<0){window._rangeCal.m=11;window._rangeCal.y--;}el('tm-range-wrap').querySelector('.cal').innerHTML=_buildRangeCal(window._rangeCal.y,window._rangeCal.m)">‹</button>
    <span class="cal-mo">${mn} ${y}</span>
    <button class="cal-nb" onclick="event.stopPropagation();window._rangeCal.m++;if(window._rangeCal.m>11){window._rangeCal.m=0;window._rangeCal.y++;}el('tm-range-wrap').querySelector('.cal').innerHTML=_buildRangeCal(window._rangeCal.y,window._rangeCal.m)">›</button>
  </div>
  <div class="cal-grid">${cells}</div>
  <div class="cal-hint">${sv&&ev?`${fmtD(sv)} → ${fmtD(ev)}`:sv?`Start: ${fmtD(sv)} — now pick end`:pickLabel}</div>
  <div class="cal-ft">
    <button class="btn btn-ghost btn-xs" onclick="event.stopPropagation();tmClearRange()">Clear</button>
    <button class="btn btn-ghost btn-xs" onclick="event.stopPropagation();el('tm-range-wrap').querySelector('.cal')?.remove()">Done</button>
  </div>`;
}
function tmRangePickDay(ds){
  const sv=el('tm-s-v')?.value||'';
  const ev=el('tm-e-v')?.value||'';
  if(!sv||_rangeState.picking==='start'||(sv&&ev)){
    // Set start, clear end, wait for end
    if(el('tm-s-v'))el('tm-s-v').value=ds;
    if(el('tm-e-v'))el('tm-e-v').value='';
    _rangeState.picking='end';
  } else {
    // Set end — if before start, swap
    if(ds<sv){
      if(el('tm-e-v'))el('tm-e-v').value=sv;
      if(el('tm-s-v'))el('tm-s-v').value=ds;
    } else {
      if(el('tm-e-v'))el('tm-e-v').value=ds;
    }
    _rangeState.picking='start';
  }
  // Update display
  const newSv=el('tm-s-v')?.value||'';
  const newEv=el('tm-e-v')?.value||'';
  const lbl=el('tm-range-label');
  if(lbl){
    if(newSv||newEv){lbl.innerHTML=`${newSv?fmtD(newSv):'—'} → ${newEv?fmtD(newEv):'—'}`;}
    else{lbl.innerHTML='<span style="color:var(--muted);">Set dates…</span>';}
  }
  // Refresh cal
  const calEl=el('tm-range-wrap')?.querySelector('.cal');
  if(calEl){
    calEl.innerHTML=_buildRangeCal(window._rangeCal?.y||new Date().getFullYear(),window._rangeCal?.m??new Date().getMonth());
  }
}
function tmClearRange(){
  if(el('tm-s-v'))el('tm-s-v').value='';
  if(el('tm-e-v'))el('tm-e-v').value='';
  _rangeState.picking='start';
  const lbl=el('tm-range-label');
  if(lbl)lbl.innerHTML='<span style="color:var(--muted);">Set dates…</span>';
  // Remove clear button from display
  el('tm-range-display')?.querySelector('.date-clr')?.remove();
  el('tm-range-wrap')?.querySelector('.cal')?.remove();
}

function toggleMsOpt(field,id){const tags=el(`${field}-tags`);if(!tags)return;const ex=tags.querySelector(`[data-id="${id}"]`);if(ex){ex.remove();_refreshMsPlaceholder(field);}else{let h='';if(field==='tm-av'){const m=getMember(id);if(m)h=`<span class="ms-tag" data-id="${id}">${m.name}<span class="ms-rm" onclick="rmMs('tm-av','${id}')">×</span></span>`;}else{const l=getLabel(id);if(l)h=`<span class="ms-tag" data-id="${id}" style="background:${l.color}22;border-color:${l.color}44;color:${l.color};">${l.name}<span class="ms-rm" onclick="rmMs('tm-lb','${id}')">×</span></span>`;}const ph=tags.querySelector('span[style*="color:var(--muted)"]');if(ph)ph.remove();tags.insertAdjacentHTML('beforeend',h);}const dd=el(`${field}-dd`);dd?.querySelector(`[data-id="${id}"]`)?.classList.toggle('sel');}

function saveTask(eid,defParent,tmplId){
  const name=el('tm-name')?.value.trim();if(!name){if(el('tm-name'))el('tm-name').style.borderColor='var(--red)';return;}
  // Collect assignees from avatar toggle grid
  const assignees=Array.from(document.querySelectorAll('#tm-av-grid .av-toggle.active')).map(el=>el.dataset.id).filter(Boolean);
  // Collect labels from pill grid
  const labels=Array.from(document.querySelectorAll('#tm-lb-pills .pill-opt.active')).map(el=>el.dataset.id).filter(Boolean);
  const recurOn=el('recur-sw')?.classList.contains('on');
  const parentVal=el('tm-parent')?.value||defParent||null;
  const oldTask=eid?getTask(eid):null;
  const task={id:eid||uid(),name,description:el('tm-desc-body')?.value.trim()||'',projectId:el('tm-proj')?.value||'',parentId:parentVal||null,priority:el('tm-prio')?.value||'Medium',phase:el('tm-phase')?.value||'',assignees,labels,blockedBy:oldTask?.blockedBy||[],startDate:el('tm-s-v')?.value||'',endDate:el('tm-e-v')?.value||'',kStatus:oldTask?.kStatus||'todo',done:false,recur:{enabled:recurOn,type:el('recur-type')?.value||'weekly',interval:parseInt(el('recur-n')?.value||1)||1},slackReminder:{}};
  if(eid&&oldTask){task.done=oldTask.done;task.slackReminder=oldTask.slackReminder||{};task.kStatus=oldTask.kStatus||'todo';}
  if(eid){const i=S.tasks.findIndex(t=>t.id===eid);if(i>=0)S.tasks[i]=task;}else S.tasks.unshift(task);
  // From template — create subtasks, applying phase/assignees/labels
  if(!eid&&tmplId){const tmpl=S.taskTemplates.find(t=>t.id===tmplId);if(tmpl?.tasks){tmpl.tasks.forEach(st=>{const sub={id:uid(),name:st.name,description:'',projectId:task.projectId,parentId:task.id,priority:st.priority||'Medium',phase:st.phase||'',assignees:st.assignees||[],labels:st.labels||[],blockedBy:[],startDate:'',endDate:'',kStatus:'todo',done:false,recur:{enabled:false,type:'weekly',interval:1},slackReminder:{}};S.tasks.push(sub);if(st.subtasks)st.subtasks.forEach(ss=>{S.tasks.push({...sub,id:uid(),name:ss.name,priority:ss.priority||'Medium',phase:ss.phase||'',assignees:ss.assignees||[],labels:ss.labels||[],parentId:sub.id});});});}}
  // Auto-sync kStatus for blocked state when dependencies change
  syncBlockedStatus(task.id);
  (task.blockedBy||[]).forEach(bid=>{
    S.tasks.filter(t=>t.blockedBy?.includes(bid)).forEach(t=>syncBlockedStatus(t.id));
  });
  saveWithUndo(eid?'Edit task':'New task');closeModal();render();
}

function previewMemberPhoto(input){

  };
  reader.readAsDataURL(file);
}
function saveMember(eid){
  const name=el('mm-name')?.value.trim();if(!name)return;
  const initials=name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
  const old=eid?S.members.find(m=>m.id===eid):null;
  const photoFile=el('mm-photo')?.files[0];
  const clearPhoto=el('mm-photo-clear')?.value==='1';
  // Spread old first so all fields (motivations, etc.) are preserved, then overwrite editable ones
  const member={
    ...(old||{}),
    id:eid||uid(),
    name,initials,
    email:el('mm-email')?.value.trim()||old?.email||'',
    color:el('mm-clr')?.value||COLORS[0],
    isDirector:el('mm-director')?.checked||false,
    timeLog:old?.timeLog||[],
    photoUrl:clearPhoto?null:(old?.photoUrl||null),
  };
  if(photoFile){
    const reader=new FileReader();
    reader.onload=e=>{member.photoUrl=e.target.result;if(eid){const i=S.members.findIndex(m=>m.id===eid);if(i>=0)S.members[i]=member;}else S.members.push(member);save();closeModal();render();};
    reader.readAsDataURL(photoFile);return;
  }
  if(eid){const i=S.members.findIndex(m=>m.id===eid);if(i>=0)S.members[i]=member;}else S.members.push(member);
  save();closeModal();render();
}

}

function saveMemberProfile(id){
  const m=getMember(id);if(!m)return;
  ['motivWhy','motivWant','motivTravel','motivExperiences','motivProducts'].forEach(k=>{
    const el2=el(`mp-${k}`);
    if(el2)m[k]=el2.value.trim();
  });
  save();closeModal();showToast('Profile saved');
}

function _refreshProfileModal(id, tab){
  const mc=el('mc');
  if(mc)mc.innerHTML=`<div class="mo" onclick="if(event.target.classList.contains('mo'))closeModal()">${memberProfileModalHtml(id,tab)}</div>`;
}

function quickLogHours(memberId){
  const m=getMember(memberId);if(!m)return;
  const h=parseFloat(el('qlog-h')?.value||0);
  if(!h||h<=0){showToast('Enter valid hours');return;}
  if(!m.timeLog)m.timeLog=[];
  m.timeLog.push({id:uid(),hours:h,date:toISO(new Date()),projectId:el('qlog-proj')?.value||'',note:el('qlog-note')?.value.trim()||''});
  save();
  _refreshProfileModal(memberId,'hours');
  showToast(`${h}h logged`);
}

function delMemberLogAndRefresh(memberId,entryId){
  const m=getMember(memberId);if(!m)return;
  m.timeLog=(m.timeLog||[]).filter(e=>e.id!==entryId);
  save();
  _refreshProfileModal(memberId,'hours');
}

function addTmplT(){
  const n=el('tt-t-name')?.value.trim();if(!n)return;
  const phase=el('tt-t-phase')?.value||'';
  const assignees=Array.from(document.querySelectorAll('#tt-t-av .av-toggle.active')).map(x=>x.dataset.id).filter(Boolean);
  const labels=Array.from(document.querySelectorAll('#tt-t-lb .pill-opt.active')).map(x=>x.dataset.id).filter(Boolean);

  const inp=el('tt-t-name');if(inp){inp.value='';inp.focus();}
  document.querySelectorAll('#tt-t-av .av-toggle').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('#tt-t-lb .pill-opt').forEach(x=>{x.classList.remove('active');x.style.background='';});

function rmTmplT(i){if(_ttEditing===i)_ttEditing=-1;_ttBuf.splice(i,1);renderTtBuf();}
function moveTmplT(i,dir){const j=i+dir;if(j<0||j>=_ttBuf.length)return;[_ttBuf[i],_ttBuf[j]]=[_ttBuf[j],_ttBuf[i]];if(_ttEditing===i)_ttEditing=j;else if(_ttEditing===j)_ttEditing=i;renderTtBuf();}

  const labels=Array.from(document.querySelectorAll('#tt-sub-lb-'+ti+' .pill-opt.active')).map(x=>x.dataset.id).filter(Boolean);
  const phase=el('tt-sub-phase-'+ti)?.value||'';
  if(!_ttBuf[ti].subtasks)_ttBuf[ti].subtasks=[];

  const t=_ttBuf[i];if(!t)return;

  t.phase=el('tt-edit-phase-'+i)?.value||'';

  const l=el('tt-task-list');if(!l)return;

      ...(t.labels||[]).map(id=>{const lb=getLabel(id);return lb?`<span style="font-size:.6rem;padding:1px 6px;border-radius:3px;background:${lb.color}22;color:${lb.color};border:1px solid ${lb.color}44;">${lb.name}</span>`:'';}).filter(Boolean),
    ].filter(Boolean).join('');

    if(isEditing){
      return`<div style="background:var(--surface2);border:1.5px solid var(--acc);border-radius:9px;padding:12px;margin-bottom:6px;">

        <input class="inp" id="tt-edit-name-${i}" value="${t.name}" placeholder="Task name…" style="margin-bottom:9px;">
        ${S.members.length>0?`<div style="margin-bottom:9px;"><label class="flbl">Assignees</label><div class="av-toggle-grid" id="tt-edit-av-${i}">${S.members.map(m=>`<div class="av-toggle${(t.assignees||[]).includes(m.id)?' active':''}" onclick="this.classList.toggle('active')" data-id="${m.id}">${avHtml(m.id,18)}<span>${m.name.split(' ')[0]}</span></div>`).join('')}</div></div>`:''}
        ${S.labels.length>0?`<div style="margin-bottom:9px;"><label class="flbl">Labels</label><div class="pill-sel" id="tt-edit-lb-${i}">${S.labels.map(lb=>{const sel=(t.labels||[]).includes(lb.id);return`<span class="pill-opt${sel?' active':''}" style="border-color:${lb.color}${sel?'':44};color:${lb.color}${sel?'':'88'};${sel?'background:'+lb.color+'22;':''}" onclick="this.classList.toggle('active');const on=this.classList.contains('active');this.style.background=on?'${lb.color}22':'';this.style.borderColor=on?'${lb.color}':'${lb.color}44';this.style.color=on?'${lb.color}':'${lb.color}88';" data-id="${lb.id}">${lb.name}</span>`;}).join('')}</div></div>`:''}
        <div style="margin-bottom:10px;"><label class="flbl">Phase</label>
          <div class="pill-sel">

function saveTmpl(eid){
  const name=el('tt-name')?.value.trim();if(!name)return;
  const sponsorType=el('tt-sp-type')?.value||null;
  const existing=eid?S.taskTemplates.find(t=>t.id===eid):null;
  const tmpl={
    id:eid||uid(),name,
    description:el('tt-desc')?.value.trim()||'',

    tasks:[..._ttBuf]
  };

/* Create built-in sponsor templates on first load if they don't exist */
function ensureBuiltInSponsorTemplates(){
  Object.entries(SP_TYPE_SUBTASKS).forEach(([type,subtasks])=>{
    const exists=S.taskTemplates.some(t=>t.sponsorType===type&&t._builtIn);
    if(exists)return;
    const typeLabel=SP_TYPES[type]?.label||type;
    S.taskTemplates.push({
      id:'sp-tmpl-'+type,
      name:`${typeLabel} Sponsorship`,
      description:`Auto-generated tasks for ${typeLabel.toLowerCase()} sponsors. Edit to customise.`,
      sponsorType:type,
      _builtIn:true,
      tasks:subtasks.map(name=>({name,priority:'Medium',subtasks:[]}))
    });
  });
}

/* ════ DATE PICKER ════ */
let calState={};
function dpHtml(field,val){
  return`<div class="date-wrap" id="${field}-dw"><div class="date-btn" onclick="openCal('${field}')"><span id="${field}-ds" style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;${val?'':'color:var(--muted);'}">${val?fmtD(val):'Select date…'}</span>${val?`<button class="date-clr" onclick="event.stopPropagation();clrDate('${field}')">×</button>`:''}<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></div><input type="hidden" id="${field}-v" value="${val||''}"></div>`;
}
function dpVal(field){return el(`${field}-v`)?.value||'';}
function openCal(field){document.querySelectorAll('.cal').forEach(c=>c.remove());const now=new Date();const y=calState[field]?.y||now.getFullYear();const m=calState[field]?.m??now.getMonth();calState[field]={y,m};const dw=el(`${field}-dw`);if(!dw)return;const pop=document.createElement('div');pop.className='cal';pop.id=`${field}-cal`;pop.innerHTML=buildCal(field,y,m);pop.addEventListener('click',e=>e.stopPropagation());dw.appendChild(pop);}
function buildCal(field,y,m){const mn=['January','February','March','April','May','June','July','August','September','October','November','December'][m];const fd=new Date(y,m,1).getDay();const dm=new Date(y,m+1,0).getDate();const tod=toISO(new Date());const sel=dpVal(field);let cells=['M','T','W','T','F','S','S'].map(d=>`<div class="cal-dow">${d}</div>`).join('');const off=(fd+6)%7;for(let i=0;i<off;i++)cells+=`<div class="cal-d empty"></div>`;for(let d=1;d<=dm;d++){const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;cells+=`<button class="cal-d${ds===tod?' today':''}${ds===sel?' sel':''}" onclick="selDate('${field}','${ds}')">${d}</button>`;}
return`<div class="cal-nav"><button class="cal-nb" onclick="event.stopPropagation();shiftCal('${field}',-1)">‹</button><span class="cal-mo">${mn} ${y}</span><button class="cal-nb" onclick="event.stopPropagation();shiftCal('${field}',1)">›</button></div><div class="cal-grid">${cells}</div><div class="cal-ft"><button class="btn btn-ghost btn-xs" onclick="event.stopPropagation();clrDate('${field}');el('${field}-cal')?.remove()">Clear</button><button class="btn btn-ghost btn-xs" onclick="event.stopPropagation();el('${field}-cal')?.remove()">Close</button></div>`;}
function shiftCal(field,dir){if(!calState[field])return;let{y,m}=calState[field];m+=dir;if(m>11){m=0;y++;}if(m<0){m=11;y--;}calState[field]={y,m};const p=el(`${field}-cal`);if(p)p.innerHTML=buildCal(field,y,m);}
function selDate(field,ds){
  const inp=el(`${field}-v`);if(inp)inp.value=ds;
  const disp=el(`${field}-ds`);
  if(disp){disp.textContent=fmtD(ds);disp.style.color='';}
  // Add clear button if not present
  const btn=disp?.closest('.date-btn');
  if(btn&&!btn.querySelector('.date-clr')){
    const clr=document.createElement('button');
    clr.className='date-clr';clr.textContent='×';
    clr.onclick=e=>{e.stopPropagation();clrDate(field);};
    const svg=btn.querySelector('svg');
    if(svg)btn.insertBefore(clr,svg);else btn.appendChild(clr);
  }
  el(`${field}-cal`)?.remove();
}
function clrDate(field){
  const i=el(`${field}-v`);if(i)i.value='';
  const d=el(`${field}-ds`);if(d){d.textContent='Select date…';d.style.color='var(--muted)';}
  el(`${field}-dw`)?.querySelector('.date-clr')?.remove();
}
