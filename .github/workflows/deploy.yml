name: Deploy to Droplet

# Upload any of these four files to the main folder of the repository on GitHub and they are checked, sent to the server and
# installed. Only the files that changed in that upload are sent. If PocketBase reports an error after a server file is
# installed, the previous files are put back automatically and this run turns red.
on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'pf_slack_lib.js'
      - 'projectflow_slack.pb.js'
      - 'projectflow_guard.pb.js'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out which files changed
        id: pick
        run: |
          set -e
          mkdir -p staged
          before="${{ github.event.before }}"
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            changed="index.html pf_slack_lib.js projectflow_slack.pb.js projectflow_guard.pb.js"
          else
            changed="$(git diff --name-only "$before" "${{ github.sha }}")"
          fi
          n=0
          for f in index.html pf_slack_lib.js projectflow_slack.pb.js projectflow_guard.pb.js; do
            if echo "$changed" | tr ' ' '\n' | grep -qx "$f" && [ -f "$f" ]; then
              cp "$f" "staged/$f"; n=$((n+1)); echo "will send: $f"
            fi
          done
          echo "count=$n" >> "$GITHUB_OUTPUT"
          if [ "$n" = "0" ]; then echo "Nothing to send."; fi

      - name: Check the files before sending
        if: steps.pick.outputs.count != '0'
        run: |
          set -e
          cd staged
          for f in *.js; do
            [ -e "$f" ] || continue
            node --check "$f"
            if LC_ALL=C grep -nP '[^\x00-\x7F]' "$f"; then echo "::error::$f contains characters that are not plain ASCII"; exit 1; fi
            echo "ok: $f"
          done
          if [ -f pf_slack_lib.js ]; then node -e "require('./pf_slack_lib.js')"; fi
          if [ -f index.html ]; then
            size=$(wc -c < index.html)
            if [ "$size" -lt 500000 ] || ! grep -q "PF_BUILD" index.html || ! grep -q "</html>" index.html; then echo "::error::index.html does not look like a complete ProjectFlow page"; exit 1; fi
            echo "ok: index.html ($size bytes)"
          fi

      - name: Send the files to the Droplet
        if: steps.pick.outputs.count != '0'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: root
          key: ${{ secrets.DROPLET_SSH_KEY }}
          source: "staged/*"
          target: /opt/pocketbase/deploy_incoming/
          strip_components: 1
          overwrite: true

      - name: Install them (with a backup and an automatic undo)
        if: steps.pick.outputs.count != '0'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: root
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script_stop: true
          script: |
            PB=/opt/pocketbase
            IN="$PB/deploy_incoming"
            STAMP="$(date +%Y%m%d-%H%M%S)"
            BK="$PB/backups/$STAMP"
            mkdir -p "$BK"
            HOOKS=0
            for f in pf_slack_lib.js projectflow_slack.pb.js projectflow_guard.pb.js; do
              if [ -f "$IN/$f" ]; then
                if [ -f "$PB/pb_hooks/$f" ]; then cp "$PB/pb_hooks/$f" "$BK/$f"; else : > "$BK/$f.new"; fi
                HOOKS=1
              fi
            done
            if [ -f "$IN/index.html" ] && [ -f "$PB/pb_public/index.html" ]; then cp "$PB/pb_public/index.html" "$BK/index.html"; fi
            START="$(date '+%Y-%m-%d %H:%M:%S')"
            # the library first, then the hook files that use it
            for f in pf_slack_lib.js projectflow_slack.pb.js projectflow_guard.pb.js; do
              if [ -f "$IN/$f" ]; then cp "$IN/$f" "$PB/pb_hooks/$f"; echo "installed $f"; fi
            done
            if [ -f "$IN/index.html" ]; then cp "$IN/index.html" "$PB/pb_public/index.html"; echo "installed index.html"; fi
            rm -f "$IN"/*
            if [ "$HOOKS" = "1" ]; then
              sleep 10
              BAD="$(journalctl -u pocketbase --since "$START" --no-pager 2>/dev/null | grep -Ei 'SyntaxError|Invalid module|GoError|pf-slack\] error|panic' || true)"
              HEALTH=0; curl -fs -m 5 http://127.0.0.1:8090/api/health >/dev/null && HEALTH=1
              if [ -n "$BAD" ] || [ "$HEALTH" != "1" ]; then
                echo "PocketBase reported a problem after the update:"; echo "$BAD" | head -n 6
                for f in pf_slack_lib.js projectflow_slack.pb.js projectflow_guard.pb.js; do
                  if [ -f "$BK/$f" ]; then cp "$BK/$f" "$PB/pb_hooks/$f"; echo "put back $f"; fi
                  if [ -f "$BK/$f.new" ]; then rm -f "$PB/pb_hooks/$f"; echo "removed $f (it did not exist before)"; fi
                done
                sleep 6
                echo "The previous server files are back. Nothing was lost. This run is marked as failed on purpose."
                exit 1
              fi
              echo "PocketBase is healthy with the new server files."
            fi
            ls -1dt "$PB"/backups/*/ 2>/dev/null | tail -n +11 | xargs -r rm -rf
            echo "Done. Backup of the old files: $BK"
